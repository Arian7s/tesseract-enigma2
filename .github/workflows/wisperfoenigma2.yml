name: Build Whisper STT for Enigma2 (English Only)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-enigma2:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7l
            compiler_prefix: arm-linux-gnueabihf
            gcc_pkg: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            extra_cflags: "-mfpu=neon -mfloat-abi=hard"
          - arch: aarch64
            compiler_prefix: aarch64-linux-gnu
            gcc_pkg: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            extra_cflags: ""

    steps:
      - name: Checkout whisper.cpp Repository
        uses: actions/checkout@v4
        with:
          repository: 'ggerganov/whisper.cpp'
          fetch-depth: 1

      - name: Install Cross Compiler & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential curl wget ${{ matrix.gcc_pkg }}

      - name: Download English Tiny Quantized Model (31MB)
        run: |
          mkdir -p models
          curl -L -o models/ggml-tiny.en-q4_0.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q4_0.bin"
          echo "Model downloaded successfully:"
          ls -lh models/ggml-tiny.en-q4_0.bin

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler_prefix }}-gcc \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler_prefix }}-g++ \
            -DCMAKE_C_FLAGS="${{ matrix.extra_cflags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.extra_cflags }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_NEON=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DWHISPER_BUILD_EXAMPLES=ON

      - name: Build Shared Library and CLI Binary
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Package Release Bundle
        run: |
          mkdir -p package/bin package/lib package/models
          
          # Copy binaries and shared objects
          cp build/bin/whisper-cli package/bin/ 2>/dev/null || cp build/bin/main package/bin/whisper-cli
          cp build/src/libwhisper.so package/lib/ 2>/dev/null || cp build/libwhisper.so package/lib/
          
          # Copy English Model
          cp models/ggml-tiny.en-q4_0.bin package/models/
          
          # Create helper execution script
          cat << 'EOF' > package/test_stt.sh
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          "$DIR/bin/whisper-cli" -m "$DIR/models/ggml-tiny.en-q4_0.bin" -f "$1" -l en
          EOF
          chmod +x package/test_stt.sh package/bin/whisper-cli

          # Compress to tar.gz
          cd package
          tar -czvf ../whisper-enigma2-${{ matrix.arch }}-english.tar.gz *

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-enigma2-${{ matrix.arch }}-english
          path: whisper-enigma2-${{ matrix.arch }}-english.tar.gz
          retention-days: 14
