name: Build Vosk for Enigma2 armv7l

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf build-essential wget unzip binutils-arm-linux-gnueabihf

      - name: Download Vosk ARMv7l Release
        run: |
          wget https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-linux-armv7l-0.3.45.zip
          unzip vosk-linux-armv7l-0.3.45.zip

      - name: Patch ELF and Remove Executable Stack Restriction
        run: |
          cd vosk-linux-armv7l-0.3.45
          echo "Checking current stack configuration..."
          readelf -l libvosk.so | grep GNU_STACK || true
          
          # استخدام patchelf أو تعديل الترويسة لتصبح غير تنفيذية (RW) لتتوافق مع نواة الرسيفر الصارمة
          # تعيين PT_GNU_STACK ليكون RW (Read/Write فقط بدون Execute)
          patchelf --set-stack-size 0 libvosk.so || true
          
          # تعديل بايتات الـ ELF يدويًا لضمان خلوها من تطلب Stack تنفيذي
          python3 -c '
          path = "libvosk.so"
          with open(path, "rb") as f:
              content = bytearray(f.read())
          pos = content.find(b"GNU_STACK")
          if pos != -1:
              for i in range(pos - 32, pos):
                  if content[i] == 7:
                      content[i] = 6
          with open(path, "wb") as f:
              f.write(content)
          '
          
          echo "Patched stack configuration:"
          readelf -l libvosk.so | grep GNU_STACK || true

      - name: Package Build Artifacts
        run: |
          zip -r vosk-sf8008-armv7l-patched.zip vosk-linux-armv7l-0.3.45/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vosk-patched-armv7l
          path: vosk-sf8008-armv7l-patched.zip
