name: Build Whisper STT (Fix OpenMP Freeze)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-armv7l:
    name: Build for armv7l (No OpenMP)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: 'ggerganov/whisper.cpp'
          fetch-depth: 1

      - name: Install Cross Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential wget gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Download Tiny English Model
        run: |
          mkdir -p models
          wget --no-check-certificate -O models/ggml-tiny.en.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin"

      - name: Configure CMake (Disabling OpenMP & Enforcing Pthreads)
        run: |
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_C_FLAGS="-mfpu=neon -mfloat-abi=hard -O3" \
            -DCMAKE_CXX_FLAGS="-mfpu=neon -mfloat-abi=hard -O3" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_NEON=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DWHISPER_BUILD_EXAMPLES=ON

      - name: Build
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Package Release Bundle
        run: |
          mkdir -p package/bin package/lib package/models
          
          find build/ -type f \( -name "whisper-cli" -o -name "main" \) -exec cp {} package/bin/whisper-cli \;
          find build/ -type f -name "*.so*" -exec cp {} package/lib/ \;
          cp models/ggml-tiny.en.bin package/models/
          
          cd package
          tar -czvf ../whisper-armv7l-no-openmp.tar.gz *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-armv7l-no-openmp
          path: whisper-armv7l-no-openmp.tar.gz
