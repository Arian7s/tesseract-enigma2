name: Build Tesseract 5.5.3 ARMv7l

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TARGET: arm-linux-gnueabihf
      SYSROOT: ${{ github.workspace }}/sysroot
      BUILD: ${{ github.workspace }}/build
      PREFIX: /usr

      ZLIB_VERSION: 1.3.2
      LIBPNG_VERSION: 1.6.58
      LIBJPEG_VERSION: 3.2.0
      LIBTIFF_VERSION: 4.7.2
      LEPTONICA_VERSION: 1.87.0
      TESSERACT_VERSION: 5.5.3

    steps:

      # ==========================================================
      # PREPARE HOST
      # ==========================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            make \
            curl \
            wget \
            file \
            git \
            cmake \
            ninja-build \
            xz-utils \
            tar \
            gzip \
            binutils \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf

      # ==========================================================
      # PREPARE DIRECTORIES
      # ==========================================================

      - name: Prepare build environment
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$SYSROOT"
          rm -rf "$BUILD"

          mkdir -p "$SYSROOT"
          mkdir -p "$SYSROOT/include"
          mkdir -p "$SYSROOT/lib"
          mkdir -p "$SYSROOT/bin"

          mkdir -p "$BUILD"

          echo "TARGET=$TARGET"
          echo "SYSROOT=$SYSROOT"
          echo "BUILD=$BUILD"

          "$TARGET-gcc" --version
          "$TARGET-g++" --version

      # ==========================================================
      # DOWNLOAD SOURCES
      # ==========================================================

      - name: Download sources
        shell: bash
        run: |
          set -euxo pipefail

          cd "$BUILD"

          echo "=========================================================="
          echo "DOWNLOAD"
          echo "=========================================================="

          curl -L --fail --retry 5 \
            -o "zlib-$ZLIB_VERSION.tar.xz" \
            "https://zlib.net/current/zlib-$ZLIB_VERSION.tar.xz"

          curl -L --fail --retry 5 \
            -o "libpng-$LIBPNG_VERSION.tar.gz" \
            "https://download.sourceforge.net/libpng/libpng-$LIBPNG_VERSION.tar.xz"

          curl -L --fail --retry 5 \
            -o "libjpeg-turbo-$LIBJPEG_VERSION.tar.gz" \
            "https://downloads.sourceforge.net/libjpeg-turbo/libjpeg-turbo-$LIBJPEG_VERSION.tar.gz"

          curl -L --fail --retry 5 \
            -o "tiff-$LIBTIFF_VERSION.tar.xz" \
            "https://download.osgeo.org/libtiff/tiff-$LIBTIFF_VERSION.tar.xz"

          curl -L --fail --retry 5 \
            -o "leptonica-$LEPTONICA_VERSION.tar.xz" \
            "https://github.com/DanBloomberg/leptonica/releases/download/$LEPTONICA_VERSION/leptonica-$LEPTONICA_VERSION.tar.xz"

          curl -L --fail --retry 5 \
            -o "tesseract-$TESSERACT_VERSION.tar.gz" \
            "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/$TESSERACT_VERSION.tar.gz"

          echo "=========================================================="
          echo "DOWNLOADED FILES"
          echo "=========================================================="

          ls -lh

      # ==========================================================
      # COMMON CROSS COMPILE FLAGS
      # ==========================================================

      - name: Configure cross compile environment
        shell: bash
        run: |
          set -euxo pipefail

          cat > "$GITHUB_ENV" <<EOF
          CC=$TARGET-gcc
          CXX=$TARGET-g++
          AR=$TARGET-ar
          AS=$TARGET-as
          LD=$TARGET-ld
          RANLIB=$TARGET-ranlib
          STRIP=$TARGET-strip
          NM=$TARGET-nm
          OBJCOPY=$TARGET-objcopy

          PKG_CONFIG_PATH=$SYSROOT/lib/pkgconfig
          PKG_CONFIG_LIBDIR=$SYSROOT/lib/pkgconfig
          PKG_CONFIG_SYSROOT_DIR=$SYSROOT

          CPPFLAGS=-I$SYSROOT/include
          CFLAGS=-O2 -march=armv7-a -mfpu=neon -mfloat-abi=hard
          CXXFLAGS=-O2 -march=armv7-a -mfpu=neon -mfloat-abi=hard
          LDFLAGS=-L$SYSROOT/lib
          EOF

      # ==========================================================
      # BUILD ZLIB
      # ==========================================================

      - name: BUILD ZLIB 1.3.2
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "BUILD ZLIB $ZLIB_VERSION"
          echo "=========================================================="

          cd "$BUILD"

          rm -rf "zlib-$ZLIB_VERSION"
          tar -xf "zlib-$ZLIB_VERSION.tar.xz"

          cd "zlib-$ZLIB_VERSION"

          CC="$TARGET-gcc" \
          AR="$TARGET-ar" \
          RANLIB="$TARGET-ranlib" \
          ./configure \
            --prefix=/usr \
            --static

          make -j"$(nproc)"

          make DESTDIR="$SYSROOT" install

          test -f "$SYSROOT/include/zlib.h"
          test -f "$SYSROOT/lib/libz.a"

          file "$SYSROOT/lib/libz.a"

          echo "ZLIB BUILD OK"

      # ==========================================================
      # BUILD LIBJPEG-TURBO
      # ==========================================================

      - name: BUILD LIBJPEG-TURBO 3.2.0
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "BUILD LIBJPEG-TURBO $LIBJPEG_VERSION"
          echo "=========================================================="

          cd "$BUILD"

          rm -rf "libjpeg-turbo-$LIBJPEG_VERSION"
          tar -xf "libjpeg-turbo-$LIBJPEG_VERSION.tar.gz"

          cd "libjpeg-turbo-$LIBJPEG_VERSION"

          mkdir -p build
          cd build

          cmake .. \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_C_COMPILER="$TARGET-gcc" \
            -DCMAKE_CXX_COMPILER="$TARGET-g++" \
            -DCMAKE_AR="$TARGET-ar" \
            -DCMAKE_RANLIB="$TARGET-ranlib" \
            -DCMAKE_STRIP="$TARGET-strip" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_C_FLAGS="-O2 -march=armv7-a -mfpu=neon -mfloat-abi=hard" \
            -DCMAKE_CXX_FLAGS="-O2 -march=armv7-a -mfpu=neon -mfloat-abi=hard" \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_SIMD=ON \
            -DWITH_ARITH_ENC=ON \
            -DWITH_ARITH_DEC=ON \
            -DWITH_JPEG7=OFF \
            -DWITH_JPEG8=OFF \
            -DWITH_TURBOJPEG=OFF \
            -DWITH_TOOLS=OFF \
            -DWITH_TESTS=OFF

          ninja -v

          DESTDIR="$SYSROOT" ninja install

          test -f "$SYSROOT/lib/libjpeg.a"

          echo "----------------------------------------------------------"
          echo "CHECK JPEG12 SYMBOLS"
          echo "----------------------------------------------------------"

          "$TARGET-nm" "$SYSROOT/lib/libjpeg.a" | grep "jpeg12_" || true

          echo "LIBJPEG-TURBO BUILD OK"

      # ==========================================================
      # BUILD LIBPNG
      # ==========================================================

      - name: BUILD LIBPNG 1.6.58
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "BUILD LIBPNG $LIBPNG_VERSION"
          echo "=========================================================="

          cd "$BUILD"

          rm -rf "libpng-$LIBPNG_VERSION"
          tar -xf "libpng-$LIBPNG_VERSION.tar.xz"

          cd "libpng-$LIBPNG_VERSION"

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="-O2 -march=armv7-a -mfpu=neon -mfloat-abi=hard"
          export LDFLAGS="-L$SYSROOT/lib"

          export ZLIB_CFLAGS="-I$SYSROOT/include"
          export ZLIB_LIBS="$SYSROOT/lib/libz.a"

          export LIBS="$SYSROOT/lib/libz.a -lm"

          echo "----------------------------------------------------------"
          echo "CHECK ZLIB"
          echo "----------------------------------------------------------"

          test -f "$SYSROOT/include/zlib.h"
          test -f "$SYSROOT/lib/libz.a"

          echo "zlib.h:"
          grep -E '^#define ZLIB_VERSION' \
            "$SYSROOT/include/zlib.h" || true

          echo "libz.a:"
          file "$SYSROOT/lib/libz.a"

          echo "----------------------------------------------------------"
          echo "CONFIGURE LIBPNG"
          echo "----------------------------------------------------------"

          ./configure \
            --host="$TARGET" \
            --build="$(gcc -dumpmachine)" \
            --prefix=/usr \
            --enable-shared=no \
            --enable-static=yes \
            --disable-tools \
            --disable-tests \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            ZLIB_CFLAGS="$ZLIB_CFLAGS" \
            ZLIB_LIBS="$ZLIB_LIBS" \
            LIBS="$LIBS"

          echo "----------------------------------------------------------"
          echo "CONFIG RESULT"
          echo "----------------------------------------------------------"

          grep -E \
            '^(host|build|CC|CFLAGS|CPPFLAGS|LDFLAGS|LIBS|ZLIB)' \
            config.status \
            2>/dev/null || true

          echo "----------------------------------------------------------"
          echo "MAKE LIBPNG"
          echo "----------------------------------------------------------"

          make -j"$(nproc)" V=1

          echo "----------------------------------------------------------"
          echo "INSTALL LIBPNG"
          echo "----------------------------------------------------------"

          make DESTDIR="$SYSROOT" install

          echo "----------------------------------------------------------"
          echo "VERIFY LIBPNG"
          echo "----------------------------------------------------------"

          ls -lh "$SYSROOT/lib/"*png* || true

          test -f "$SYSROOT/lib/libpng16.a"

          file "$SYSROOT/lib/libpng16.a"

          echo "LIBPNG BUILD OK"

      # ==========================================================
      # BUILD LIBTIFF
      # ==========================================================

      - name: BUILD LIBTIFF 4.7.2
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "BUILD LIBTIFF $LIBTIFF_VERSION"
          echo "=========================================================="

          cd "$BUILD"

          rm -rf "tiff-$LIBTIFF_VERSION"
          tar -xf "tiff-$LIBTIFF_VERSION.tar.xz"

          cd "tiff-$LIBTIFF_VERSION"

          autoreconf -fi

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="-O2 -march=armv7-a -mfpu=neon -mfloat-abi=hard"
          export LDFLAGS="-L$SYSROOT/lib"

          export LIBS="$SYSROOT/lib/libjpeg.a $SYSROOT/lib/libz.a -lm"

          ./configure \
            --host="$TARGET" \
            --build="$(gcc -dumpmachine)" \
            --prefix=/usr \
            --enable-static=yes \
            --enable-shared=no \
            --disable-tools \
            --disable-tests \
            --disable-cxx \
            --with-jpeg-include-dir="$SYSROOT/include" \
            --with-jpeg-lib-dir="$SYSROOT/lib" \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            LIBS="$LIBS"

          make -j"$(nproc)" V=1

          make DESTDIR="$SYSROOT" install

          test -f "$SYSROOT/lib/libtiff.a"

          file "$SYSROOT/lib/libtiff.a"

          echo "LIBTIFF BUILD OK"

      # ==========================================================
      # BUILD LEPTONICA
      # ==========================================================

      - name: BUILD LEPTONICA 1.87.0
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "BUILD LEPTONICA $LEPTONICA_VERSION"
          echo "=========================================================="

          cd "$BUILD"

          rm -rf "leptonica-$LEPTONICA_VERSION"
          tar -xf "leptonica-$LEPTONICA_VERSION.tar.xz"

          cd "leptonica-$LEPTONICA_VERSION"

          autoreconf -fi

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="-O2 -march=armv7-a -mfpu=neon -mfloat-abi=hard"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-L$SYSROOT/lib"

          export LIBS="\
          -Wl,--start-group \
          $SYSROOT/lib/libtiff.a \
          $SYSROOT/lib/libjpeg.a \
          $SYSROOT/lib/libpng16.a \
          $SYSROOT/lib/libz.a \
          -Wl,--end-group \
          -lm"

          ./configure \
            --host="$TARGET" \
            --build="$(gcc -dumpmachine)" \
            --prefix=/usr \
            --enable-shared=yes \
            --enable-static=no \
            --disable-programs \
            --disable-doc \
            --without-giflib \
            --without-libwebp \
            --without-libopenjp2 \
            --without-libjp2 \
            --without-libwebp \
            --without-libheif \
            --without-libarchive \
            --without-libpng \
            --without-libjpeg \
            --without-libtiff \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            CXXFLAGS="$CXXFLAGS" \
            LDFLAGS="$LDFLAGS" \
            LIBS="$LIBS"

          echo "----------------------------------------------------------"
          echo "PATCH LEPTONICA LINK"
          echo "----------------------------------------------------------"

          if [ -f src/Makefile ]; then
            sed -i \
              's|^liblept_la_LIBADD =.*|liblept_la_LIBADD = -Wl,--start-group '"$SYSROOT"'/lib/libtiff.a '"$SYSROOT"'/lib/libjpeg.a '"$SYSROOT"'/lib/libpng16.a '"$SYSROOT"'/lib/libz.a -Wl,--end-group -lm|' \
              src/Makefile || true
          fi

          echo "----------------------------------------------------------"
          echo "MAKE LEPTONICA"
          echo "----------------------------------------------------------"

          make -j"$(nproc)" V=1

          make DESTDIR="$SYSROOT" install

          echo "----------------------------------------------------------"
          echo "LOCATE LEPTONICA"
          echo "----------------------------------------------------------"

          find "$SYSROOT/lib" \
            -maxdepth 1 \
            -type f \
            \( -name "liblept.so*" -o -name "libleptonica.so*" \) \
            -print

          LEPT_FILE="$(find "$SYSROOT/lib" \
            -maxdepth 1 \
            -type f \
            \( -name "liblept.so*" -o -name "libleptonica.so*" \) \
            | head -n 1)"

          test -n "$LEPT_FILE"

          cp -Lf "$LEPT_FILE" "$SYSROOT/lib/libleptonica.so"

          echo "----------------------------------------------------------"
          echo "CHECK LEPTONICA ARCHITECTURE"
          echo "----------------------------------------------------------"

          file "$SYSROOT/lib/libleptonica.so"

          echo "----------------------------------------------------------"
          echo "CHECK JPEG12"
          echo "----------------------------------------------------------"

          "$TARGET-nm" -D "$SYSROOT/lib/libleptonica.so" \
            | grep "jpeg12_" || true

          if "$TARGET-nm" -D "$SYSROOT/lib/libleptonica.so" \
            | grep -q " U jpeg12_"; then
            echo "ERROR: unresolved jpeg12 symbols remain in Leptonica."
            exit 1
          fi

          echo "----------------------------------------------------------"
          echo "LEPTONICA NEEDED"
          echo "----------------------------------------------------------"

          "$TARGET-readelf" -d "$SYSROOT/lib/libleptonica.so" \
            | grep NEEDED || true

          if "$TARGET-readelf" -d "$SYSROOT/lib/libleptonica.so" \
            | grep -E \
              'libjpeg|libpng|libtiff|libz'; then
            echo "ERROR: Leptonica still depends on external image libraries."
            exit 1
          fi

          echo "LEPTONICA BUILD OK"

      # ==========================================================
      # BUILD TESSERACT
      # ==========================================================

      - name: BUILD TESSERACT 5.5.3
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "BUILD TESSERACT $TESSERACT_VERSION"
          echo "=========================================================="

          cd "$BUILD"

          rm -rf "tesseract-$TESSERACT_VERSION"
          tar -xf "tesseract-$TESSERACT_VERSION.tar.gz"

          cd "tesseract-$TESSERACT_VERSION"

          ./autogen.sh

          echo "----------------------------------------------------------"
          echo "PATCH TESSERACT VERSION"
          echo "----------------------------------------------------------"

          sed -i \
            's/return TESSERACT_VERSION_STR;/return "5.5.3 - Compile ByArian";/g' \
            src/api/baseapi.cpp

          echo "----------------------------------------------------------"
          echo "PATCH TESSDATA PATH"
          echo "----------------------------------------------------------"

          sed -i \
            's|"/usr/share/tessdata/"|"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/|g' \
            src/ccutil/tessdatamanager.cpp 2>/dev/null || true

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="-O2 -march=armv7-a -mfpu=neon -mfloat-abi=hard"
          export CXXFLAGS="-O2 -march=armv7-a -mfpu=neon -mfloat-abi=hard"
          export LDFLAGS="-L$SYSROOT/lib"

          export LIBS="\
          -Wl,--start-group \
          $SYSROOT/lib/libleptonica.so \
          $SYSROOT/lib/libtiff.a \
          $SYSROOT/lib/libjpeg.a \
          $SYSROOT/lib/libpng16.a \
          $SYSROOT/lib/libz.a \
          -Wl,--end-group \
          -lm"

          export PKG_CONFIG_PATH="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"

          ./configure \
            --host="$TARGET" \
            --build="$(gcc -dumpmachine)" \
            --prefix=/usr \
            --enable-shared=yes \
            --enable-static=no \
            --disable-openmp \
            --disable-graphics \
            --disable-archive \
            --disable-legacy \
            --without-curl \
            --without-icu \
            --without-pango \
            --without-libarchive \
            --without-gif \
            --without-webp \
            --without-openjpeg \
            --without-libjpeg \
            --without-libpng \
            --without-libtiff \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            CXXFLAGS="$CXXFLAGS" \
            LDFLAGS="$LDFLAGS" \
            LIBS="$LIBS"

          echo "----------------------------------------------------------"
          echo "MAKE TESSERACT"
          echo "----------------------------------------------------------"

          make -j"$(nproc)" V=1

          make DESTDIR="$SYSROOT" install

          echo "TESSERACT BUILD OK"

      # ==========================================================
      # PREPARE FINAL PACKAGE
      # ==========================================================

      - name: CREATE FINAL PACKAGE
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "CREATE FINAL PACKAGE"
          echo "=========================================================="

          rm -rf "$BUILD/final"
          mkdir -p "$BUILD/final/usr/bin"
          mkdir -p "$BUILD/final/usr/lib"

          echo "----------------------------------------------------------"
          echo "LOCATE TESSERACT"
          echo "----------------------------------------------------------"

          find "$SYSROOT/usr/bin" \
            -maxdepth 1 \
            -type f \
            -name "tesseract" \
            -print

          test -f "$SYSROOT/usr/bin/tesseract"

          cp -Lf \
            "$SYSROOT/usr/bin/tesseract" \
            "$BUILD/final/usr/bin/tesseract"

          echo "----------------------------------------------------------"
          echo "COPY LEPTONICA"
          echo "----------------------------------------------------------"

          test -f "$SYSROOT/lib/libleptonica.so"

          cp -Lf \
            "$SYSROOT/lib/libleptonica.so" \
            "$BUILD/final/usr/lib/libleptonica.so"

          echo "----------------------------------------------------------"
          echo "LOCATE TESSERACT LIBRARY"
          echo "----------------------------------------------------------"

          TESS_LIB="$(find "$SYSROOT/lib" \
            -maxdepth 1 \
            -type f \
            -name "libtesseract.so*" \
            | head -n 1)"

          test -n "$TESS_LIB"

          cp -Lf \
            "$TESS_LIB" \
            "$BUILD/final/usr/lib/libtesseract.so"

          echo "----------------------------------------------------------"
          echo "FINAL FILES"
          echo "----------------------------------------------------------"

          find "$BUILD/final" \
            -type f \
            -print

          echo "----------------------------------------------------------"
          echo "FILE COUNT"
          echo "----------------------------------------------------------"

          COUNT="$(find "$BUILD/final" -type f | wc -l)"

          echo "Files: $COUNT"

          test "$COUNT" -eq 3

      # ==========================================================
      # FINAL ARCHITECTURE CHECK
      # ==========================================================

      - name: VERIFY ARM FILES
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "VERIFY ARMv7 FILES"
          echo "=========================================================="

          file "$BUILD/final/usr/bin/tesseract"
          file "$BUILD/final/usr/lib/libleptonica.so"
          file "$BUILD/final/usr/lib/libtesseract.so"

          echo "----------------------------------------------------------"
          echo "TESSERACT ARCH"
          echo "----------------------------------------------------------"

          "$TARGET-readelf" -h \
            "$BUILD/final/usr/bin/tesseract" \
            | grep -E 'Class|Machine'

          echo "----------------------------------------------------------"
          echo "LEPTONICA ARCH"
          echo "----------------------------------------------------------"

          "$TARGET-readelf" -h \
            "$BUILD/final/usr/lib/libleptonica.so" \
            | grep -E 'Class|Machine'

          echo "----------------------------------------------------------"
          echo "TESSERACT LIB ARCH"
          echo "----------------------------------------------------------"

          "$TARGET-readelf" -h \
            "$BUILD/final/usr/lib/libtesseract.so" \
            | grep -E 'Class|Machine'

      # ==========================================================
      # CHECK LEPTONICA DEPENDENCIES
      # ==========================================================

      - name: VERIFY LEPTONICA DEPENDENCIES
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "LEPTONICA DEPENDENCIES"
          echo "=========================================================="

          "$TARGET-readelf" -d \
            "$BUILD/final/usr/lib/libleptonica.so" \
            | grep NEEDED || true

          echo "----------------------------------------------------------"
          echo "CHECK IMAGE LIBRARIES"
          echo "----------------------------------------------------------"

          if "$TARGET-readelf" -d \
            "$BUILD/final/usr/lib/libleptonica.so" \
            | grep -E \
              'libjpeg|libpng|libtiff|libz'; then

            echo "ERROR:"
            echo "Leptonica contains an external image-library dependency."
            exit 1
          fi

          echo "OK"

      # ==========================================================
      # CHECK JPEG12
      # ==========================================================

      - name: VERIFY JPEG12
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "VERIFY JPEG12"
          echo "=========================================================="

          "$TARGET-nm" -D \
            "$BUILD/final/usr/lib/libleptonica.so" \
            | grep "jpeg12_" || true

          if "$TARGET-nm" -D \
            "$BUILD/final/usr/lib/libleptonica.so" \
            | grep -q " U jpeg12_"; then

            echo "ERROR: unresolved jpeg12 symbols remain."
            exit 1
          fi

          echo "JPEG12 CHECK OK"

      # ==========================================================
      # CHECK TESSERACT VERSION STRING
      # ==========================================================

      - name: VERIFY TESSERACT SIGNATURE
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "VERIFY TESSERACT SIGNATURE"
          echo "=========================================================="

          strings \
            "$BUILD/final/usr/bin/tesseract" \
            | grep -F "5.5.3 - Compile ByArian" \
            || true

      # ==========================================================
      # FINAL PACKAGE LIST
      # ==========================================================

      - name: SHOW FINAL PACKAGE
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================================="
          echo "FINAL PACKAGE CONTENT"
          echo "=========================================================="

          find "$BUILD/final" \
            -type f \
            -printf '%P\n' \
            | sort

          echo
          echo "Expected:"
          echo "usr/bin/tesseract"
          echo "usr/lib/libleptonica.so"
          echo "usr/lib/libtesseract.so"

      # ==========================================================
      # CREATE TAR.GZ
      # ==========================================================

      - name: CREATE TAR.GZ
        shell: bash
        run: |
          set -euxo pipefail

          cd "$BUILD/final"

          tar -czf \
            "$GITHUB_WORKSPACE/tesseract-5.5.3-armv7l-final.tar.gz" \
            usr

          cd "$GITHUB_WORKSPACE"

          echo "=========================================================="
          echo "PACKAGE CREATED"
          echo "=========================================================="

          ls -lh \
            tesseract-5.5.3-armv7l-final.tar.gz

          echo "----------------------------------------------------------"
          echo "PACKAGE CONTENT"
          echo "----------------------------------------------------------"

          tar -tzf \
            tesseract-5.5.3-armv7l-final.tar.gz

      # ==========================================================
      # UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-5.5.3-armv7l-final
          path: tesseract-5.5.3-armv7l-final.tar.gz
          if-no-files-found: error
          retention-days: 30
