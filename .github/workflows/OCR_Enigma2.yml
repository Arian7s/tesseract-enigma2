name: Build Tesseract OCR for Enigma2 ARMv7l - Cross Compile

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ARMv7l
        shell: bash
        run: |
          set -Eeuo pipefail

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            make \
            curl \
            wget \
            file \
            git \
            cmake \
            ninja-build \
            xz-utils \
            tar \
            gzip \
            binutils \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf

          export WORK_DIR="$GITHUB_WORKSPACE"
          export SYSROOT="$WORK_DIR/sysroot"
          export PACKAGE_DIR="$WORK_DIR/package"
          export HOST="arm-linux-gnueabihf"

          export ZLIB_VERSION="1.3.2"
          export LIBJPEG_VERSION="3.2.0"
          export LIBPNG_VERSION="1.6.58"
          export LIBTIFF_VERSION="4.7.2"
          export LEPTONICA_VERSION="1.87.0"
          export TESSERACT_VERSION="5.5.3"

          export CC="${HOST}-gcc"
          export CXX="${HOST}-g++"
          export AR="${HOST}-ar"
          export RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip"
          export NM="${HOST}-nm"
          export OBJCOPY="${HOST}-objcopy"
          export READELF="${HOST}-readelf"

          rm -rf "$SYSROOT"
          rm -rf "$PACKAGE_DIR"

          mkdir -p \
            "$SYSROOT/bin" \
            "$SYSROOT/include" \
            "$SYSROOT/lib" \
            "$SYSROOT/share" \
            "$SYSROOT/lib/pkgconfig" \
            "$PACKAGE_DIR/usr/bin" \
            "$PACKAGE_DIR/usr/lib"

          export PATH="$SYSROOT/bin:$PATH"

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="-fPIC -O2 -fno-semantic-interposition"
          export CXXFLAGS="-fPIC -O2 -fno-semantic-interposition"
          export LDFLAGS="-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib"

          export PKG_CONFIG_PATH="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"

          #
          # =========================================================
          # FUNCTIONS
          # =========================================================
          #

          download_file() {
            local url="$1"
            local output="$2"

            echo "=========================================================="
            echo "DOWNLOAD"
            echo "$url"
            echo "=========================================================="

            curl -L \
              --fail \
              --retry 5 \
              --retry-delay 3 \
              -o "$output" \
              "$url"
          }

          check_arm() {
            local file="$1"

            echo "=========================================================="
            echo "CHECK ARM"
            echo "$file"
            echo "=========================================================="

            "$READELF" -h "$file" |
              grep -E 'Class:|Machine:|Type:' || true

            "$READELF" -h "$file" |
              grep -q 'Machine:.*ARM' || {
                echo "ERROR: Not an ARM binary:"
                echo "$file"
                exit 1
              }
          }

          check_no_external_image_libs() {
            local file="$1"

            echo "=========================================================="
            echo "CHECK EXTERNAL IMAGE LIBRARIES"
            echo "$file"
            echo "=========================================================="

            if "$READELF" -d "$file" |
              grep -E \
                'Shared library: \[(libjpeg|libpng|libtiff|libz)'; then

              echo "ERROR: External image dependency detected."
              exit 1
            fi

            echo "OK"
          }

          #
          # =========================================================
          # ZLIB 1.3.2
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://zlib.net/fossils/zlib-${ZLIB_VERSION}.tar.gz" \
            "zlib-${ZLIB_VERSION}.tar.gz"

          rm -rf "zlib-${ZLIB_VERSION}"
          tar -xf "zlib-${ZLIB_VERSION}.tar.gz"

          cd "zlib-${ZLIB_VERSION}"

          echo "=========================================================="
          echo "BUILD ZLIB ${ZLIB_VERSION}"
          echo "=========================================================="

          CFLAGS="$CFLAGS" \
          ./configure \
            --static \
            --prefix="$SYSROOT"

          make -j"$(nproc)"
          make install

          test -f "$SYSROOT/include/zlib.h"
          test -f "$SYSROOT/lib/libz.a"

          echo "ZLIB OK"

          #
          # =========================================================
          # LIBJPEG-TURBO 3.2.0
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_VERSION}/libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz" \
            "libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz"

          rm -rf "libjpeg-turbo-${LIBJPEG_VERSION}"
          tar -xf "libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz"

          cd "libjpeg-turbo-${LIBJPEG_VERSION}"

          rm -rf build

          echo "=========================================================="
          echo "BUILD LIBJPEG-TURBO ${LIBJPEG_VERSION}"
          echo "=========================================================="

          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_AR="$AR" \
            -DCMAKE_RANLIB="$RANLIB" \
            -DCMAKE_STRIP="$STRIP" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_SIMD=ON \
            -DWITH_ARITH_ENC=ON \
            -DWITH_ARITH_DEC=ON \
            -DWITH_JPEG7=OFF \
            -DWITH_JPEG8=OFF \
            -DWITH_TURBOJPEG=OFF \
            -DWITH_TOOLS=OFF \
            -DWITH_TESTS=OFF

          cmake --build build --parallel "$(nproc)"
          cmake --install build

          test -f "$SYSROOT/lib/libjpeg.a"

          echo "LIBJPEG-TURBO OK"

          #
          # =========================================================
          # CHECK JPEG12
          # =========================================================
          #

          echo "=========================================================="
          echo "CHECK JPEG12 SYMBOLS"
          echo "=========================================================="

          "$NM" "$SYSROOT/lib/libjpeg.a" |
            grep -E \
              'jpeg12_(read|write)_(scanlines|raw_data)' \
            || {
              echo "ERROR: Required JPEG12 symbols are missing."
              exit 1
            }

          echo "JPEG12 OK"

          #
          # =========================================================
          # LIBPNG 1.6.58
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://download.sourceforge.net/libpng/libpng-${LIBPNG_VERSION}.tar.xz" \
            "libpng-${LIBPNG_VERSION}.tar.xz"

          rm -rf "libpng-${LIBPNG_VERSION}"
          tar -xf "libpng-${LIBPNG_VERSION}.tar.xz"

          cd "libpng-${LIBPNG_VERSION}"

          echo "=========================================================="
          echo "BUILD LIBPNG ${LIBPNG_VERSION}"
          echo "=========================================================="

          #
          # IMPORTANT:
          # The target zlib include path belongs in CPPFLAGS.
          #

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="-fPIC -O2 -fno-semantic-interposition"
          export LDFLAGS="-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib"

          export ZLIB_CFLAGS="-I$SYSROOT/include"
          export ZLIB_LIBS="$SYSROOT/lib/libz.a"

          rm -f \
            pnglibconf.h \
            pnglibconf.c \
            config.h

          rm -rf autom4te.cache

          TARGET_ZLIB_VERNUM="$(
            "$CC" \
              $CPPFLAGS \
              -E -dM \
              -include zlib.h \
              - </dev/null 2>/dev/null |
              awk '/#define ZLIB_VERNUM / {
                print $3;
                exit
              }'
          )"

          TARGET_ZLIB_VERSION="$(
            "$CC" \
              $CPPFLAGS \
              -E -dM \
              -include zlib.h \
              - </dev/null 2>/dev/null |
              awk '/#define ZLIB_VERSION / {
                print $3;
                exit
              }'
          )"

          echo "Target zlib version: $TARGET_ZLIB_VERSION"
          echo "Target zlib vernum:  $TARGET_ZLIB_VERNUM"

          if [ -z "$TARGET_ZLIB_VERNUM" ]; then
            echo "ERROR: Target zlib.h was not detected."
            exit 1
          fi

          ./configure \
            --host="$HOST" \
            --build="$(./config.guess)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --disable-shared \
            --enable-static \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            LIBS="$SYSROOT/lib/libz.a"

          make -j"$(nproc)"
          make install

          test -f "$SYSROOT/lib/libpng16.a"

          echo "LIBPNG OK"

          #
          # =========================================================
          # LIBTIFF 4.7.2
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://download.osgeo.org/libtiff/tiff-${LIBTIFF_VERSION}.tar.xz" \
            "tiff-${LIBTIFF_VERSION}.tar.xz"

          rm -rf "tiff-${LIBTIFF_VERSION}"
          tar -xf "tiff-${LIBTIFF_VERSION}.tar.xz"

          cd "tiff-${LIBTIFF_VERSION}"

          echo "=========================================================="
          echo "BUILD LIBTIFF ${LIBTIFF_VERSION}"
          echo "=========================================================="

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="-fPIC -O2 -fno-semantic-interposition"
          export LDFLAGS="-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib"

          ./configure \
            --host="$HOST" \
            --build="$(./config.guess)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --disable-shared \
            --enable-static \
            --disable-tools \
            --disable-tests \
            --disable-docs \
            --without-zstd \
            --without-lzma \
            --without-webp \
            --without-jbig \
            --without-jp2 \
            --without-libdeflate \
            --with-jpeg \
            --with-zlib \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            LIBS="$SYSROOT/lib/libjpeg.a $SYSROOT/lib/libz.a"

          make -j"$(nproc)"
          make install

          test -f "$SYSROOT/lib/libtiff.a"

          echo "LIBTIFF OK"

          #
          # =========================================================
          # LEPTONICA 1.87.0
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://github.com/DanBloomberg/leptonica/releases/download/${LEPTONICA_VERSION}/leptonica-${LEPTONICA_VERSION}.tar.gz" \
            "leptonica-${LEPTONICA_VERSION}.tar.gz"

          rm -rf "leptonica-${LEPTONICA_VERSION}"
          tar -xf "leptonica-${LEPTONICA_VERSION}.tar.gz"

          cd "leptonica-${LEPTONICA_VERSION}"

          echo "=========================================================="
          echo "BUILD LEPTONICA ${LEPTONICA_VERSION}"
          echo "=========================================================="

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="-fPIC -O2 -fno-semantic-interposition"

          #
          # The static image libraries are deliberately placed
          # directly in LIBS.
          #

          export LDFLAGS="-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib -Wl,-z,defs"

          export LEPTONICA_LIBS="
            -Wl,--start-group
            $SYSROOT/lib/libtiff.a
            $SYSROOT/lib/libjpeg.a
            $SYSROOT/lib/libpng16.a
            $SYSROOT/lib/libz.a
            -Wl,--end-group
            -lm
          "

          ./autogen.sh

          ./configure \
            --host="$HOST" \
            --build="$(./config.guess)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --enable-shared \
            --disable-static \
            --disable-programs \
            --disable-dependency-tracking \
            --with-jpeg \
            --with-png \
            --with-tiff \
            --with-zlib \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            LIBS="$LEPTONICA_LIBS"

          echo "=========================================================="
          echo "LEPTONICA CONFIGURATION"
          echo "=========================================================="

          grep -E \
            'jpeg|png|tiff|zlib' \
            config.log |
            tail -n 100 || true

          echo "=========================================================="
          echo "BUILD LEPTONICA"
          echo "=========================================================="

          make -j"$(nproc)" V=1

          make install

          #
          # Locate Leptonica.
          #

          LEPTONICA_LIB=""

          for candidate in \
            "$SYSROOT/lib/liblept.so" \
            "$SYSROOT/lib/liblept.so.6" \
            "$SYSROOT/lib/liblept.so.6.0.0"
          do
            if [ -f "$candidate" ]; then
              LEPTONICA_LIB="$candidate"
              break
            fi
          done

          if [ -z "$LEPTONICA_LIB" ]; then
            LEPTONICA_LIB="$(
              find "$SYSROOT/lib" \
                -maxdepth 1 \
                -type f \
                -name 'liblept.so*' |
              head -n 1 || true
            )"
          fi

          if [ -z "$LEPTONICA_LIB" ]; then
            echo "ERROR: Leptonica shared library not found."
            find "$SYSROOT/lib" -maxdepth 1 -type f -print
            exit 1
          fi

          cp -f \
            "$LEPTONICA_LIB" \
            "$SYSROOT/lib/libleptonica.so"

          #
          # =========================================================
          # VERIFY LEPTONICA
          # =========================================================
          #

          echo "=========================================================="
          echo "LEPTONICA JPEG12 CHECK"
          echo "=========================================================="

          if "$NM" -D \
            "$SYSROOT/lib/libleptonica.so" 2>/dev/null |
            grep -E \
              ' U jpeg12_(read|write)_(scanlines|raw_data)'; then

            echo "ERROR: Unresolved JPEG12 symbols remain."
            exit 1
          fi

          echo "JPEG12 unresolved symbols: NONE"

          echo "=========================================================="
          echo "LEPTONICA NEEDED"
          echo "=========================================================="

          "$READELF" -d \
            "$SYSROOT/lib/libleptonica.so" |
            grep NEEDED || true

          check_no_external_image_libs \
            "$SYSROOT/lib/libleptonica.so"

          check_arm \
            "$SYSROOT/lib/libleptonica.so"

          echo "LEPTONICA OK"

          #
          # =========================================================
          # LEPTONICA PKG-CONFIG
          # =========================================================
          #

          cat > "$SYSROOT/lib/pkgconfig/lept.pc" <<EOF
          prefix=$SYSROOT
          exec_prefix=\${prefix}
          libdir=$SYSROOT/lib
          includedir=$SYSROOT/include

          Name: lept
          Description: Leptonica
          Version: $LEPTONICA_VERSION
          Libs: -L\${libdir} -lleptonica
          Cflags: -I\${includedir}
          EOF

          #
          # =========================================================
          # TESSERACT 5.5.3
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/${TESSERACT_VERSION}.tar.gz" \
            "tesseract-${TESSERACT_VERSION}.tar.gz"

          rm -rf "tesseract-${TESSERACT_VERSION}"
          tar -xf "tesseract-${TESSERACT_VERSION}.tar.gz"

          cd "tesseract-${TESSERACT_VERSION}"

          echo "=========================================================="
          echo "PATCH TESSERACT"
          echo "=========================================================="

          #
          # Compile ByArian signature.
          #

          sed -i \
            's/return TESSERACT_VERSION_STR;/return "5.5.3 - Compile ByArian";/g' \
            src/api/baseapi.cpp || true

          #
          # Keep the original tessdata lookup and add the
          # Enigma2 locations.
          #

          sed -i \
            's|"/usr/share/tessdata/"|"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/"|g' \
            src/ccutil/mainblk.cpp || true

          #
          # =========================================================
          # CONFIGURE TESSERACT
          # =========================================================
          #

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="-fPIC -O2 -fno-semantic-interposition"
          export CXXFLAGS="-fPIC -O2 -fno-semantic-interposition"
          export LDFLAGS="-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib"

          export PKG_CONFIG_PATH="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"

          ./autogen.sh

          ./configure \
            --host="$HOST" \
            --build="$(./config.guess)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --disable-static \
            --enable-shared \
            --disable-debug \
            --disable-icu \
            --without-pango \
            --without-cairo \
            --without-libarchive \
            --disable-opencl \
            --disable-graphics \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            CXXFLAGS="$CXXFLAGS" \
            LDFLAGS="$LDFLAGS"

          echo "=========================================================="
          echo "BUILD TESSERACT"
          echo "=========================================================="

          make -j"$(nproc)" V=1

          make install

          #
          # =========================================================
          # LOCATE TESSERACT
          # =========================================================
          #

          TESSERACT_BIN=""

          for candidate in \
            "$SYSROOT/bin/tesseract" \
            "$SYSROOT/usr/bin/tesseract"
          do
            if [ -x "$candidate" ]; then
              TESSERACT_BIN="$candidate"
              break
            fi
          done

          if [ -z "$TESSERACT_BIN" ]; then
            TESSERACT_BIN="$(
              find "$SYSROOT" \
                -type f \
                -name tesseract \
                -perm -111 |
              head -n 1 || true
            )"
          fi

          if [ -z "$TESSERACT_BIN" ]; then
            echo "ERROR: Tesseract binary not found."
            exit 1
          fi

          #
          # =========================================================
          # LOCATE LIBTESSERACT
          # =========================================================
          #

          TESSERACT_LIB=""

          for candidate in \
            "$SYSROOT/lib/libtesseract.so" \
            "$SYSROOT/lib/libtesseract.so.5" \
            "$SYSROOT/lib/libtesseract.so.5.5.3"
          do
            if [ -f "$candidate" ]; then
              TESSERACT_LIB="$candidate"
              break
            fi
          done

          if [ -z "$TESSERACT_LIB" ]; then
            TESSERACT_LIB="$(
              find "$SYSROOT/lib" \
                -maxdepth 1 \
                -type f \
                -name 'libtesseract.so*' |
              head -n 1 || true
            )"
          fi

          if [ -z "$TESSERACT_LIB" ]; then
            echo "ERROR: libtesseract.so not found."
            exit 1
          fi

          #
          # =========================================================
          # FINAL THREE FILES
          # =========================================================
          #

          echo "=========================================================="
          echo "CREATE FINAL THREE-FILE BUNDLE"
          echo "=========================================================="

          rm -rf "$PACKAGE_DIR"

          mkdir -p \
            "$PACKAGE_DIR/usr/bin" \
            "$PACKAGE_DIR/usr/lib"

          cp -L \
            "$TESSERACT_BIN" \
            "$PACKAGE_DIR/usr/bin/tesseract"

          cp -L \
            "$TESSERACT_LIB" \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"

          cp -L \
            "$SYSROOT/lib/libleptonica.so" \
            "$PACKAGE_DIR/usr/lib/libleptonica.so"

          #
          # =========================================================
          # STRIP
          # =========================================================
          #

          "$STRIP" \
            --strip-all \
            "$PACKAGE_DIR/usr/bin/tesseract" || true

          "$STRIP" \
            --strip-unneeded \
            "$PACKAGE_DIR/usr/lib/libtesseract.so" || true

          "$STRIP" \
            --strip-unneeded \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" || true

          #
          # =========================================================
          # FINAL VERIFICATION
          # =========================================================
          #

          echo "=========================================================="
          echo "FINAL FILE LIST"
          echo "=========================================================="

          find "$PACKAGE_DIR" \
            -type f \
            -printf '%P\n' |
            sort

          FILE_COUNT="$(
            find "$PACKAGE_DIR" \
              -type f |
            wc -l
          )"

          if [ "$FILE_COUNT" -ne 3 ]; then
            echo "ERROR: Expected exactly 3 files."
            echo "Found: $FILE_COUNT"
            exit 1
          fi

          test -f \
            "$PACKAGE_DIR/usr/bin/tesseract"

          test -f \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"

          test -f \
            "$PACKAGE_DIR/usr/lib/libleptonica.so"

          check_arm \
            "$PACKAGE_DIR/usr/bin/tesseract"

          check_arm \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"

          check_arm \
            "$PACKAGE_DIR/usr/lib/libleptonica.so"

          #
          # =========================================================
          # FINAL JPEG12 CHECK
          # =========================================================
          #

          echo "=========================================================="
          echo "FINAL JPEG12 CHECK"
          echo "=========================================================="

          if "$NM" -D \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" 2>/dev/null |
            grep -E \
              ' U jpeg12_(read|write)_(scanlines|raw_data)'; then

            echo "ERROR: Final Leptonica has unresolved JPEG12 symbols."
            exit 1
          fi

          echo "OK: JPEG12 symbols are resolved."

          #
          # =========================================================
          # FINAL EXTERNAL DEPENDENCY CHECK
          # =========================================================
          #

          echo "=========================================================="
          echo "FINAL LEPTONICA DEPENDENCIES"
          echo "=========================================================="

          "$READELF" -d \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" |
            grep NEEDED || true

          if "$READELF" -d \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" |
            grep -E \
              'Shared library: \[(libjpeg|libpng|libtiff|libz)'; then

            echo "ERROR: Leptonica still requires an external image library."
            exit 1
          fi

          #
          # =========================================================
          # TESSERACT DEPENDENCIES
          # =========================================================
          #

          echo "=========================================================="
          echo "FINAL TESSERACT DEPENDENCIES"
          echo "=========================================================="

          "$READELF" -d \
            "$PACKAGE_DIR/usr/lib/libtesseract.so" |
            grep NEEDED || true

          #
          # =========================================================
          # TESSERACT VERSION CHECK
          # =========================================================
          #

          echo "=========================================================="
          echo "TESSERACT VERSION CHECK"
          echo "=========================================================="

          "$READELF" -p .rodata \
            "$PACKAGE_DIR/usr/bin/tesseract" 2>/dev/null |
            grep -F \
              "Compile ByArian" \
            || true

          #
          # =========================================================
          # PACKAGE SIZE
          # =========================================================
          #

          echo "=========================================================="
          echo "FINAL FILE SIZES"
          echo "=========================================================="

          ls -lh \
            "$PACKAGE_DIR/usr/bin/tesseract" \
            "$PACKAGE_DIR/usr/lib/libtesseract.so" \
            "$PACKAGE_DIR/usr/lib/libleptonica.so"

          #
          # =========================================================
          # CREATE ARCHIVE
          # =========================================================
          #

          cd "$PACKAGE_DIR"

          tar -czf \
            "$WORK_DIR/tesseract-${TESSERACT_VERSION}-armv7l-final.tar.gz" \
            usr

          echo "=========================================================="
          echo "BUILD COMPLETE"
          echo "=========================================================="

          ls -lh \
            "$WORK_DIR/tesseract-${TESSERACT_VERSION}-armv7l-final.tar.gz"

      - name: Upload Final Three-File Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-5.5.3-armv7l-final
