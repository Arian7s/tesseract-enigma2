name: Build Tesseract OCR for Enigma2 (ARMv7l - Fully Self-Contained 3 Files)

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install host toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
          autoconf automake libtool pkg-config make wget git cmake \
          ca-certificates patchelf

    - name: Build static dependencies (PIC)
      run: |
        set -euxo pipefail

        export CROSS=arm-linux-gnueabihf
        export CC=${CROSS}-gcc
        export CXX=${CROSS}-g++
        export AR=${CROSS}-ar
        export RANLIB=${CROSS}-ranlib
        export STRIP=${CROSS}-strip

        export WORK=$PWD
        export PREFIX=$WORK/sysroot
        mkdir -p "$PREFIX"

        export CFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CXXFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CPPFLAGS="-I$PREFIX/include"
        export LDFLAGS="-L$PREFIX/lib"
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

        fetch() { wget -q --no-check-certificate -O "$2" "$1"; }

        # ---------- zlib (static only) ----------
        fetch https://zlib.net/fossils/zlib-1.3.1.tar.gz zlib.tar.gz
        tar xf zlib.tar.gz
        ( cd zlib-1.3.1
          CFLAGS="-O2 -fPIC" CHOST=$CROSS ./configure --prefix="$PREFIX" --static
          make -j$(nproc) && make install
          rm -f "$PREFIX"/lib/libz.so* )

        # ---------- libjpeg-turbo (static only) ----------
        fetch https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.4/libjpeg-turbo-3.0.4.tar.gz ljt.tar.gz
        tar xf ljt.tar.gz
        ( cd libjpeg-turbo-3.0.4 && mkdir build && cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_C_FLAGS="-O2 -fPIC" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DENABLE_SHARED=OFF -DENABLE_STATIC=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DWITH_JPEG8=ON -DWITH_SIMD=OFF \
            ..
          make -j$(nproc) && make install
          rm -f "$PREFIX"/lib/libjpeg.so* "$PREFIX"/lib/libturbojpeg.so* )

        # ---------- libpng (static only) ----------
        fetch https://download.sourceforge.net/libpng/libpng-1.6.43.tar.gz libpng.tar.gz
        tar xf libpng.tar.gz
        ( cd libpng-1.6.43
          CFLAGS="-O2 -fPIC" ./configure --host=$CROSS --prefix="$PREFIX" \
            --disable-shared --enable-static
          make -j$(nproc) && make install
          rm -f "$PREFIX"/lib/libpng*.so* )

        # ---------- libtiff (static only) ----------
        fetch https://download.osgeo.org/libtiff/tiff-4.6.0.tar.gz tiff.tar.gz
        tar xf tiff.tar.gz
        ( cd tiff-4.6.0
          CFLAGS="-O2 -fPIC" ./configure --host=$CROSS --prefix="$PREFIX" \
            --disable-shared --enable-static \
            --disable-lzma --disable-zstd --disable-webp --disable-jbig --disable-jpeg
          make -j$(nproc) && make install
          rm -f "$PREFIX"/lib/libtiff*.so* )

        echo "===== sysroot/lib content (should be only .a files + .la) ====="
        ls -la "$PREFIX/lib"

    - name: Build libleptonica.so (linked against static deps)
      run: |
        set -euxo pipefail

        export CROSS=arm-linux-gnueabihf
        export CC=${CROSS}-gcc
        export CXX=${CROSS}-g++
        export STRIP=${CROSS}-strip

        export WORK=$PWD
        export PREFIX=$WORK/sysroot

        export CFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CXXFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CPPFLAGS="-I$PREFIX/include"
        # مهم: ندفع الـ linker لاستخدام .a فقط
        export LDFLAGS="-L$PREFIX/lib -Wl,-Bstatic -ljpeg -lpng -ltiff -lz -Wl,-Bdynamic"
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
        export LIBS="-Wl,-Bstatic -ljpeg -lpng -ltiff -lz -Wl,-Bdynamic -lm"

        fetch() { wget -q --no-check-certificate -O "$2" "$1"; }
        fetch https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz lep.tar.gz
        tar xf lep.tar.gz
        cd leptonica-1.87.0

        ./configure --host=$CROSS --prefix="$PREFIX" \
          --enable-shared --disable-static \
          --without-libwebp --without-libopenjpeg \
          --without-giflib --without-libarchive

        make -j$(nproc)

        # التحقق قبل التثبيت: libleptonica.so يجب ألا يحتاج مكتبات الصور
        LEPT_BUILT=$(find src/.libs -name 'libleptonica.so.*' -type f | head -n 1)
        echo "LEPT_BUILT = $LEPT_BUILT"
        echo "===== NEEDED of libleptonica.so (before install) ====="
        arm-linux-gnueabihf-objdump -p "$LEPT_BUILT" | grep NEEDED || true

        make install

    - name: Build Tesseract (shared lib + binary)
      run: |
        set -euxo pipefail

        export CROSS=arm-linux-gnueabihf
        export CC=${CROSS}-gcc
        export CXX=${CROSS}-g++
        export STRIP=${CROSS}-strip

        export WORK=$PWD
        export PREFIX=$WORK/sysroot

        export CFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CXXFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CPPFLAGS="-I$PREFIX/include"
        export LDFLAGS="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib"
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
        export LIBLEPT_HEADERSDIR="$PREFIX/include"

        fetch() { wget -q --no-check-certificate -O "$2" "$1"; }
        fetch https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz tess.tar.gz
        tar xf tess.tar.gz
        cd tesseract-5.5.3

        sed -i 's|return TESSERACT_VERSION_STR;|return "5.5.3 - Compile ByArian";|' src/api/baseapi.cpp || true
        sed -i 's|"/usr/share/tessdata/"|"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/"|' src/ccutil/mainblk.cpp || true

        ./autogen.sh
        ./configure --host=$CROSS --prefix=/usr \
          --enable-shared --disable-static --disable-debug \
          --disable-icu --without-pango --without-cairo --without-libarchive

        make -j$(nproc)
        make install DESTDIR=$WORK/build_out

    - name: Reduce to 3 files + patch SONAME
      run: |
        set -euxo pipefail

        mkdir -p package/usr/bin package/usr/lib

        TESS_BIN=$(find build_out/usr/bin -name 'tesseract' -type f | head -n 1)
        LIB_TESS=$(find build_out/usr/lib -name 'libtesseract.so.*' -type f | head -n 1)
        LIB_LEPT=$(find sysroot/lib -name 'libleptonica.so.*' -type f | head -n 1)

        echo "TESS_BIN = $TESS_BIN"
        echo "LIB_TESS = $LIB_TESS"
        echo "LIB_LEPT = $LIB_LEPT"

        [ -f "$TESS_BIN" ] || { echo "ERROR: tesseract not found"; exit 1; }
        [ -f "$LIB_TESS" ] || { echo "ERROR: libtesseract not found"; exit 1; }
        [ -f "$LIB_LEPT" ] || { echo "ERROR: libleptonica not found"; exit 1; }

        cp "$TESS_BIN"  package/usr/bin/tesseract
        cp "$LIB_TESS"  package/usr/lib/libtesseract.so
        cp "$LIB_LEPT"  package/usr/lib/libleptonica.so

        # Strip
        arm-linux-gnueabihf-strip --strip-all       package/usr/bin/tesseract
        arm-linux-gnueabihf-strip --strip-unneeded  package/usr/lib/libtesseract.so
        arm-linux-gnueabihf-strip --strip-unneeded  package/usr/lib/libleptonica.so

        # SONAME
        patchelf --set-soname libtesseract.so package/usr/lib/libtesseract.so
        patchelf --set-soname libleptonica.so package/usr/lib/libleptonica.so

        # NEEDED
        patchelf --replace-needed libtesseract.so.5 libtesseract.so package/usr/bin/tesseract || true
        patchelf --replace-needed libleptonica.so.6 libleptonica.so package/usr/bin/tesseract || true
        patchelf --replace-needed libleptonica.so.6 libleptonica.so package/usr/lib/libtesseract.so || true

        # RPATH
        patchelf --set-rpath /usr/lib package/usr/bin/tesseract
        patchelf --set-rpath /usr/lib package/usr/lib/libtesseract.so
        patchelf --set-rpath /usr/lib package/usr/lib/libleptonica.so

        chmod -R 777 package

        echo "===== Final content ====="
        find package -type f -o -type l | sort

        echo
        echo "===== NEEDED of libleptonica.so ====="
        arm-linux-gnueabihf-objdump -p package/usr/lib/libleptonica.so | grep NEEDED

        echo
        echo "===== NEEDED of libtesseract.so ====="
        arm-linux-gnueabihf-objdump -p package/usr/lib/libtesseract.so | grep NEEDED

        echo
        echo "===== NEEDED of tesseract ====="
        arm-linux-gnueabihf-objdump -p package/usr/bin/tesseract | grep NEEDED

        echo
        echo "===== Sizes ====="
        ls -lh package/usr/bin/tesseract package/usr/lib/*.so

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-armv7l-selfcontained
        path: package/
