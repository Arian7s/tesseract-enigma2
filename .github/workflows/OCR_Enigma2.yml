name: Build Tesseract OCR for Enigma2 (ARMv7l - Cross Compile)

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install host toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
          autoconf automake libtool pkg-config make wget git cmake ca-certificates

    - name: Cross-compile dependencies
      run: |
        set -euxo pipefail

        export CROSS=arm-linux-gnueabihf
        export CC=${CROSS}-gcc
        export CXX=${CROSS}-g++
        export AR=${CROSS}-ar
        export RANLIB=${CROSS}-ranlib
        export STRIP=${CROSS}-strip

        export WORK=$PWD
        export PREFIX=$WORK/sysroot
        mkdir -p "$PREFIX"

        export CFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CXXFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CPPFLAGS="-I$PREFIX/include"
        export LDFLAGS="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib"
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

        fetch() { wget -q --no-check-certificate -O "$2" "$1"; }

        # ---------- zlib ----------
        fetch https://zlib.net/fossils/zlib-1.3.1.tar.gz zlib.tar.gz
        tar xf zlib.tar.gz
        ( cd zlib-1.3.1
          CHOST=$CROSS ./configure --prefix="$PREFIX"
          make -j$(nproc) && make install )

        # ---------- libjpeg-turbo ----------
        fetch https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.4/libjpeg-turbo-3.0.4.tar.gz ljt.tar.gz
        tar xf ljt.tar.gz
        ( cd libjpeg-turbo-3.0.4 && mkdir build && cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_C_FLAGS="-O2 -fPIC" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DENABLE_SHARED=ON -DENABLE_STATIC=OFF \
            -DWITH_JPEG8=ON -DWITH_SIMD=OFF \
            ..
          make -j$(nproc) && make install )

        # ---------- libpng ----------
        fetch https://download.sourceforge.net/libpng/libpng-1.6.43.tar.gz libpng.tar.gz
        tar xf libpng.tar.gz
        ( cd libpng-1.6.43
          ./configure --host=$CROSS --prefix="$PREFIX" \
            --enable-shared --disable-static
          make -j$(nproc) && make install )

        # ---------- libtiff ----------
        fetch https://download.osgeo.org/libtiff/tiff-4.6.0.tar.gz tiff.tar.gz
        tar xf tiff.tar.gz
        ( cd tiff-4.6.0
          ./configure --host=$CROSS --prefix="$PREFIX" \
            --enable-shared --disable-static \
            --disable-lzma --disable-zstd --disable-webp --disable-jbig --disable-jpeg
          make -j$(nproc) && make install )

        # ---------- leptonica ----------
        fetch https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz lep.tar.gz
        tar xf lep.tar.gz
        ( cd leptonica-1.87.0
          ./configure --host=$CROSS --prefix="$PREFIX" \
            --enable-shared --disable-static \
            --without-libwebp --without-libopenjpeg \
            --without-giflib --without-libarchive
          make -j$(nproc) && make install )

    - name: Cross-compile Tesseract
      run: |
        set -euxo pipefail

        export CROSS=arm-linux-gnueabihf
        export CC=${CROSS}-gcc
        export CXX=${CROSS}-g++
        export STRIP=${CROSS}-strip

        export WORK=$PWD
        export PREFIX=$WORK/sysroot

        export CFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CXXFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CPPFLAGS="-I$PREFIX/include"
        export LDFLAGS="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib"
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
        export LIBLEPT_HEADERSDIR="$PREFIX/include"

        fetch() { wget -q --no-check-certificate -O "$2" "$1"; }
        fetch https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz tess.tar.gz
        tar xf tess.tar.gz
        cd tesseract-5.5.3

        # Patch version string + tessdata search paths
        sed -i 's|return TESSERACT_VERSION_STR;|return "5.5.3 - Compile ByArian";|' src/api/baseapi.cpp || true
        sed -i 's|"/usr/share/tessdata/"|"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/"|' src/ccutil/mainblk.cpp || true

        ./autogen.sh
        ./configure --host=$CROSS --prefix=/usr \
          --disable-static --disable-debug \
          --disable-icu --without-pango --without-cairo --without-libarchive

        make -j$(nproc)
        make install DESTDIR=$WORK/package

    - name: Bundle shared libraries
      run: |
        set -euxo pipefail
        mkdir -p package/usr/lib package/usr/share/tessdata

        # Leptonica + image libs from sysroot (Tesseract's own libs are already
        # placed by make install under package/usr/lib/)
        cp -P sysroot/lib/libleptonica.so.* package/usr/lib/
        cp -P sysroot/lib/libjpeg.so.*     package/usr/lib/ 2>/dev/null || true
        cp -P sysroot/lib/libpng*.so.*     package/usr/lib/ 2>/dev/null || true
        cp -P sysroot/lib/libtiff.so.*     package/usr/lib/ 2>/dev/null || true
        cp -P sysroot/lib/libz.so.*        package/usr/lib/

        # Strip
        arm-linux-gnueabihf-strip --strip-all      package/usr/bin/tesseract || true
        for f in package/usr/lib/*.so*; do
          arm-linux-gnueabihf-strip --strip-unneeded "$f" || true
        done

        chmod -R 777 package

        echo "===== Content of package/ ====="
        find package -type f -o -type l | sort

        echo "===== Checking NEEDED of tesseract ====="
        arm-linux-gnueabihf-objdump -p package/usr/bin/tesseract | grep NEEDED || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-armv7l-cross-bundle
        path: package/
