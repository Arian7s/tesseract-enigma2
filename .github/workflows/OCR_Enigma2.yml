name: Cross-Compile Tesseract for Enigma2 ARMv7l

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ARMv7l package
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            make \
            curl \
            file \
            git \
            cmake \
            ninja-build \
            xz-utils \
            tar \
            gzip \
            bzip2 \
            binutils \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf

          export WORK_DIR="$GITHUB_WORKSPACE"
          export SYSROOT="$WORK_DIR/sysroot"
          export PACKAGE_DIR="$WORK_DIR/package"
          export HOST="arm-linux-gnueabihf"

          export ZLIB_VERSION="1.3.2"
          export LIBPNG_VERSION="1.6.58"
          export LIBJPEG_VERSION="3.2.0"
          export LIBTIFF_VERSION="4.7.2"
          export LEPTONICA_VERSION="1.87.0"
          export TESSERACT_VERSION="5.5.3"

          export CC="${HOST}-gcc"
          export CXX="${HOST}-g++"
          export AR="${HOST}-ar"
          export AS="${HOST}-as"
          export RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip"
          export NM="${HOST}-nm"
          export OBJCOPY="${HOST}-objcopy"
          export READELF="${HOST}-readelf"

          rm -rf "$SYSROOT"
          rm -rf "$PACKAGE_DIR"

          mkdir -p \
            "$SYSROOT/bin" \
            "$SYSROOT/include" \
            "$SYSROOT/lib" \
            "$SYSROOT/share" \
            "$SYSROOT/lib/pkgconfig" \
            "$PACKAGE_DIR"

          export PATH="$SYSROOT/bin:$PATH"

          export COMMON_CFLAGS="-fPIC -O2 -fno-semantic-interposition"
          export COMMON_CPPFLAGS="-I$SYSROOT/include"
          export COMMON_LDFLAGS="-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib"

          export PKG_CONFIG_PATH="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"

          download_file() {
            local url="$1"
            local output="$2"

            echo "=========================================================="
            echo "DOWNLOAD"
            echo "$url"
            echo "=========================================================="

            curl -L --fail --retry 5 --retry-delay 3 \
              -o "$output" \
              "$url"
          }

          check_arm() {
            local file="$1"

            echo "=========================================================="
            echo "CHECK ARM"
            echo "$file"
            echo "=========================================================="

            file "$file"

            if ! "$READELF" -h "$file" >/dev/null 2>&1; then
              echo "ERROR: Not a valid ARM ELF file:"
              echo "$file"
              exit 1
            fi

            local machine
            machine="$("$READELF" -h "$file" | awk -F: '/Machine:/ {gsub(/^[ \t]+/, "", $2); print $2}')"

            echo "Machine: $machine"

            case "$machine" in
              *ARM*)
                ;;
              *)
                echo "ERROR: Wrong architecture."
                exit 1
                ;;
            esac
          }

          show_symbols() {
            local lib="$1"

            echo "=========================================================="
            echo "SYMBOL CHECK"
            echo "$lib"
            echo "=========================================================="

            "$NM" -D "$lib" 2>/dev/null | grep -E \
              'jpeg12_(read|write)_(scanlines|raw_data)' || true
          }

          #
          # =========================================================
          # ZLIB
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://zlib.net/fossils/zlib-${ZLIB_VERSION}.tar.gz" \
            "zlib-${ZLIB_VERSION}.tar.gz"

          rm -rf "zlib-${ZLIB_VERSION}"
          tar -xf "zlib-${ZLIB_VERSION}.tar.gz"

          cd "zlib-${ZLIB_VERSION}"

          echo "=========================================================="
          echo "BUILD ZLIB"
          echo "=========================================================="

          CFLAGS="$COMMON_CFLAGS" \
          ./configure \
            --static \
            --prefix="$SYSROOT"

          make -j"$(nproc)"
          make install

          if [ ! -f "$SYSROOT/lib/libz.a" ]; then
            echo "ERROR: libz.a was not generated."
            exit 1
          fi

          echo "ZLIB OK"

          #
          # =========================================================
          # LIBJPEG-TURBO
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_VERSION}/libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz" \
            "libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz"

          rm -rf "libjpeg-turbo-${LIBJPEG_VERSION}"
          tar -xf "libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz"

          cd "libjpeg-turbo-${LIBJPEG_VERSION}"

          rm -rf build

          echo "=========================================================="
          echo "BUILD LIBJPEG-TURBO"
          echo "=========================================================="

          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_AR="$AR" \
            -DCMAKE_RANLIB="$RANLIB" \
            -DCMAKE_STRIP="$STRIP" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_12BIT=ON \
            -DWITH_ARITH=ON

          cmake --build build --parallel "$(nproc)"
          cmake --install build

          if [ ! -f "$SYSROOT/lib/libjpeg.a" ]; then
            echo "ERROR: libjpeg.a was not generated."
            exit 1
          fi

          echo "=========================================================="
          echo "CHECK JPEG12 SYMBOLS"
          echo "=========================================================="

          "$NM" "$SYSROOT/lib/libjpeg.a" | grep -E \
            'jpeg12_(read|write)_(scanlines|raw_data)' || {
              echo "ERROR: jpeg12 symbols are missing from libjpeg.a."
              exit 1
            }

          echo "LIBJPEG-TURBO OK"

          #
          # =========================================================
          # LIBPNG
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://download.sourceforge.net/libpng/libpng-${LIBPNG_VERSION}.tar.xz" \
            "libpng-${LIBPNG_VERSION}.tar.xz"

          rm -rf "libpng-${LIBPNG_VERSION}"
          tar -xf "libpng-${LIBPNG_VERSION}.tar.xz"

          cd "libpng-${LIBPNG_VERSION}"

          echo "=========================================================="
          echo "BUILD LIBPNG"
          echo "=========================================================="

          ./configure \
            --host="$HOST" \
            --prefix="$SYSROOT" \
            --disable-shared \
            --enable-static \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="$COMMON_CFLAGS -I$SYSROOT/include" \
            LDFLAGS="$COMMON_LDFLAGS"

          make -j"$(nproc)"
          make install

          if [ ! -f "$SYSROOT/lib/libpng16.a" ]; then
            echo "ERROR: libpng16.a was not generated."
            exit 1
          fi

          echo "LIBPNG OK"

          #
          # =========================================================
          # LIBTIFF
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://download.osgeo.org/libtiff/tiff-${LIBTIFF_VERSION}.tar.xz" \
            "tiff-${LIBTIFF_VERSION}.tar.xz"

          rm -rf "tiff-${LIBTIFF_VERSION}"
          tar -xf "tiff-${LIBTIFF_VERSION}.tar.xz"

          cd "tiff-${LIBTIFF_VERSION}"

          echo "=========================================================="
          echo "BUILD LIBTIFF"
          echo "=========================================================="

          ./configure \
            --host="$HOST" \
            --prefix="$SYSROOT" \
            --disable-shared \
            --enable-static \
            --disable-tools \
            --disable-tests \
            --disable-docs \
            --without-zstd \
            --without-lzma \
            --without-webp \
            --without-jbig \
            --without-jp2 \
            --without-libdeflate \
            --with-jpeg \
            --with-zlib \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="$COMMON_CFLAGS -I$SYSROOT/include" \
            CPPFLAGS="-I$SYSROOT/include" \
            LDFLAGS="$COMMON_LDFLAGS" \
            LIBS="$SYSROOT/lib/libjpeg.a $SYSROOT/lib/libz.a"

          make -j"$(nproc)"
          make install

          if [ ! -f "$SYSROOT/lib/libtiff.a" ]; then
            echo "ERROR: libtiff.a was not generated."
            exit 1
          fi

          echo "LIBTIFF OK"

          #
          # =========================================================
          # VERIFY STATIC DEPENDENCIES
          # =========================================================
          #

          echo "=========================================================="
          echo "STATIC LIBRARIES"
          echo "=========================================================="

          ls -lh \
            "$SYSROOT/lib/libz.a" \
            "$SYSROOT/lib/libjpeg.a" \
            "$SYSROOT/lib/libpng16.a" \
            "$SYSROOT/lib/libtiff.a"

          #
          # =========================================================
          # LEPTONICA
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://github.com/DanBloomberg/leptonica/releases/download/${LEPTONICA_VERSION}/leptonica-${LEPTONICA_VERSION}.tar.gz" \
            "leptonica-${LEPTONICA_VERSION}.tar.gz"

          rm -rf "leptonica-${LEPTONICA_VERSION}"
          tar -xf "leptonica-${LEPTONICA_VERSION}.tar.gz"

          cd "leptonica-${LEPTONICA_VERSION}"

          echo "=========================================================="
          echo "LEPTONICA NEEDED"
          echo "=========================================================="

          echo "Checking static libraries..."

          test -f "$SYSROOT/lib/libz.a"
          test -f "$SYSROOT/lib/libjpeg.a"
          test -f "$SYSROOT/lib/libpng16.a"
          test -f "$SYSROOT/lib/libtiff.a"

          echo "Checking JPEG12 symbols..."

          "$NM" "$SYSROOT/lib/libjpeg.a" | grep \
            'jpeg12_read_scanlines' >/dev/null

          "$NM" "$SYSROOT/lib/libjpeg.a" | grep \
            'jpeg12_write_scanlines' >/dev/null

          "$NM" "$SYSROOT/lib/libjpeg.a" | grep \
            'jpeg12_read_raw_data' >/dev/null

          "$NM" "$SYSROOT/lib/libjpeg.a" | grep \
            'jpeg12_write_raw_data' >/dev/null

          rm -rf build

          mkdir -p build

          cat > "$WORK_DIR/leptonica-toolchain.cmake" <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR armv7l)

          set(CMAKE_C_COMPILER "$CC")
          set(CMAKE_AR "$AR")
          set(CMAKE_RANLIB "$RANLIB")
          set(CMAKE_STRIP "$STRIP")

          set(CMAKE_SYSROOT "$SYSROOT")

          set(CMAKE_FIND_ROOT_PATH "$SYSROOT")
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)

          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)

          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          set(CMAKE_C_FLAGS_INIT "-fPIC -O2 -fno-semantic-interposition -I$SYSROOT/include")

          set(CMAKE_SHARED_LINKER_FLAGS_INIT
              "-L$SYSROOT/lib
               -Wl,-rpath-link,$SYSROOT/lib
               -Wl,--no-as-needed
               -Wl,-z,defs
               -Wl,--start-group
               $SYSROOT/lib/libtiff.a
               $SYSROOT/lib/libjpeg.a
               $SYSROOT/lib/libpng16.a
               $SYSROOT/lib/libz.a
               -Wl,--end-group")
          EOF

          echo "=========================================================="
          echo "CONFIGURE LEPTONICA"
          echo "=========================================================="

          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$WORK_DIR/leptonica-toolchain.cmake" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_PROG=OFF \
            -DENABLE_PROG=OFF \
            -DENABLE_JPEG=ON \
            -DENABLE_PNG=ON \
            -DENABLE_TIFF=ON \
            -DENABLE_ZLIB=ON \
            -DJPEG_LIBRARY="$SYSROOT/lib/libjpeg.a" \
            -DJPEG_INCLUDE_DIR="$SYSROOT/include" \
            -DPNG_LIBRARY="$SYSROOT/lib/libpng16.a" \
            -DPNG_PNG_INCLUDE_DIR="$SYSROOT/include" \
            -DTIFF_LIBRARY="$SYSROOT/lib/libtiff.a" \
            -DTIFF_INCLUDE_DIR="$SYSROOT/include" \
            -DZLIB_LIBRARY="$SYSROOT/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="$SYSROOT/include"

          echo "=========================================================="
          echo "LEPTONICA LINK CONFIGURATION"
          echo "=========================================================="

          grep -R \
            -E 'libtiff\.a|libjpeg\.a|libpng16\.a|libz\.a|jpeg12' \
            build \
            2>/dev/null || true

          echo "=========================================================="
          echo "BUILD LEPTONICA"
          echo "=========================================================="

          cmake --build build --parallel "$(nproc)" --verbose

          echo "=========================================================="
          echo "INSTALL LEPTONICA"
          echo "=========================================================="

          cmake --install build

          echo "=========================================================="
          echo "LOCATE LEPTONICA LIBRARY"
          echo "=========================================================="

          LEPTONICA_LIB=""

          for candidate in \
            "$SYSROOT/lib/libleptonica.so" \
            "$SYSROOT/lib/liblept.so" \
            "$SYSROOT/lib/liblept.so.6" \
            "$SYSROOT/lib/liblept.so.6.0.0"
          do
            if [ -f "$candidate" ]; then
              LEPTONICA_LIB="$candidate"
              break
            fi
          done

          if [ -z "$LEPTONICA_LIB" ]; then
            LEPTONICA_LIB="$(find "$SYSROOT/lib" -maxdepth 1 \
              -type f \
              \( -name 'liblept.so*' -o -name 'libleptonica.so*' \) \
              | head -n 1 || true)"
          fi

          if [ -z "$LEPTONICA_LIB" ]; then
            echo "ERROR: Leptonica shared library was not generated."
            find "$SYSROOT/lib" -maxdepth 1 -type f -print
            exit 1
          fi

          echo "Found:"
          echo "$LEPTONICA_LIB"

          if [ "$LEPTONICA_LIB" != "$SYSROOT/lib/libleptonica.so" ]; then
            cp -f "$LEPTONICA_LIB" "$SYSROOT/lib/libleptonica.so"
          fi

          "$READELF" -d "$SYSROOT/lib/libleptonica.so" || true

          #
          # =========================================================
          # FORCE SONAME
          # =========================================================
          #

          echo "=========================================================="
          echo "SET LEPTONICA SONAME"
          echo "=========================================================="

          "$CC" \
            -shared \
            -Wl,-soname,libleptonica.so \
            -Wl,--no-undefined \
            -Wl,--start-group \
            "$SYSROOT/lib/libleptonica.so" \
            "$SYSROOT/lib/libtiff.a" \
            "$SYSROOT/lib/libjpeg.a" \
            "$SYSROOT/lib/libpng16.a" \
            "$SYSROOT/lib/libz.a" \
            -Wl,--end-group \
            -lm \
            -o "$SYSROOT/lib/libleptonica.final.so"

          mv -f \
            "$SYSROOT/lib/libleptonica.final.so" \
            "$SYSROOT/lib/libleptonica.so"

          #
          # =========================================================
          # LEPTONICA JPEG12 CHECK
          # =========================================================
          #

          echo "=========================================================="
          echo "CHECKING JPEG12"
          echo "=========================================================="

          if "$NM" -D "$SYSROOT/lib/libleptonica.so" 2>/dev/null \
            | grep -E ' U jpeg12_(read|write)_(scanlines|raw_data)'; then

            echo "ERROR: Unresolved jpeg12 symbols remain in Leptonica."
            exit 1
          fi

          echo "Embedded JPEG12 symbols:"

          "$NM" -D "$SYSROOT/lib/libleptonica.so" 2>/dev/null \
            | grep -E \
            ' (T|t) jpeg12_(read|write)_(scanlines|raw_data)' \
            || true

          echo "=========================================================="
          echo "LEPTONICA NEEDED"
          echo "=========================================================="

          "$READELF" -d "$SYSROOT/lib/libleptonica.so" \
            | grep NEEDED || true

          echo "=========================================================="
          echo "LEPTONICA CHECK"
          echo "=========================================================="

          check_arm "$SYSROOT/lib/libleptonica.so"

          echo "LEPTONICA BUILD SUCCESS"

          #
          # =========================================================
          # TESSERACT
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/${TESSERACT_VERSION}.tar.gz" \
            "tesseract-${TESSERACT_VERSION}.tar.gz"

          rm -rf "tesseract-${TESSERACT_VERSION}"
          tar -xf "tesseract-${TESSERACT_VERSION}.tar.gz"

          cd "tesseract-${TESSERACT_VERSION}"

          echo "=========================================================="
          echo "BUILD TESSERACT"
          echo "=========================================================="

          rm -rf build

          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_AR="$AR" \
            -DCMAKE_RANLIB="$RANLIB" \
            -DCMAKE_STRIP="$STRIP" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_TRAINING_TOOLS=OFF \
            -DBUILD_UNINSTALLER=OFF \
            -DDISABLE_CURL=ON \
            -DGRAPHICS_DISABLED=OFF \
            -DOPENMP_BUILD=OFF \
            -DLeptonica_DIR="$SYSROOT/lib/cmake/leptonica" \
            -DCMAKE_PREFIX_PATH="$SYSROOT" \
            -DCMAKE_C_FLAGS="$COMMON_CFLAGS" \
            -DCMAKE_CXX_FLAGS="$COMMON_CFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$COMMON_LDFLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$COMMON_LDFLAGS"

          cmake --build build --parallel "$(nproc)" --verbose

          cmake --install build

          #
          # =========================================================
          # FIND TESSERACT
          # =========================================================
          #

          echo "=========================================================="
          echo "LOCATE TESSERACT"
          echo "=========================================================="

          TESSERACT_BIN=""

          if [ -x "$SYSROOT/bin/tesseract" ]; then
            TESSERACT_BIN="$SYSROOT/bin/tesseract"
          elif [ -x "$SYSROOT/usr/bin/tesseract" ]; then
            TESSERACT_BIN="$SYSROOT/usr/bin/tesseract"
          else
            TESSERACT_BIN="$(find "$SYSROOT" \
              -type f \
              -name tesseract \
              -perm -111 \
              | head -n 1 || true)"
          fi

          if [ -z "$TESSERACT_BIN" ]; then
            echo "ERROR: tesseract binary was not generated."
            find "$SYSROOT" -type f -name 'tesseract' -print
            exit 1
          fi

          echo "Tesseract:"
          echo "$TESSERACT_BIN"

          check_arm "$TESSERACT_BIN"

          #
          # =========================================================
          # FIND LIBTESSERACT
          # =========================================================
          #

          TESSERACT_LIB=""

          for candidate in \
            "$SYSROOT/lib/libtesseract.so" \
            "$SYSROOT/lib/libtesseract.so.5" \
            "$SYSROOT/lib/libtesseract.so.5.5.0"
          do
            if [ -f "$candidate" ]; then
              TESSERACT_LIB="$candidate"
              break
            fi
          done

          if [ -z "$TESSERACT_LIB" ]; then
            TESSERACT_LIB="$(find "$SYSROOT/lib" \
              -maxdepth 1 \
              -type f \
              -name 'libtesseract.so*' \
              | head -n 1 || true)"
          fi

          if [ -z "$TESSERACT_LIB" ]; then
            echo "ERROR: libtesseract.so was not generated."
            find "$SYSROOT/lib" -maxdepth 1 -type f -print
            exit 1
          fi

          if [ "$TESSERACT_LIB" != "$SYSROOT/lib/libtesseract.so" ]; then
            cp -f "$TESSERACT_LIB" "$SYSROOT/lib/libtesseract.so"
          fi

          #
          # =========================================================
          # PACKAGE
          # =========================================================
          #

          echo "=========================================================="
          echo "CREATE FINAL PACKAGE"
          echo "=========================================================="

          rm -rf "$PACKAGE_DIR"
          mkdir -p \
            "$PACKAGE_DIR/usr/bin" \
            "$PACKAGE_DIR/usr/lib"

          cp -f \
            "$TESSERACT_BIN" \
            "$PACKAGE_DIR/usr/bin/tesseract"

          cp -f \
            "$SYSROOT/lib/libleptonica.so" \
            "$PACKAGE_DIR/usr/lib/libleptonica.so"

          cp -f \
            "$SYSROOT/lib/libtesseract.so" \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"

          "$STRIP" \
            "$PACKAGE_DIR/usr/bin/tesseract" \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"

          #
          # =========================================================
          # FINAL VERIFICATION
          # =========================================================
          #

          echo "=========================================================="
          echo "FINAL FILES"
          echo "=========================================================="

          find "$PACKAGE_DIR" -type f -printf '%P\n' | sort

          FILE_COUNT="$(find "$PACKAGE_DIR" -type f | wc -l)"

          if [ "$FILE_COUNT" -ne 3 ]; then
            echo "ERROR: Final package must contain exactly 3 files."
            exit 1
          fi

          test -f "$PACKAGE_DIR/usr/bin/tesseract"
          test -f "$PACKAGE_DIR/usr/lib/libleptonica.so"
          test -f "$PACKAGE_DIR/usr/lib/libtesseract.so"

          echo "=========================================================="
          echo "CHECK FINAL ARCHITECTURE"
          echo "=========================================================="

          check_arm "$PACKAGE_DIR/usr/bin/tesseract"
          check_arm "$PACKAGE_DIR/usr/lib/libleptonica.so"
          check_arm "$PACKAGE_DIR/usr/lib/libtesseract.so"

          echo "=========================================================="
          echo "CHECK LEPTONICA JPEG12 AGAIN"
          echo "=========================================================="

          if "$NM" -D "$PACKAGE_DIR/usr/lib/libleptonica.so" 2>/dev/null \
            | grep -E ' U jpeg12_(read|write)_(scanlines|raw_data)'; then

            echo "ERROR: Final Leptonica still contains unresolved JPEG12 symbols."
            exit 1
          fi

          echo "JPEG12 unresolved symbols: NONE"

          echo "=========================================================="
          echo "LEPTONICA NEEDED"
          echo "=========================================================="

          "$READELF" -d \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" \
            | grep NEEDED || true

          echo "=========================================================="
          echo "TESSERACT NEEDED"
          echo "=========================================================="

          "$READELF" -d \
            "$PACKAGE_DIR/usr/lib/libtesseract.so" \
            | grep NEEDED || true

          echo "=========================================================="
          echo "FINAL PACKAGE CONTENT"
          echo "=========================================================="

          ls -lh \
            "$PACKAGE_DIR/usr/bin/tesseract" \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"

          #
          # =========================================================
          # CREATE ARCHIVE
          # =========================================================
          #

          cd "$PACKAGE_DIR"

          tar -czf \
            "$WORK_DIR/tesseract-${TESSERACT_VERSION}-armv7l.tar.gz" \
            usr

          echo "=========================================================="
          echo "PACKAGE CREATED"
          echo "=========================================================="

          ls -lh \
            "$WORK_DIR/tesseract-${TESSERACT_VERSION}-armv7l.tar.gz"

          echo "=========================================================="
          echo "BUILD COMPLETE"
          echo "=========================================================="

      - name: Upload Tesseract ARMv7l package
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-5.5.3-armv7l
