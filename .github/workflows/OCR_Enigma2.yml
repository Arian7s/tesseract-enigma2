name: Cross-Compile Tesseract for Enigma2 ARMv7l

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ARMv7l package
        shell: bash
        run: |
          set -Eeuo pipefail

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            make \
            wget \
            curl \
            file \
            git \
            cmake \
            ninja-build \
            xz-utils \
            tar \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf

          export WORK_DIR="$GITHUB_WORKSPACE"
          export SYSROOT="$WORK_DIR/sysroot"
          export PACKAGE_DIR="$WORK_DIR/package"
          export HOST="arm-linux-gnueabihf"

          export ZLIB_VERSION="1.3.2"
          export LIBPNG_VERSION="1.6.58"
          export LIBJPEG_VERSION="3.2.0"
          export LIBTIFF_VERSION="4.7.2"
          export LEPTONICA_VERSION="1.87.0"
          export TESSERACT_VERSION="5.5.3"

          export CC="${HOST}-gcc"
          export CXX="${HOST}-g++"
          export AR="${HOST}-ar"
          export AS="${HOST}-as"
          export LD="${HOST}-ld"
          export RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip"
          export NM="${HOST}-nm"
          export OBJCOPY="${HOST}-objcopy"

          rm -rf "$SYSROOT" "$PACKAGE_DIR"
          mkdir -p "$SYSROOT" "$PACKAGE_DIR"

          export CPPFLAGS="-I${SYSROOT}/include"
          export CFLAGS="-fPIC -O2 -I${SYSROOT}/include"
          export CXXFLAGS="-fPIC -O2 -I${SYSROOT}/include"
          export LDFLAGS="-L${SYSROOT}/lib"

          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"
          export PKG_CONFIG_PATH="$SYSROOT/lib/pkgconfig:$SYSROOT/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig:$SYSROOT/share/pkgconfig"

          export PATH="$SYSROOT/bin:$PATH"

          download_file() {
            local url="$1"
            local output="$2"

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 3 \
              --retry-connrefused \
              --show-error \
              --progress-bar \
              --output "$output" \
              "$url"
          }

          verify_arm_library() {
            local file_path="$1"

            if [ ! -e "$file_path" ]; then
              echo "Missing library: $file_path"
              exit 1
            fi

            file "$file_path"

            if ! file "$file_path" | grep -Eqi 'ARM|current ar archive'; then
              echo "The file is not an ARM library or archive: $file_path"
              exit 1
            fi
          }

          # Build zlib 1.3.2
          cd "$WORK_DIR"

          download_file \
            "https://zlib.net/zlib-${ZLIB_VERSION}.tar.gz" \
            "zlib-${ZLIB_VERSION}.tar.gz"

          tar -xzf "zlib-${ZLIB_VERSION}.tar.gz"
          cd "zlib-${ZLIB_VERSION}"

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          ./configure \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --shared

          make -j"$(nproc)"
          make install

          cd "$WORK_DIR"

          # Build libjpeg-turbo 3.2.0
          download_file \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_VERSION}/libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz" \
            "libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz"

          tar -xzf "libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz"
          cd "libjpeg-turbo-${LIBJPEG_VERSION}"

          mkdir build
          cd build

          cmake .. \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DENABLE_SHARED=ON \
            -DENABLE_STATIC=OFF \
            -DWITH_12BIT=OFF \
            -DWITH_ARITH=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build . --parallel "$(nproc)"
          cmake --install .

          cd "$WORK_DIR"

          # Build libpng 1.6.58
          download_file \
            "https://download.sourceforge.net/libpng/libpng-${LIBPNG_VERSION}.tar.xz" \
            "libpng-${LIBPNG_VERSION}.tar.xz"

          tar -xf "libpng-${LIBPNG_VERSION}.tar.xz"
          cd "libpng-${LIBPNG_VERSION}"

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          ./configure \
            --host="$HOST" \
            --build="$(gcc -dumpmachine)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --enable-shared \
            --disable-static \
            --with-zlib-prefix="$SYSROOT" \
            CPPFLAGS="-I$SYSROOT/include" \
            LDFLAGS="-L$SYSROOT/lib"

          make -j"$(nproc)"
          make install

          cd "$WORK_DIR"

          # Build libtiff 4.7.2
          download_file \
            "https://download.osgeo.org/libtiff/tiff-${LIBTIFF_VERSION}.tar.gz" \
            "tiff-${LIBTIFF_VERSION}.tar.gz"

          tar -xzf "tiff-${LIBTIFF_VERSION}.tar.gz"
          cd "tiff-${LIBTIFF_VERSION}"

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          ./configure \
            --host="$HOST" \
            --build="$(gcc -dumpmachine)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --enable-shared \
            --disable-static \
            --with-pic \
            --with-jpeg \
            --with-jpeg-include-dir="$SYSROOT/include" \
            --with-jpeg-lib-dir="$SYSROOT/lib" \
            --with-zlib \
            --with-zstd=no \
            --with-lzma=no \
            --with-webp=no \
            --with-openjpeg=no \
            --with-libdeflate=no \
            CPPFLAGS="-I$SYSROOT/include" \
            LDFLAGS="-L$SYSROOT/lib" \
            LIBS="-ljpeg -lz"

          make -j"$(nproc)"
          make install

          cd "$WORK_DIR"

          # Build Leptonica 1.87.0
          download_file \
            "https://github.com/DanBloomberg/leptonica/releases/download/${LEPTONICA_VERSION}/leptonica-${LEPTONICA_VERSION}.tar.gz" \
            "leptonica-${LEPTONICA_VERSION}.tar.gz"

          tar -xzf "leptonica-${LEPTONICA_VERSION}.tar.gz"
          cd "leptonica-${LEPTONICA_VERSION}"

          CC="$CC" \
          CXX="$CXX" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          ./configure \
            --host="$HOST" \
            --build="$(gcc -dumpmachine)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --enable-shared \
            --disable-static \
            --with-libjpeg \
            --with-libpng \
            --with-libtiff \
            --with-zlib \
            --without-giflib \
            --without-libwebp \
            --without-libopenjpeg \
            --without-libjp2 \
            CPPFLAGS="-I$SYSROOT/include -I$SYSROOT/include/leptonica" \
            CFLAGS="-fPIC -O2 -I$SYSROOT/include -I$SYSROOT/include/leptonica" \
            LDFLAGS="-L$SYSROOT/lib" \
            LIBS="-ljpeg -lpng16 -ltiff -lz" \
            JPEG_CFLAGS="-I$SYSROOT/include" \
            JPEG_LIBS="-L$SYSROOT/lib -ljpeg" \
            PNG_CFLAGS="-I$SYSROOT/include" \
            PNG_LIBS="-L$SYSROOT/lib -lpng16" \
            TIFF_CFLAGS="-I$SYSROOT/include" \
            TIFF_LIBS="-L$SYSROOT/lib -ltiff" \
            ZLIB_CFLAGS="-I$SYSROOT/include" \
            ZLIB_LIBS="-L$SYSROOT/lib -lz"

          make -j"$(nproc)" \
            CPPFLAGS="-I$SYSROOT/include -I$SYSROOT/include/leptonica" \
            LDFLAGS="-L$SYSROOT/lib" \
            LIBS="-ljpeg -lpng16 -ltiff -lz"

          make install

          cd "$WORK_DIR"

          # Build Tesseract 5.5.3
          download_file \
            "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/${TESSERACT_VERSION}.tar.gz" \
            "tesseract-${TESSERACT_VERSION}.tar.gz"

          tar -xzf "tesseract-${TESSERACT_VERSION}.tar.gz"
          cd "tesseract-${TESSERACT_VERSION}"

          sed -i \
            's/return TESSERACT_VERSION_STR;/return "5.5.3 - Compile ByArian";/g' \
            src/api/baseapi.cpp || true

          sed -i \
            's|"/usr/share/tessdata/"|"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/";|g' \
            src/ccutil/mainblk.cpp || true

          ./autogen.sh

          CC="$CC" \
          CXX="$CXX" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          ./configure \
            --host="$HOST" \
            --build="$(gcc -dumpmachine)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --enable-shared \
            --disable-static \
            --disable-debug \
            --disable-icu \
            --without-pango \
            --without-cairo \
            --without-libarchive \
            --without-opencl \
            CPPFLAGS="-I$SYSROOT/include -I$SYSROOT/include/leptonica" \
            CFLAGS="-fPIC -O2 -I$SYSROOT/include -I$SYSROOT/include/leptonica" \
            CXXFLAGS="-fPIC -O2 -I$SYSROOT/include -I$SYSROOT/include/leptonica" \
            LDFLAGS="-L$SYSROOT/lib" \
            LIBS="-llept -ltiff -lpng16 -ljpeg -lz" \
            LEPTONICA_CFLAGS="-I$SYSROOT/include/leptonica" \
            LEPTONICA_LIBS="-L$SYSROOT/lib -llept"

          make -j"$(nproc)" \
            CPPFLAGS="-I$SYSROOT/include -I$SYSROOT/include/leptonica" \
            LDFLAGS="-L$SYSROOT/lib" \
            LIBS="-llept -ltiff -lpng16 -ljpeg -lz"

          make install

          cd "$WORK_DIR"

          echo "Installed sysroot libraries:"
          find "$SYSROOT/lib" -maxdepth 1 -type f -o -type l | sort

          verify_arm_library "$SYSROOT/lib/libjpeg.so"
          verify_arm_library "$SYSROOT/lib/libpng16.so"
          verify_arm_library "$SYSROOT/lib/libtiff.so"
          verify_arm_library "$SYSROOT/lib/libz.so"
          verify_arm_library "$SYSROOT/lib/liblept.so"
          verify_arm_library "$SYSROOT/lib/libtesseract.so"

          file "$SYSROOT/bin/tesseract"

          if ! file "$SYSROOT/bin/tesseract" | grep -Eqi 'ARM'; then
            echo "The Tesseract executable is not an ARM binary"
            exit 1
          fi

          mkdir -p \
            "$PACKAGE_DIR/usr/bin" \
            "$PACKAGE_DIR/usr/lib" \
            "$PACKAGE_DIR/usr/share/tessdata"

          cp -a "$SYSROOT/bin/tesseract" "$PACKAGE_DIR/usr/bin/"

          for library in \
            libz.so* \
            libjpeg.so* \
            libpng16.so* \
            libtiff.so* \
            liblept.so* \
            libleptonica.so* \
            libtesseract.so*; do

            for file_path in "$SYSROOT/lib"/$library; do
              if [ -e "$file_path" ] || [ -L "$file_path" ]; then
                cp -a "$file_path" "$PACKAGE_DIR/usr/lib/"
              fi
            done
          done

          if [ -d "$SYSROOT/lib/pkgconfig" ]; then
            mkdir -p "$PACKAGE_DIR/usr/lib/pkgconfig"
            cp -a "$SYSROOT/lib/pkgconfig/"*.pc "$PACKAGE_DIR/usr/lib/pkgconfig/" 2>/dev/null || true
          fi

          "$STRIP" --strip-unneeded "$PACKAGE_DIR/usr/bin/tesseract" || true

          find "$PACKAGE_DIR/usr/lib" -type f -name '*.so*' -exec "$STRIP" --strip-unneeded {} \; || true

          chmod -R 755 "$PACKAGE_DIR"

          echo "Final package contents:"
          find "$PACKAGE_DIR" -maxdepth 5 -print | sort

      - name: Upload ARMv7l artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-enigma2-armv7l
          path: package/
