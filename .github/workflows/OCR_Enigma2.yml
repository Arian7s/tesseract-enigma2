name: Cross-Compile Tesseract for Enigma2 ARMv7l

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ARMv7l package
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            make \
            curl \
            file \
            git \
            cmake \
            ninja-build \
            xz-utils \
            tar \
            gzip \
            bzip2 \
            binutils \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf

          export WORK_DIR="$GITHUB_WORKSPACE"
          export SYSROOT="$WORK_DIR/sysroot"
          export PACKAGE_DIR="$WORK_DIR/package"
          export HOST="arm-linux-gnueabihf"

          export ZLIB_VERSION="1.3.2"
          export LIBPNG_VERSION="1.6.58"
          export LIBJPEG_VERSION="3.2.0"
          export LIBTIFF_VERSION="4.7.2"
          export LEPTONICA_VERSION="1.87.0"
          export TESSERACT_VERSION="5.5.3"

          export CC="${HOST}-gcc"
          export CXX="${HOST}-g++"
          export AR="${HOST}-ar"
          export AS="${HOST}-as"
          export RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip"
          export NM="${HOST}-nm"
          export OBJCOPY="${HOST}-objcopy"
          export READELF="${HOST}-readelf"

          rm -rf "$SYSROOT"
          rm -rf "$PACKAGE_DIR"

          mkdir -p \
            "$SYSROOT/bin" \
            "$SYSROOT/include" \
            "$SYSROOT/lib" \
            "$SYSROOT/share" \
            "$SYSROOT/lib/pkgconfig" \
            "$PACKAGE_DIR"

          export PATH="$SYSROOT/bin:$PATH"

          export COMMON_CFLAGS="-fPIC -O2 -fno-semantic-interposition"
          export COMMON_CPPFLAGS="-I$SYSROOT/include"
          export COMMON_LDFLAGS="-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib"

          export PKG_CONFIG_PATH="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"

          download_file() {
            local url="$1"
            local output="$2"

            echo "=========================================================="
            echo "DOWNLOAD"
            echo "$url"
            echo "=========================================================="

            curl -L \
              --fail \
              --retry 5 \
              --retry-delay 3 \
              -o "$output" \
              "$url"
          }

          check_arm() {
            local file="$1"

            echo "=========================================================="
            echo "CHECK ARM"
            echo "$file"
            echo "=========================================================="

            file "$file"

            if ! "$READELF" -h "$file" >/dev/null 2>&1; then
              echo "ERROR: Invalid ELF file:"
              echo "$file"
              exit 1
            fi

            local machine

            machine="$(
              "$READELF" -h "$file" |
              awk -F: '/Machine:/ {
                gsub(/^[ \t]+/, "", $2);
                print $2
              }'
            )"

            echo "Machine: $machine"

            case "$machine" in
              *ARM*)
                ;;
              *)
                echo "ERROR: Wrong architecture."
                exit 1
                ;;
            esac
          }

          #
          # =========================================================
          # ZLIB
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://zlib.net/fossils/zlib-${ZLIB_VERSION}.tar.gz" \
            "zlib-${ZLIB_VERSION}.tar.gz"

          rm -rf "zlib-${ZLIB_VERSION}"
          tar -xf "zlib-${ZLIB_VERSION}.tar.gz"

          cd "zlib-${ZLIB_VERSION}"

          echo "=========================================================="
          echo "BUILD ZLIB"
          echo "=========================================================="

          CFLAGS="$COMMON_CFLAGS" \
          ./configure \
            --static \
            --prefix="$SYSROOT"

          make -j"$(nproc)"
          make install

          test -f "$SYSROOT/include/zlib.h"
          test -f "$SYSROOT/lib/libz.a"

          echo "ZLIB BUILD SUCCESS"

          echo "Target zlib version:"

          grep -E \
            '#define ZLIB_VERSION|#define ZLIB_VERNUM' \
            "$SYSROOT/include/zlib.h" || true

          #
          # =========================================================
          # LIBJPEG-TURBO
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_VERSION}/libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz" \
            "libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz"

          rm -rf "libjpeg-turbo-${LIBJPEG_VERSION}"
          tar -xf "libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz"

          cd "libjpeg-turbo-${LIBJPEG_VERSION}"

          rm -rf build

          echo "=========================================================="
          echo "BUILD LIBJPEG-TURBO"
          echo "=========================================================="

          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_AR="$AR" \
            -DCMAKE_RANLIB="$RANLIB" \
            -DCMAKE_STRIP="$STRIP" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_12BIT=ON \
            -DWITH_ARITH=ON

          cmake --build build --parallel "$(nproc)"
          cmake --install build

          test -f "$SYSROOT/lib/libjpeg.a"

          echo "=========================================================="
          echo "CHECK JPEG12 SYMBOLS"
          echo "=========================================================="

          "$NM" "$SYSROOT/lib/libjpeg.a" |
            grep -E \
              'jpeg12_(read|write)_(scanlines|raw_data)' \
            || {
              echo "ERROR: JPEG12 symbols are missing."
              exit 1
            }

          echo "LIBJPEG-TURBO BUILD SUCCESS"

          #
          # =========================================================
          # LIBPNG
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://download.sourceforge.net/libpng/libpng-${LIBPNG_VERSION}.tar.xz" \
            "libpng-${LIBPNG_VERSION}.tar.xz"

          rm -rf "libpng-${LIBPNG_VERSION}"
          tar -xf "libpng-${LIBPNG_VERSION}.tar.xz"

          cd "libpng-${LIBPNG_VERSION}"

          echo "=========================================================="
          echo "BUILD LIBPNG"
          echo "=========================================================="

          test -f "$SYSROOT/include/zlib.h"
          test -f "$SYSROOT/lib/libz.a"

          #
          # IMPORTANT:
          #
          # libpng checks ZLIB_VERNUM from the zlib.h which it
          # actually includes.
          #
          # Do NOT put the sysroot include path inside CFLAGS.
          # Put it inside CPPFLAGS.
          #

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="-fPIC -O2 -fno-semantic-interposition"
          export LDFLAGS="-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib"

          export ZLIB_CFLAGS="-I$SYSROOT/include"
          export ZLIB_LIBS="$SYSROOT/lib/libz.a"

          echo "CPPFLAGS=$CPPFLAGS"
          echo "CFLAGS=$CFLAGS"
          echo "LDFLAGS=$LDFLAGS"
          echo "ZLIB_CFLAGS=$ZLIB_CFLAGS"
          echo "ZLIB_LIBS=$ZLIB_LIBS"

          #
          # Verify compiler sees the target zlib.h.
          #

          TARGET_ZLIB_VERNUM="$(
            "$CC" \
              $CPPFLAGS \
              -E -dM \
              -include zlib.h \
              - </dev/null 2>/dev/null |
              awk '/#define ZLIB_VERNUM / {
                print $3;
                exit
              }'
          )"

          TARGET_ZLIB_VERSION="$(
            "$CC" \
              $CPPFLAGS \
              -E -dM \
              -include zlib.h \
              - </dev/null 2>/dev/null |
              awk '/#define ZLIB_VERSION / {
                print $3;
                exit
              }'
          )"

          echo "Compiler zlib version: $TARGET_ZLIB_VERSION"
          echo "Compiler zlib vernum:  $TARGET_ZLIB_VERNUM"

          if [ -z "$TARGET_ZLIB_VERNUM" ]; then
            echo "ERROR: Compiler did not find target zlib.h."
            exit 1
          fi

          #
          # Clean generated configuration.
          #

          rm -f \
            pnglibconf.h \
            pnglibconf.c \
            config.h

          rm -rf autom4te.cache

          #
          # Configure libpng.
          #

          ./configure \
            --host="$HOST" \
            --build="$(./config.guess)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --disable-shared \
            --enable-static \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            LIBS="$SYSROOT/lib/libz.a"

          echo "=========================================================="
          echo "LIBPNG CONFIGURATION CHECK"
          echo "=========================================================="

          grep -E \
            'ZLIB|zlib' \
            config.log |
            tail -n 50 || true

          if [ -f pnglibconf.h ]; then
            echo "Generated pnglibconf.h:"
            grep -E \
              'PNG_ZLIB_VERNUM|ZLIB' \
              pnglibconf.h |
              head -n 30 || true
          fi

          #
          # Build.
          #

          make -j"$(nproc)"

          #
          # Install.
          #

          make install

          test -f "$SYSROOT/lib/libpng16.a"

          echo "=========================================================="
          echo "LIBPNG BUILD SUCCESS"
          echo "=========================================================="

          ls -lh "$SYSROOT/lib/libpng16.a"

          #
          # =========================================================
          # LIBTIFF
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://download.osgeo.org/libtiff/tiff-${LIBTIFF_VERSION}.tar.xz" \
            "tiff-${LIBTIFF_VERSION}.tar.xz"

          rm -rf "tiff-${LIBTIFF_VERSION}"
          tar -xf "tiff-${LIBTIFF_VERSION}.tar.xz"

          cd "tiff-${LIBTIFF_VERSION}"

          echo "=========================================================="
          echo "BUILD LIBTIFF"
          echo "=========================================================="

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="$COMMON_CFLAGS"
          export LDFLAGS="$COMMON_LDFLAGS"

          ./configure \
            --host="$HOST" \
            --build="$(./config.guess)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --disable-shared \
            --enable-static \
            --disable-tools \
            --disable-tests \
            --disable-docs \
            --without-zstd \
            --without-lzma \
            --without-webp \
            --without-jbig \
            --without-jp2 \
            --without-libdeflate \
            --with-jpeg \
            --with-zlib \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            LIBS="$SYSROOT/lib/libjpeg.a $SYSROOT/lib/libz.a"

          make -j"$(nproc)"
          make install

          test -f "$SYSROOT/lib/libtiff.a"

          echo "LIBTIFF BUILD SUCCESS"

          #
          # =========================================================
          # CHECK ALL STATIC LIBRARIES
          # =========================================================
          #

          echo "=========================================================="
          echo "STATIC LIBRARIES"
          echo "=========================================================="

          ls -lh \
            "$SYSROOT/lib/libz.a" \
            "$SYSROOT/lib/libjpeg.a" \
            "$SYSROOT/lib/libpng16.a" \
            "$SYSROOT/lib/libtiff.a"

          #
          # =========================================================
          # LEPTONICA
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://github.com/DanBloomberg/leptonica/releases/download/${LEPTONICA_VERSION}/leptonica-${LEPTONICA_VERSION}.tar.gz" \
            "leptonica-${LEPTONICA_VERSION}.tar.gz"

          rm -rf "leptonica-${LEPTONICA_VERSION}"
          tar -xf "leptonica-${LEPTONICA_VERSION}.tar.gz"

          cd "leptonica-${LEPTONICA_VERSION}"

          echo "=========================================================="
          echo "BUILD LEPTONICA"
          echo "=========================================================="

          #
          # Use Autotools here.
          #
          # This allows the static dependency archives to be
          # passed directly to the final shared-library link.
          #

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="-fPIC -O2 -fno-semantic-interposition"
          export LDFLAGS="-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib -Wl,-z,defs"

          export LIBS="
            -Wl,--start-group
            $SYSROOT/lib/libtiff.a
            $SYSROOT/lib/libjpeg.a
            $SYSROOT/lib/libpng16.a
            $SYSROOT/lib/libz.a
            -Wl,--end-group
            -lm
          "

          echo "CPPFLAGS=$CPPFLAGS"
          echo "CFLAGS=$CFLAGS"
          echo "LDFLAGS=$LDFLAGS"
          echo "LIBS=$LIBS"

          ./autogen.sh

          ./configure \
            --host="$HOST" \
            --build="$(./config.guess)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --enable-shared \
            --disable-static \
            --disable-programs \
            --disable-dependency-tracking \
            --with-jpeg \
            --with-png \
            --with-tiff \
            --with-zlib \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            LIBS="$LIBS"

          echo "=========================================================="
          echo "LEPTONICA CONFIGURATION"
          echo "=========================================================="

          grep -E \
            'jpeg|png|tiff|zlib' \
            config.log |
            tail -n 80 || true

          echo "=========================================================="
          echo "LEPTONICA BUILD"
          echo "=========================================================="

          make -j"$(nproc)" V=1

          echo "=========================================================="
          echo "LEPTONICA INSTALL"
          echo "=========================================================="

          make install

          #
          # Locate generated Leptonica library.
          #

          LEPTONICA_LIB=""

          for candidate in \
            "$SYSROOT/lib/liblept.so" \
            "$SYSROOT/lib/liblept.so.6" \
            "$SYSROOT/lib/liblept.so.6.0.0"
          do
            if [ -f "$candidate" ]; then
              LEPTONICA_LIB="$candidate"
              break
            fi
          done

          if [ -z "$LEPTONICA_LIB" ]; then
            LEPTONICA_LIB="$(
              find "$SYSROOT/lib" \
                -maxdepth 1 \
                -type f \
                -name 'liblept.so*' |
              head -n 1 || true
            )"
          fi

          if [ -z "$LEPTONICA_LIB" ]; then
            echo "ERROR: Leptonica shared library was not generated."
            find "$SYSROOT/lib" -maxdepth 1 -type f -print
            exit 1
          fi

          echo "Leptonica library:"
          echo "$LEPTONICA_LIB"

          #
          # Copy to the exact filename wanted by the package.
          #

          cp -f \
            "$LEPTONICA_LIB" \
            "$SYSROOT/lib/libleptonica.so"

          #
          # =========================================================
          # LEPTONICA JPEG12 CHECK
          # =========================================================
          #

          echo "=========================================================="
          echo "CHECK LEPTONICA JPEG12"
          echo "=========================================================="

          echo "Undefined JPEG12 symbols:"

          "$NM" -D \
            "$SYSROOT/lib/libleptonica.so" 2>/dev/null |
            grep -E \
              ' U jpeg12_(read|write)_(scanlines|raw_data)' \
            && {
              echo "ERROR: Unresolved jpeg12 symbols remain."
              exit 1
            } || true

          echo "JPEG12 symbols exported by Leptonica:"

          "$NM" -D \
            "$SYSROOT/lib/libleptonica.so" 2>/dev/null |
            grep -E \
              ' (T|t) jpeg12_(read|write)_(scanlines|raw_data)' \
            || true

          echo "=========================================================="
          echo "LEPTONICA NEEDED"
          echo "=========================================================="

          "$READELF" -d \
            "$SYSROOT/lib/libleptonica.so" |
            grep NEEDED || true

          #
          # No external image libraries should remain as NEEDED.
          #

          if "$READELF" -d \
            "$SYSROOT/lib/libleptonica.so" |
            grep -E \
              'Shared library: \[(libjpeg|libpng|libtiff|libz)' ; then

            echo "ERROR: Leptonica still depends on external image libraries."
            exit 1
          fi

          check_arm "$SYSROOT/lib/libleptonica.so"

          echo "LEPTONICA BUILD SUCCESS"

          #
          # =========================================================
          # CREATE LEPTONICA PKG-CONFIG
          # =========================================================
          #

          cat > "$SYSROOT/lib/pkgconfig/lept.pc" <<EOF
          prefix=$SYSROOT
          exec_prefix=\${prefix}
          libdir=$SYSROOT/lib
          includedir=$SYSROOT/include

          Name: lept
          Description: Leptonica image processing library
          Version: $LEPTONICA_VERSION
          Libs: -L\${libdir} -lleptonica
          Cflags: -I\${includedir}
          EOF

          #
          # =========================================================
          # TESSERACT
          # =========================================================
          #

          cd "$WORK_DIR"

          download_file \
            "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/${TESSERACT_VERSION}.tar.gz" \
            "tesseract-${TESSERACT_VERSION}.tar.gz"

          rm -rf "tesseract-${TESSERACT_VERSION}"
          tar -xf "tesseract-${TESSERACT_VERSION}.tar.gz"

          cd "tesseract-${TESSERACT_VERSION}"

          rm -rf build

          echo "=========================================================="
          echo "BUILD TESSERACT"
          echo "=========================================================="

          export CPPFLAGS="-I$SYSROOT/include"
          export CFLAGS="$COMMON_CFLAGS"
          export CXXFLAGS="$COMMON_CFLAGS"
          export LDFLAGS="$COMMON_LDFLAGS"

          #
          # Tell pkg-config exactly where our target libraries are.
          #

          export PKG_CONFIG_PATH="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"

          #
          # Some Tesseract CMake versions look for lept.pc.
          #

          pkg-config --modversion lept || true
          pkg-config --libs lept || true
          pkg-config --cflags lept || true

          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_AR="$AR" \
            -DCMAKE_RANLIB="$RANLIB" \
            -DCMAKE_STRIP="$STRIP" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_TRAINING_TOOLS=OFF \
            -DBUILD_UNINSTALLER=OFF \
            -DDISABLE_CURL=ON \
            -DGRAPHICS_DISABLED=OFF \
            -DOPENMP_BUILD=OFF \
            -DCMAKE_PREFIX_PATH="$SYSROOT" \
            -DCMAKE_C_FLAGS="$COMMON_CFLAGS" \
            -DCMAKE_CXX_FLAGS="$COMMON_CFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$COMMON_LDFLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$COMMON_LDFLAGS"

          echo "=========================================================="
          echo "TESSERACT CONFIGURATION"
          echo "=========================================================="

          grep -R \
            -E 'libleptonica|lept' \
            build/CMakeCache.txt \
            2>/dev/null || true

          echo "=========================================================="
          echo "TESSERACT BUILD"
          echo "=========================================================="

          cmake --build build \
            --parallel "$(nproc)" \
            --verbose

          echo "=========================================================="
          echo "TESSERACT INSTALL"
          echo "=========================================================="

          cmake --install build

          #
          # =========================================================
          # FIND TESSERACT
          # =========================================================
          #

          TESSERACT_BIN=""

          for candidate in \
            "$SYSROOT/bin/tesseract" \
            "$SYSROOT/usr/bin/tesseract"
          do
            if [ -x "$candidate" ]; then
              TESSERACT_BIN="$candidate"
              break
            fi
          done

          if [ -z "$TESSERACT_BIN" ]; then
            TESSERACT_BIN="$(
              find "$SYSROOT" \
                -type f \
                -name tesseract \
                -perm -111 |
              head -n 1 || true
            )"
          fi

          if [ -z "$TESSERACT_BIN" ]; then
            echo "ERROR: tesseract binary was not generated."
            find "$SYSROOT" \
              -type f \
              -name tesseract \
              -print
            exit 1
          fi

          echo "Tesseract:"
          echo "$TESSERACT_BIN"

          check_arm "$TESSERACT_BIN"

          #
          # =========================================================
          # FIND LIBTESSERACT
          # =========================================================
          #

          TESSERACT_LIB=""

          for candidate in \
            "$SYSROOT/lib/libtesseract.so" \
            "$SYSROOT/lib/libtesseract.so.5" \
            "$SYSROOT/lib/libtesseract.so.5.5.0"
          do
            if [ -f "$candidate" ]; then
              TESSERACT_LIB="$candidate"
              break
            fi
          done

          if [ -z "$TESSERACT_LIB" ]; then
            TESSERACT_LIB="$(
              find "$SYSROOT/lib" \
                -maxdepth 1 \
                -type f \
                -name 'libtesseract.so*' |
              head -n 1 || true
            )"
          fi

          if [ -z "$TESSERACT_LIB" ]; then
            echo "ERROR: libtesseract.so was not generated."
            find "$SYSROOT/lib" -maxdepth 1 -type f -print
            exit 1
          fi

          cp -f \
            "$TESSERACT_LIB" \
            "$SYSROOT/lib/libtesseract.so"

          check_arm "$SYSROOT/lib/libtesseract.so"

          #
          # =========================================================
          # FINAL PACKAGE
          # =========================================================
          #

          echo "=========================================================="
          echo "CREATE FINAL PACKAGE"
          echo "=========================================================="

          rm -rf "$PACKAGE_DIR"

          mkdir -p \
            "$PACKAGE_DIR/usr/bin" \
            "$PACKAGE_DIR/usr/lib"

          cp -f \
            "$TESSERACT_BIN" \
            "$PACKAGE_DIR/usr/bin/tesseract"

          cp -f \
            "$SYSROOT/lib/libleptonica.so" \
            "$PACKAGE_DIR/usr/lib/libleptonica.so"

          cp -f \
            "$SYSROOT/lib/libtesseract.so" \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"

          #
          # Strip only final package files.
          #

          "$STRIP" \
            "$PACKAGE_DIR/usr/bin/tesseract" \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"

          #
          # =========================================================
          # FINAL FILE COUNT
          # =========================================================
          #

          echo "=========================================================="
          echo "FINAL FILES"
          echo "=========================================================="

          find "$PACKAGE_DIR" \
            -type f \
            -printf '%P\n' |
            sort

          FILE_COUNT="$(
            find "$PACKAGE_DIR" \
              -type f |
            wc -l
          )"

          if [ "$FILE_COUNT" -ne 3 ]; then
            echo "ERROR: Expected exactly 3 files."
            echo "Found: $FILE_COUNT"
            exit 1
          fi

          test -f "$PACKAGE_DIR/usr/bin/tesseract"
          test -f "$PACKAGE_DIR/usr/lib/libleptonica.so"
          test -f "$PACKAGE_DIR/usr/lib/libtesseract.so"

          #
          # =========================================================
          # FINAL JPEG12 CHECK
          # =========================================================
          #

          echo "=========================================================="
          echo "FINAL JPEG12 CHECK"
          echo "=========================================================="

          if "$NM" -D \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" \
            2>/dev/null |
            grep -E \
              ' U jpeg12_(read|write)_(scanlines|raw_data)'; then

            echo "ERROR: Final package contains unresolved JPEG12 symbols."
            exit 1
          fi

          echo "OK: No unresolved JPEG12 symbols."

          #
          # =========================================================
          # FINAL LEPTONICA DEPENDENCIES
          # =========================================================
          #

          echo "=========================================================="
          echo "FINAL LEPTONICA NEEDED"
          echo "=========================================================="

          "$READELF" -d \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" |
            grep NEEDED || true

          if "$READELF" -d \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" |
            grep -E \
              'Shared library: \[(libjpeg|libpng|libtiff|libz)'; then

            echo "ERROR: External image-library dependency remains."
            exit 1
          fi

          #
          # =========================================================
          # FINAL TESSERACT DEPENDENCIES
          # =========================================================
          #

          echo "=========================================================="
          echo "FINAL TESSERACT NEEDED"
          echo "=========================================================="

          "$READELF" -d \
            "$PACKAGE_DIR/usr/lib/libtesseract.so" |
            grep NEEDED || true

          #
          # =========================================================
          # FINAL ARCHITECTURE CHECK
          # =========================================================
          #

          check_arm \
            "$PACKAGE_DIR/usr/bin/tesseract"

          check_arm \
            "$PACKAGE_DIR/usr/lib/libleptonica.so"

          check_arm \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"

          #
          # =========================================================
          # FINAL SIZES
          # =========================================================
          #

          echo "=========================================================="
          echo "FINAL PACKAGE SIZE"
          echo "=========================================================="

          ls -lh \
            "$PACKAGE_DIR/usr/bin/tesseract" \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"

          #
          # =========================================================
          # CREATE TAR.GZ
          # =========================================================
          #

          cd "$PACKAGE_DIR"

          tar -czf \
            "$WORK_DIR/tesseract-${TESSERACT_VERSION}-armv7l.tar.gz" \
            usr

          echo "=========================================================="
          echo "PACKAGE CREATED"
          echo "=========================================================="

          ls -lh \
            "$WORK_DIR/tesseract-${TESSERACT_VERSION}-armv7l.tar.gz"

          echo "=========================================================="
          echo "BUILD COMPLETE"
          echo "=========================================================="

      - name: Upload Tesseract ARMv7l package
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-5.5.3-armv7l
          path: tesseract-5.5.3-armv7l.tar.gz
          if-no-files-found: error
          
