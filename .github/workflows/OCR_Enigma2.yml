name: Cross-Compile Tesseract for Enigma2 ARMv7l

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:

      # ==============================================================
      # CHECKOUT
      # ==============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==============================================================
      # BUILD
      # ==============================================================

      - name: Build ARMv7l package
        shell: bash
        run: |
          set -Eeuo pipefail

          export DEBIAN_FRONTEND=noninteractive


          # ==========================================================
          # BUILD DEPENDENCIES
          # ==========================================================

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            make \
            curl \
            file \
            git \
            cmake \
            ninja-build \
            xz-utils \
            tar \
            patchelf \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf


          # ==========================================================
          # PATHS
          # ==========================================================

          export WORK_DIR="$GITHUB_WORKSPACE"
          export SYSROOT="$WORK_DIR/sysroot"
          export PACKAGE_DIR="$WORK_DIR/package"

          export HOST="arm-linux-gnueabihf"


          # ==========================================================
          # VERSIONS
          # ==========================================================

          export ZLIB_VERSION="1.3.2"
          export LIBPNG_VERSION="1.6.58"
          export LIBJPEG_VERSION="3.2.0"
          export LIBTIFF_VERSION="4.7.2"
          export LEPTONICA_VERSION="1.87.0"
          export TESSERACT_VERSION="5.5.3"


          # ==========================================================
          # CROSS COMPILER
          # ==========================================================

          export CC="${HOST}-gcc"
          export CXX="${HOST}-g++"
          export AR="${HOST}-ar"
          export AS="${HOST}-as"
          export RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip"
          export NM="${HOST}-nm"
          export OBJCOPY="${HOST}-objcopy"
          export READELF="${HOST}-readelf"


          # ==========================================================
          # CLEAN
          # ==========================================================

          rm -rf \
            "$SYSROOT" \
            "$PACKAGE_DIR"

          mkdir -p \
            "$SYSROOT/bin" \
            "$SYSROOT/include" \
            "$SYSROOT/lib" \
            "$SYSROOT/share" \
            "$SYSROOT/lib/pkgconfig" \
            "$PACKAGE_DIR"


          # ==========================================================
          # PATH
          # ==========================================================

          export PATH="$SYSROOT/bin:$PATH"


          # ==========================================================
          # COMMON FLAGS
          # ==========================================================

          export COMMON_CFLAGS="-fPIC -O2 -fno-semantic-interposition"
          export COMMON_CPPFLAGS="-I$SYSROOT/include"
          export COMMON_LDFLAGS="-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib"


          # ==========================================================
          # FUNCTIONS
          # ==========================================================

          download_file()
          {
            local url="$1"
            local output="$2"

            echo
            echo "=========================================================="
            echo "DOWNLOAD"
            echo "$url"
            echo "=========================================================="

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 3 \
              --retry-connrefused \
              --show-error \
              --progress-bar \
              --output "$output" \
              "$url"

            if [ ! -s "$output" ]; then
              echo "ERROR: Empty download:"
              echo "$output"
              exit 1
            fi
          }


          build_make()
          {
            local directory="$1"

            echo
            echo "=========================================================="
            echo "MAKE BUILD"
            echo "$directory"
            echo "=========================================================="

            if ! make -C "$directory" -j"$(nproc)"; then

              echo
              echo "=========================================================="
              echo "BUILD FAILED"
              echo "$directory"
              echo "=========================================================="

              find "$directory" \
                -name "config.log" \
                -type f \
                -print \
                -exec tail -n 200 {} \; || true

              find "$directory" \
                -name "*.log" \
                -type f \
                -print \
                -exec tail -n 120 {} \; || true

              exit 1
            fi
          }


          check_arm()
          {
            local file_name="$1"

            if [ ! -e "$file_name" ] && [ ! -L "$file_name" ]; then
              echo "ERROR: Missing:"
              echo "$file_name"
              exit 1
            fi

            file "$file_name"

            if ! file "$file_name" | grep -Eqi "ARM"; then
              echo "ERROR: Not ARM:"
              echo "$file_name"
              exit 1
            fi
          }


          # ==========================================================
          # ZLIB - STATIC
          # ==========================================================

          cd "$WORK_DIR"

          download_file \
            "https://zlib.net/zlib-${ZLIB_VERSION}.tar.gz" \
            "zlib-${ZLIB_VERSION}.tar.gz"

          tar -xzf \
            "zlib-${ZLIB_VERSION}.tar.gz"

          cd "zlib-${ZLIB_VERSION}"

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          CFLAGS="$COMMON_CFLAGS" \
          ./configure \
            --prefix="$SYSROOT" \
            --static

          build_make "$WORK_DIR/zlib-${ZLIB_VERSION}"

          make -C "$WORK_DIR/zlib-${ZLIB_VERSION}" install


          # ==========================================================
          # LIBJPEG-TURBO - STATIC
          #
          # IMPORTANT:
          #
          # libjpeg-turbo 3.x provides the dual 8/12-bit API.
          #
          # WITH_12BIT must remain OFF here.
          #
          # We verify that jpeg12_* symbols are really present
          # inside libjpeg.a before continuing.
          # ==========================================================

          cd "$WORK_DIR"

          download_file \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_VERSION}/libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz" \
            "libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz"

          tar -xzf \
            "libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz"

          cd "libjpeg-turbo-${LIBJPEG_VERSION}"

          rm -rf build

          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_AR="$AR" \
            -DCMAKE_RANLIB="$RANLIB" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_12BIT=OFF \
            -DWITH_ARITH=ON

          cmake --build build \
            --parallel "$(nproc)"

          cmake --install build


          # ==========================================================
          # VERIFY JPEG12 SYMBOLS
          # ==========================================================

          echo
          echo "=========================================================="
          echo "CHECKING LIBJPEG JPEG12 SYMBOLS"
          echo "=========================================================="

          if [ ! -f "$SYSROOT/lib/libjpeg.a" ]; then
            echo "ERROR: libjpeg.a was not generated."
            exit 1
          fi

          echo
          echo "JPEG12 symbols:"
          "$NM" -g "$SYSROOT/lib/libjpeg.a" \
            | grep "jpeg12_" \
            | head -n 40 || true

          if ! "$NM" -g "$SYSROOT/lib/libjpeg.a" \
            | grep -q "jpeg12_read_scanlines"; then

            echo
            echo "ERROR: libjpeg.a does not contain jpeg12_read_scanlines."
            echo "The libjpeg-turbo dual 8/12-bit API is missing."
            exit 1
          fi

          if ! "$NM" -g "$SYSROOT/lib/libjpeg.a" \
            | grep -q "jpeg12_write_scanlines"; then

            echo
            echo "ERROR: libjpeg.a does not contain jpeg12_write_scanlines."
            exit 1
          fi


          # ==========================================================
          # LIBPNG - STATIC
          # ==============================================================

          cd "$WORK_DIR"

          download_file \
            "https://download.sourceforge.net/libpng/libpng-${LIBPNG_VERSION}.tar.xz" \
            "libpng-${LIBPNG_VERSION}.tar.xz"

          tar -xf \
            "libpng-${LIBPNG_VERSION}.tar.xz"

          cd "libpng-${LIBPNG_VERSION}"

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          CPPFLAGS="-I$SYSROOT/include" \
          CFLAGS="$COMMON_CFLAGS -I$SYSROOT/include" \
          LDFLAGS="-L$SYSROOT/lib" \
          ./configure \
            --host="$HOST" \
            --build="$(gcc -dumpmachine)" \
            --prefix="$SYSROOT" \
            --enable-static \
            --disable-shared \
            --with-zlib-prefix="$SYSROOT"

          build_make "$WORK_DIR/libpng-${LIBPNG_VERSION}"

          make -C "$WORK_DIR/libpng-${LIBPNG_VERSION}" install


          # ==========================================================
          # LIBTIFF - STATIC
          # ==============================================================

          cd "$WORK_DIR"

          download_file \
            "https://download.osgeo.org/libtiff/tiff-${LIBTIFF_VERSION}.tar.gz" \
            "tiff-${LIBTIFF_VERSION}.tar.gz"

          tar -xzf \
            "tiff-${LIBTIFF_VERSION}.tar.gz"

          cd "tiff-${LIBTIFF_VERSION}"

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          CPPFLAGS="-I$SYSROOT/include" \
          CFLAGS="$COMMON_CFLAGS -I$SYSROOT/include" \
          LDFLAGS="-L$SYSROOT/lib" \
          ./configure \
            --host="$HOST" \
            --build="$(gcc -dumpmachine)" \
            --prefix="$SYSROOT" \
            --enable-static \
            --disable-shared \
            --with-pic \
            --with-jpeg \
            --with-jpeg-include-dir="$SYSROOT/include" \
            --with-jpeg-lib-dir="$SYSROOT/lib" \
            --with-zlib \
            --disable-zstd \
            --disable-lzma \
            --disable-webp \
            --disable-jbig \
            --disable-jp2 \
            --disable-libdeflate

          build_make "$WORK_DIR/tiff-${LIBTIFF_VERSION}"

          make -C "$WORK_DIR/tiff-${LIBTIFF_VERSION}" install


          # ==========================================================
          # CHECK STATIC LIBRARIES
          # ==========================================================

          echo
          echo "=========================================================="
          echo "STATIC LIBRARIES"
          echo "=========================================================="

          ls -lh \
            "$SYSROOT/lib/libz.a" \
            "$SYSROOT/lib/libjpeg.a" \
            "$SYSROOT/lib/libpng16.a" \
            "$SYSROOT/lib/libtiff.a"


          # ==========================================================
          # LEPTONICA - SHARED
          #
          # We deliberately build Leptonica ourselves with the
          # required static libraries explicitly linked.
          # ==========================================================

          cd "$WORK_DIR"

          download_file \
            "https://github.com/DanBloomberg/leptonica/releases/download/${LEPTONICA_VERSION}/leptonica-${LEPTONICA_VERSION}.tar.gz" \
            "leptonica-${LEPTONICA_VERSION}.tar.gz"

          tar -xzf \
            "leptonica-${LEPTONICA_VERSION}.tar.gz"

          cd "leptonica-${LEPTONICA_VERSION}"

          rm -rf build

          cat > "$WORK_DIR/leptonica-toolchain.cmake" <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR armv7l)

          set(CMAKE_C_COMPILER $CC)
          set(CMAKE_AR $AR)
          set(CMAKE_RANLIB $RANLIB)
          set(CMAKE_STRIP $STRIP)

          set(CMAKE_FIND_ROOT_PATH $SYSROOT)

          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)

          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)

          set(CMAKE_C_FLAGS_INIT "-fPIC -O2 -fno-semantic-interposition -I$SYSROOT/include")

          set(CMAKE_SHARED_LINKER_FLAGS_INIT
            "-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib -Wl,--no-as-needed")
          EOF


          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$WORK_DIR/leptonica-toolchain.cmake" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$SYSROOT" \
            -DCMAKE_INCLUDE_PATH="$SYSROOT/include" \
            -DCMAKE_LIBRARY_PATH="$SYSROOT/lib" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_PROG=OFF \
            -DSW_BUILD=OFF \
            -DENABLE_ZLIB=ON \
            -DENABLE_PNG=ON \
            -DENABLE_JPEG=ON \
            -DENABLE_TIFF=ON \
            -DENABLE_GIF=OFF \
            -DENABLE_WEBP=OFF \
            -DENABLE_OPENJPEG=OFF


          # ==========================================================
          # FORCE STATIC LIBRARIES
          # ==========================================================

          export PKG_CONFIG_PATH="$SYSROOT/lib/pkgconfig"

          export ZLIB_CFLAGS="-I$SYSROOT/include"
          export ZLIB_LIBS="$SYSROOT/lib/libz.a"

          export PNG_CFLAGS="-I$SYSROOT/include"
          export PNG_LIBS="$SYSROOT/lib/libpng16.a $SYSROOT/lib/libz.a"

          export JPEG_CFLAGS="-I$SYSROOT/include"
          export JPEG_LIBS="$SYSROOT/lib/libjpeg.a"

          export TIFF_CFLAGS="-I$SYSROOT/include"
          export TIFF_LIBS="$SYSROOT/lib/libtiff.a $SYSROOT/lib/libjpeg.a $SYSROOT/lib/libpng16.a $SYSROOT/lib/libz.a"


          # ==========================================================
          # SHOW CMAKE CACHE
          # ==========================================================

          echo
          echo "=========================================================="
          echo "LEPTONICA IMAGE LIBRARIES"
          echo "=========================================================="

          grep -E \
            "JPEG|TIFF|PNG|ZLIB" \
            build/CMakeCache.txt \
            | grep -E \
            "LIBRARY|LIBRARIES|FOUND|ENABLE" \
            || true


          # ==========================================================
          # BUILD LEPTONICA
          # ==========================================================

          if ! cmake --build build \
            --parallel "$(nproc)" \
            --verbose; then

            echo
            echo "=========================================================="
            echo "LEPTONICA BUILD FAILED"
            echo "=========================================================="

            find "$WORK_DIR/leptonica-${LEPTONICA_VERSION}/build" \
              -type f \
              \( \
                -name "*.log" \
                -o -name "CMakeError.log" \
                -o -name "CMakeOutput.log" \
              \) \
              -print \
              -exec tail -n 200 {} \; || true

            exit 1
          fi


          # ==========================================================
          # INSTALL LEPTONICA
          # ==========================================================

          cmake --install build


          # ==========================================================
          # FIND LEPTONICA LIBRARY
          # ==========================================================

          echo
          echo "=========================================================="
          echo "LEPTONICA LIBRARY"
          echo "=========================================================="

          find "$SYSROOT/lib" \
            -maxdepth 1 \
            -type f \
            -name "liblept.so*" \
            -print \
            || true


          if [ ! -e "$SYSROOT/lib/liblept.so" ]; then
            echo "ERROR: liblept.so was not generated."
            exit 1
          fi


          # ==========================================================
          # RENAME LEPTONICA
          # ==========================================================

          rm -f "$SYSROOT/lib/libleptonica.so"

          mv \
            "$SYSROOT/lib/liblept.so" \
            "$SYSROOT/lib/libleptonica.so"


          # ==========================================================
          # FIX LEPTONICA SONAME
          # ==========================================================

          patchelf \
            --set-soname libleptonica.so \
            "$SYSROOT/lib/libleptonica.so"


          # ==========================================================
          # VERIFY JPEG12 SYMBOLS INSIDE LEPTONICA
          # ==========================================================

          echo
          echo "=========================================================="
          echo "CHECKING LEPTONICA JPEG12 REFERENCES"
          echo "=========================================================="

          JPEG12_UNRESOLVED="$(
            "$NM" -D "$SYSROOT/lib/libleptonica.so" 2>/dev/null \
              | grep -E \
                " U jpeg12_(read|write)_" \
              || true
          )"

          if [ -n "$JPEG12_UNRESOLVED" ]; then

            echo
            echo "ERROR: Leptonica still contains unresolved jpeg12 symbols:"
            echo "$JPEG12_UNRESOLVED"

            echo
            echo "Leptonica was not linked correctly with libjpeg.a."

            exit 1
          fi


          echo "OK: No unresolved jpeg12_* symbols."


          # ==========================================================
          # CHECK LEPTONICA NEEDED
          # ==========================================================

          echo
          echo "=========================================================="
          echo "LEPTONICA NEEDED"
          echo "=========================================================="

          "$READELF" \
            -d "$SYSROOT/lib/libleptonica.so" \
            | grep NEEDED \
            || true


          # ==========================================================
          # TESSERACT
          # ==========================================================

          cd "$WORK_DIR"

          download_file \
            "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/${TESSERACT_VERSION}.tar.gz" \
            "tesseract-${TESSERACT_VERSION}.tar.gz"

          tar -xzf \
            "tesseract-${TESSERACT_VERSION}.tar.gz"

          cd "tesseract-${TESSERACT_VERSION}"


          # ==========================================================
          # VERSION STRING
          # ==========================================================

          sed -i \
            's/return TESSERACT_VERSION_STR;/return "5.5.3 - Compile ByArian";/g' \
            src/api/baseapi.cpp \
            || true


          # ==========================================================
          # TESSDATA PATHS
          # ==========================================================

          sed -i \
            's|"/usr/share/tessdata/"|"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/";|g' \
            src/ccutil/mainblk.cpp \
            || true


          # ==========================================================
          # TESSERACT TOOLCHAIN
          # ==========================================================

          cat > "$WORK_DIR/tesseract-toolchain.cmake" <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR armv7l)

          set(CMAKE_C_COMPILER $CC)
          set(CMAKE_CXX_COMPILER $CXX)

          set(CMAKE_AR $AR)
          set(CMAKE_RANLIB $RANLIB)
          set(CMAKE_STRIP $STRIP)

          set(CMAKE_FIND_ROOT_PATH $SYSROOT)

          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)

          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)

          set(CMAKE_C_FLAGS_INIT "-fPIC -O2 -fno-semantic-interposition -I$SYSROOT/include")
          set(CMAKE_CXX_FLAGS_INIT "-fPIC -O2 -fno-semantic-interposition -I$SYSROOT/include -I$SYSROOT/include/leptonica")

          set(CMAKE_EXE_LINKER_FLAGS_INIT
            "-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib -Wl,--no-as-needed")

          set(CMAKE_SHARED_LINKER_FLAGS_INIT
            "-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib -Wl,--no-as-needed")
          EOF


          # ==========================================================
          # TESSERACT CMAKE
          # ==========================================================

          rm -rf build

          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$WORK_DIR/tesseract-toolchain.cmake" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$SYSROOT" \
            -DCMAKE_INCLUDE_PATH="$SYSROOT/include;$SYSROOT/include/leptonica" \
            -DCMAKE_LIBRARY_PATH="$SYSROOT/lib" \
            -DOPENMP_BUILD=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_TRAINING_TOOLS=OFF \
            -DBUILD_TRAINING=OFF \
            -DOPENCL_ENABLED=OFF \
            -DGRAPHICS_DISABLED=ON \
            -DUSE_SYSTEM_ICU=OFF \
            -DDISABLE_CURL=ON \
            -DSW_BUILD=OFF


          # ==========================================================
          # BUILD TESSERACT
          # ==========================================================

          if ! cmake --build build \
            --parallel "$(nproc)" \
            --verbose; then

            echo
            echo "=========================================================="
            echo "TESSERACT BUILD FAILED"
            echo "=========================================================="

            find "$WORK_DIR/tesseract-${TESSERACT_VERSION}/build" \
              -type f \
              \( \
                -name "*.log" \
                -o \
                -name "CMakeError.log" \
                -o \
                -name "CMakeOutput.log" \
              \) \
              -print \
              -exec tail -n 200 {} \; || true

            exit 1
          fi


          # ==========================================================
          # INSTALL TESSERACT
          # ==========================================================

          cmake --install build


          # ==========================================================
          # TESSERACT LIBRARY
          # ==========================================================

          if [ ! -f "$SYSROOT/lib/libtesseract.so" ]; then
            echo "ERROR: libtesseract.so was not generated."
            exit 1
          fi


          # ==========================================================
          # FIX TESSERACT LEPTONICA SONAME
          # ==========================================================

          patchelf \
            --replace-needed liblept.so libleptonica.so \
            "$SYSROOT/lib/libtesseract.so"


          # ==========================================================
          # VERIFY TESSERACT
          # ==========================================================

          echo
          echo "=========================================================="
          echo "TESSERACT NEEDED"
          echo "=========================================================="

          "$READELF" \
            -d "$SYSROOT/lib/libtesseract.so" \
            | grep NEEDED \
            || true


          echo
          echo "=========================================================="
          echo "TESSERACT EXECUTABLE NEEDED"
          echo "=========================================================="

          "$READELF" \
            -d "$SYSROOT/bin/tesseract" \
            | grep NEEDED \
            || true


          # ==========================================================
          # VERIFY NO EXTERNAL IMAGE LIBRARIES
          # ==========================================================

          echo
          echo "=========================================================="
          echo "CHECKING FOR UNWANTED EXTERNAL LIBRARIES"
          echo "=========================================================="

          for binary in \
            "$SYSROOT/lib/libleptonica.so" \
            "$SYSROOT/lib/libtesseract.so"; do

            echo
            echo "Checking:"
            echo "$binary"

            if "$READELF" -d "$binary" | grep -E \
              'libz\.so|libjpeg\.so|libpng16\.so|libtiff\.so'; then

              echo
              echo "ERROR:"
              echo "$binary still requires an external image library."

              exit 1
            fi

          done


          # ==========================================================
          # CHECK UNRESOLVED JPEG12 SYMBOLS AGAIN
          # ==========================================================

          echo
          echo "=========================================================="
          echo "FINAL JPEG12 CHECK"
          echo "=========================================================="

          for binary in \
            "$SYSROOT/lib/libleptonica.so" \
            "$SYSROOT/lib/libtesseract.so"; do

            echo
            echo "Checking:"
            echo "$binary"

            if "$NM" -D "$binary" 2>/dev/null \
              | grep -E \
                " U jpeg12_(read|write)_" ; then

              echo
              echo "ERROR: Unresolved jpeg12 symbols found."
              exit 1
            fi

          done

          echo
          echo "OK: No unresolved jpeg12 symbols."


          # ==========================================================
          # ARM CHECK
          # ==========================================================

          echo
          echo "=========================================================="
          echo "ARM CHECK"
          echo "=========================================================="

          check_arm "$SYSROOT/bin/tesseract"
          check_arm "$SYSROOT/lib/libleptonica.so"
          check_arm "$SYSROOT/lib/libtesseract.so"


          # ==========================================================
          # CREATE FINAL PACKAGE
          # ==============================================================

          echo
          echo "=========================================================="
          echo "CREATING FINAL PACKAGE"
          echo "=========================================================="

          rm -rf "$PACKAGE_DIR"

          mkdir -p \
            "$PACKAGE_DIR/usr/bin" \
            "$PACKAGE_DIR/usr/lib"


          # ==========================================================
          # ONLY THREE FILES
          # ==========================================================

          cp -a \
            "$SYSROOT/bin/tesseract" \
            "$PACKAGE_DIR/usr/bin/tesseract"

          cp -a \
            "$SYSROOT/lib/libleptonica.so" \
            "$PACKAGE_DIR/usr/lib/libleptonica.so"

          cp -a \
            "$SYSROOT/lib/libtesseract.so" \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"


          # ==========================================================
          # STRIP
          # ==========================================================

          "$STRIP" \
            --strip-unneeded \
            "$PACKAGE_DIR/usr/bin/tesseract" \
            || true

          "$STRIP" \
            --strip-unneeded \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" \
            || true

          "$STRIP" \
            --strip-unneeded \
            "$PACKAGE_DIR/usr/lib/libtesseract.so" \
            || true


          # ==========================================================
          # PERMISSIONS
          # ==========================================================

          chmod 755 \
            "$PACKAGE_DIR/usr/bin/tesseract"

          chmod 755 \
            "$PACKAGE_DIR/usr/lib/libleptonica.so"

          chmod 755 \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"


          # ==========================================================
          # FINAL PACKAGE CONTENT
          # ==========================================================

          echo
          echo "=========================================================="
          echo "FINAL PACKAGE CONTENT"
          echo "=========================================================="

          find "$PACKAGE_DIR" \
            -type f \
            -print \
            | sort


          # ==========================================================
          # COUNT FILES
          # ==========================================================

          FILE_COUNT="$(
            find "$PACKAGE_DIR" \
              -type f \
              | wc -l
          )"

          echo
          echo "Final file count:"
          echo "$FILE_COUNT"

          if [ "$FILE_COUNT" -ne 3 ]; then
            echo "ERROR: Package must contain exactly 3 files."
            exit 1
          fi


          # ==========================================================
          # FINAL FILE TYPES
          # ==========================================================

          echo
          echo "=========================================================="
          echo "FINAL FILE TYPES"
          echo "=========================================================="

          file \
            "$PACKAGE_DIR/usr/bin/tesseract" \
            "$PACKAGE_DIR/usr/lib/libleptonica.so" \
            "$PACKAGE_DIR/usr/lib/libtesseract.so"


          # ==========================================================
          # FINAL SONAME
          # ==========================================================

          echo
          echo "=========================================================="
          echo "FINAL SONAME"
          echo "=========================================================="

          "$READELF" \
            -d "$PACKAGE_DIR/usr/lib/libleptonica.so" \
            | grep SONAME \
            || true

          "$READELF" \
            -d "$PACKAGE_DIR/usr/lib/libtesseract.so" \
            | grep -E "SONAME|NEEDED" \
            || true


          # ==========================================================
          # FINAL DEPENDENCY CHECK
          # ==========================================================

          echo
          echo "=========================================================="
          echo "FINAL DEPENDENCY CHECK"
          echo "=========================================================="

          echo
          echo "--- libleptonica.so ---"

          "$READELF" \
            -d "$PACKAGE_DIR/usr/lib/libleptonica.so" \
            | grep NEEDED \
            || true

          echo
          echo "--- libtesseract.so ---"

          "$READELF" \
            -d "$PACKAGE_DIR/usr/lib/libtesseract.so" \
            | grep NEEDED \
            || true

          echo
          echo "--- tesseract ---"

          "$READELF" \
            -d "$PACKAGE_DIR/usr/bin/tesseract" \
            | grep NEEDED \
            || true


          # ==========================================================
          # PACKAGE SIZE
          # ==========================================================

          echo
          echo "=========================================================="
          echo "PACKAGE SIZE"
          echo "=========================================================="

          du -ah "$PACKAGE_DIR" \
            | sort -h


          # ==========================================================
          # BUILD SUCCESS
          # ==========================================================

          echo
          echo "=========================================================="
          echo "BUILD SUCCESS"
          echo "=========================================================="

          echo
          echo "Final package contains exactly:"
          echo
          echo "usr/bin/tesseract"
          echo "usr/lib/libleptonica.so"
          echo "usr/lib/libtesseract.so"


      # ==============================================================
      # UPLOAD
      # ==============================================================

      - name: Upload ARMv7l artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-enigma2-armv7l
          path: package/
          if-no-files-found: error
