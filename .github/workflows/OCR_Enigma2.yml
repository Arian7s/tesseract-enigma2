name: Fast Cross-Compile Tesseract for Enigma2 (ARMv7l)

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Tesseract ARMv7l (Fast Cross-Compile)
      run: |
        set -e
        export DEBIAN_FRONTEND=noninteractive

        sudo apt-get update && sudo apt-get install -y \
          autoconf automake libtool pkg-config make wget file git cmake \
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

        export WORK_DIR=$GITHUB_WORKSPACE
        export SYSROOT=$WORK_DIR/sysroot
        mkdir -p $SYSROOT

        export CC=arm-linux-gnueabihf-gcc
        export CXX=arm-linux-gnueabihf-g++
        export AR=arm-linux-gnueabihf-ar
        export RANLIB=arm-linux-gnueabihf-ranlib
        export STRIP=arm-linux-gnueabihf-strip
        
        export CFLAGS="-fPIC -Os -I$SYSROOT/include"
        export CXXFLAGS="-fPIC -Os -I$SYSROOT/include"
        export LDFLAGS="-L$SYSROOT/lib"
        export PKG_CONFIG_PATH="$SYSROOT/lib/pkgconfig"
        export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig"

        wget -O zlib-1.3.2.tar.gz https://github.com/madler/zlib/archive/refs/tags/v1.3.2.tar.gz
        tar -xzf zlib-1.3.2.tar.gz
        cd zlib-1.3.2
        ./configure --prefix=$SYSROOT --static
        make -j$(nproc)
        make install
        cd ..

        wget https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0.tar.gz
        tar -xzf libjpeg-turbo-3.2.0.tar.gz
        cd libjpeg-turbo-3.2.0
        mkdir build-jpeg && cd build-jpeg
        cmake -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=armv7l \
              -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
              -DCMAKE_INSTALL_PREFIX=$SYSROOT \
              -DENABLE_SHARED=OFF \
              -DENABLE_STATIC=ON \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        make install
        cd ../..

        wget https://download.sourceforge.net/libpng/libpng-1.6.58.tar.gz || wget https://sourceforge.net/projects/libpng/files/libpng16/1.6.58/libpng-1.6.58.tar.gz
        tar -xzf libpng-1.6.58.tar.gz
        cd libpng-1.6.58
        ./configure --host=arm-linux-gnueabihf --prefix=$SYSROOT --disable-shared --enable-static --with-pic
        make -j$(nproc)
        make install
        cd ..

        wget https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz
        tar -xzf tiff-4.7.2.tar.gz
        cd tiff-4.7.2
        ./configure --host=arm-linux-gnueabihf --prefix=$SYSROOT --disable-shared --enable-static --with-pic
        make -j$(nproc)
        make install
        cd ..

        wget --no-check-certificate https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
        tar -xzf leptonica-1.87.0.tar.gz
        cd leptonica-1.87.0
        ./configure --host=arm-linux-gnueabihf --prefix=$SYSROOT --enable-shared --disable-static --with-libjpeg --with-libpng --with-libtiff --with-zlib
        make -j$(nproc)
        make install
        cd ..

        mkdir -p $SYSROOT/lib/pkgconfig
        cat << EOF > $SYSROOT/lib/pkgconfig/lept.pc
        prefix=$SYSROOT
        exec_prefix=\${prefix}
        libdir=\${prefix}/lib
        includedir=\${prefix}/include/leptonica

        Name: leptonica
        Description: An open source C library for efficient image processing
        Version: 1.87.0
        Libs: -L\${libdir} -llept
        Cflags: -I\${includedir}
        EOF

        wget --no-check-certificate https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
        tar -xzf 5.5.3.tar.gz
        cd tesseract-5.5.3

        sed -i 's/return TESSERACT_VERSION_STR;/return \"5.5.3 - Compile ByArian\";/g' src/api/baseapi.cpp || true
        sed -i 's|\"/usr/share/tessdata/\"|\"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/\"|g' src/ccutil/mainblk.cpp || true

        ./autogen.sh
        ./configure --host=arm-linux-gnueabihf \
                    --prefix=$SYSROOT \
                    --disable-static \
                    --disable-debug \
                    --disable-icu \
                    --without-pango \
                    --without-cairo \
                    --without-libarchive \
                    LEPTONICA_CFLAGS="-I$SYSROOT/include/leptonica" \
                    LEPTONICA_LIBS="-L$SYSROOT/lib -llept"
        make -j$(nproc)
        make install
        cd ..

        mkdir -p package/usr/bin package/usr/lib package/usr/share/tessdata

        cp $SYSROOT/bin/tesseract package/usr/bin/

        TESS_FILE=$(find $SYSROOT/lib -name 'libtesseract.so*' -type f ! -type l | head -n 1)
        LEPT_FILE=$(find $SYSROOT/lib \( -name 'libleptonica.so*' -o -name 'liblept.so*' \) -type f ! -type l | head -n 1)

        if [ -z "$TESS_FILE" ] || [ -z "$LEPT_FILE" ]; then
          echo "FATAL: Dynamic libraries were not found!"
          exit 1
        fi

        cp "$TESS_FILE" package/usr/lib/libtesseract.so.5.5.3
        cp "$LEPT_FILE" package/usr/lib/libleptonica.so.6.0.0

        $STRIP --strip-all package/usr/bin/tesseract || true
        $STRIP --strip-unneeded package/usr/lib/*.so* || true
        chmod -R 777 package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-armv7l-fast
        path: package/
