name: Cross-Compile Tesseract for Enigma2 ARMv7l

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ARMv7l package
        shell: bash
        run: |
          set -Eeuo pipefail

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            make \
            curl \
            file \
            git \
            cmake \
            ninja-build \
            xz-utils \
            tar \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf

          export WORK_DIR="$GITHUB_WORKSPACE"
          export SYSROOT="$WORK_DIR/sysroot"
          export PACKAGE_DIR="$WORK_DIR/package"
          export HOST="arm-linux-gnueabihf"

          export ZLIB_VERSION="1.3.2"
          export LIBPNG_VERSION="1.6.58"
          export LIBJPEG_VERSION="3.2.0"
          export LIBTIFF_VERSION="4.7.2"
          export LEPTONICA_VERSION="1.87.0"
          export TESSERACT_VERSION="5.5.3"

          export CC="${HOST}-gcc"
          export CXX="${HOST}-g++"
          export AR="${HOST}-ar"
          export AS="${HOST}-as"
          export RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip"
          export NM="${HOST}-nm"
          export OBJCOPY="${HOST}-objcopy"

          rm -rf "$SYSROOT" "$PACKAGE_DIR"

          mkdir -p \
            "$SYSROOT/bin" \
            "$SYSROOT/include" \
            "$SYSROOT/lib" \
            "$SYSROOT/share" \
            "$SYSROOT/lib/pkgconfig" \
            "$PACKAGE_DIR"

          export PATH="$SYSROOT/bin:$PATH"

          download_file() {
            local url="$1"
            local output="$2"

            echo "Downloading: $url"

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 3 \
              --retry-connrefused \
              --show-error \
              --progress-bar \
              --output "$output" \
              "$url"

            if [ ! -s "$output" ]; then
              echo "Downloaded file is empty: $output"
              exit 1
            fi
          }

          run_make() {
            local directory="$1"
            shift

            if ! make -C "$directory" -j"$(nproc)" "$@"; then
              echo "Build failed in: $directory"
              find "$directory" -name 'config.log' -type f -print -exec tail -n 120 {} \; || true
              find "$directory" -name '*.log' -type f -print -exec tail -n 80 {} \; || true
              exit 1
            fi
          }

          # ------------------------------------------------------------------
          # zlib 1.3.2
          # ------------------------------------------------------------------
          cd "$WORK_DIR"

          download_file \
            "https://zlib.net/zlib-${ZLIB_VERSION}.tar.gz" \
            "zlib-${ZLIB_VERSION}.tar.gz"

          tar -xzf "zlib-${ZLIB_VERSION}.tar.gz"
          cd "zlib-${ZLIB_VERSION}"

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          CFLAGS="-fPIC -O2" \
          ./configure \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --shared

          run_make "$WORK_DIR/zlib-${ZLIB_VERSION}"
          make -C "$WORK_DIR/zlib-${ZLIB_VERSION}" install

          cd "$WORK_DIR"

          # ------------------------------------------------------------------
          # libjpeg-turbo 3.2.0
          # ------------------------------------------------------------------
          download_file \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_VERSION}/libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz" \
            "libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz"

          tar -xzf "libjpeg-turbo-${LIBJPEG_VERSION}.tar.gz"
          cd "libjpeg-turbo-${LIBJPEG_VERSION}"

          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DENABLE_SHARED=ON \
            -DENABLE_STATIC=OFF \
            -DWITH_12BIT=OFF \
            -DWITH_ARITH=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --parallel "$(nproc)"
          cmake --install build

          cd "$WORK_DIR"

          # ------------------------------------------------------------------
          # libpng 1.6.58
          # ------------------------------------------------------------------
          download_file \
            "https://download.sourceforge.net/libpng/libpng-${LIBPNG_VERSION}.tar.xz" \
            "libpng-${LIBPNG_VERSION}.tar.xz"

          tar -xf "libpng-${LIBPNG_VERSION}.tar.xz"
          cd "libpng-${LIBPNG_VERSION}"

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          CPPFLAGS="-I$SYSROOT/include" \
          CFLAGS="-fPIC -O2 -I$SYSROOT/include" \
          LDFLAGS="-L$SYSROOT/lib" \
          ./configure \
            --host="$HOST" \
            --build="$(gcc -dumpmachine)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --enable-shared \
            --disable-static \
            --with-zlib-prefix="$SYSROOT"

          run_make "$WORK_DIR/libpng-${LIBPNG_VERSION}"
          make -C "$WORK_DIR/libpng-${LIBPNG_VERSION}" install

          cd "$WORK_DIR"

          # ------------------------------------------------------------------
          # libtiff 4.7.2
          # ------------------------------------------------------------------
          download_file \
            "https://download.osgeo.org/libtiff/tiff-${LIBTIFF_VERSION}.tar.gz" \
            "tiff-${LIBTIFF_VERSION}.tar.gz"

          tar -xzf "tiff-${LIBTIFF_VERSION}.tar.gz"
          cd "tiff-${LIBTIFF_VERSION}"

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          CPPFLAGS="-I$SYSROOT/include" \
          CFLAGS="-fPIC -O2 -I$SYSROOT/include" \
          LDFLAGS="-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib" \
          ./configure \
            --host="$HOST" \
            --build="$(gcc -dumpmachine)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --enable-shared \
            --disable-static \
            --with-pic \
            --with-jpeg \
            --with-jpeg-include-dir="$SYSROOT/include" \
            --with-jpeg-lib-dir="$SYSROOT/lib" \
            --with-zlib \
            --disable-zstd \
            --disable-lzma \
            --disable-webp \
            --disable-jbig \
            --disable-jp2 \
            --disable-libdeflate

          run_make "$WORK_DIR/tiff-${LIBTIFF_VERSION}"
          make -C "$WORK_DIR/tiff-${LIBTIFF_VERSION}" install

          cd "$WORK_DIR"

          # ------------------------------------------------------------------
          # Leptonica 1.87.0
          # ------------------------------------------------------------------
          download_file \
            "https://github.com/DanBloomberg/leptonica/releases/download/${LEPTONICA_VERSION}/leptonica-${LEPTONICA_VERSION}.tar.gz" \
            "leptonica-${LEPTONICA_VERSION}.tar.gz"

          tar -xzf "leptonica-${LEPTONICA_VERSION}.tar.gz"
          cd "leptonica-${LEPTONICA_VERSION}"

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          CPPFLAGS="-I$SYSROOT/include -I$SYSROOT/include/leptonica" \
          CFLAGS="-fPIC -O2 -I$SYSROOT/include -I$SYSROOT/include/leptonica" \
          LDFLAGS="-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib" \
          ./configure \
            --host="$HOST" \
            --build="$(gcc -dumpmachine)" \
            --prefix="$SYSROOT" \
            --libdir="$SYSROOT/lib" \
            --enable-shared \
            --disable-static \
            --with-libjpeg \
            --with-libpng \
            --with-libtiff \
            --with-zlib \
            --without-giflib \
            --without-libwebp \
            --without-libopenjpeg \
            --without-libjp2 \
            JPEG_CFLAGS="-I$SYSROOT/include" \
            JPEG_LIBS="-L$SYSROOT/lib -ljpeg" \
            PNG_CFLAGS="-I$SYSROOT/include" \
            PNG_LIBS="-L$SYSROOT/lib -lpng16" \
            TIFF_CFLAGS="-I$SYSROOT/include" \
            TIFF_LIBS="-L$SYSROOT/lib -ltiff" \
            ZLIB_CFLAGS="-I$SYSROOT/include" \
            ZLIB_LIBS="-L$SYSROOT/lib -lz"

          run_make "$WORK_DIR/leptonica-${LEPTONICA_VERSION}"
          make -C "$WORK_DIR/leptonica-${LEPTONICA_VERSION}" install

          cat > "$SYSROOT/lib/pkgconfig/lept.pc" <<EOF
          prefix=$SYSROOT
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include/leptonica

          Name: lept
          Description: Leptonica image processing library
          Version: $LEPTONICA_VERSION
          Libs: -L\${libdir} -llept
          Cflags: -I\${includedir}
          EOF

          cd "$WORK_DIR"

          # ------------------------------------------------------------------
          # Tesseract 5.5.3
          # ------------------------------------------------------------------
          download_file \
            "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/${TESSERACT_VERSION}.tar.gz" \
            "tesseract-${TESSERACT_VERSION}.tar.gz"

          tar -xzf "tesseract-${TESSERACT_VERSION}.tar.gz"
          cd "tesseract-${TESSERACT_VERSION}"

          sed -i \
            's/return TESSERACT_VERSION_STR;/return "5.5.3 - Compile ByArian";/g' \
            src/api/baseapi.cpp || true

          sed -i \
            's|"/usr/share/tessdata/"|"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/";|g' \
            src/ccutil/mainblk.cpp || true

          cat > "$WORK_DIR/tesseract-toolchain.cmake" <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR armv7l)

          set(CMAKE_C_COMPILER $CC)
          set(CMAKE_CXX_COMPILER $CXX)
          set(CMAKE_AR $AR)
          set(CMAKE_RANLIB $RANLIB)
          set(CMAKE_STRIP $STRIP)

          set(CMAKE_FIND_ROOT_PATH $SYSROOT)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)

          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)

          set(CMAKE_C_FLAGS_INIT "-fPIC -O2 -I$SYSROOT/include")
          set(CMAKE_CXX_FLAGS_INIT "-fPIC -O2 -I$SYSROOT/include -I$SYSROOT/include/leptonica")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib")
          set(CMAKE_SHARED_LINKER_FLAGS_INIT "-L$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/lib")
          EOF

          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$WORK_DIR/tesseract-toolchain.cmake" \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$SYSROOT" \
            -DCMAKE_INCLUDE_PATH="$SYSROOT/include;$SYSROOT/include/leptonica" \
            -DCMAKE_LIBRARY_PATH="$SYSROOT/lib" \
            -DLeptonica_DIR="$SYSROOT/lib" \
            -DLeptonica_INCLUDE_DIR="$SYSROOT/include/leptonica" \
            -DLeptonica_LIBRARY="$SYSROOT/lib/liblept.so" \
            -DOPENMP_BUILD=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_TRAINING_TOOLS=OFF \
            -DBUILD_TRAINING=OFF \
            -DOPENCL_ENABLED=OFF \
            -DGRAPHICS_DISABLED=ON \
            -DUSE_SYSTEM_ICU=OFF \
            -DDISABLE_CURL=ON \
            -DSW_BUILD=OFF

          if ! cmake --build build --parallel "$(nproc)" --verbose; then
            echo "Tesseract build failed."
            find "$WORK_DIR/tesseract-${TESSERACT_VERSION}/build" \
              -type f \
              \( -name '*.log' -o -name 'CMakeError.log' \) \
              -print \
              -exec tail -n 160 {} \; || true
            exit 1
          fi

          cmake --install build

          cd "$WORK_DIR"

          # ------------------------------------------------------------------
          # Validate the generated files
          # ------------------------------------------------------------------
          echo "Generated libraries:"
          find "$SYSROOT/lib" -maxdepth 1 \( -type f -o -type l \) -print | sort

          test -x "$SYSROOT/bin/tesseract"
          test -e "$SYSROOT/lib/libjpeg.so"
          test -e "$SYSROOT/lib/libpng16.so"
          test -e "$SYSROOT/lib/libtiff.so"
          test -e "$SYSROOT/lib/libz.so"
          test -e "$SYSROOT/lib/liblept.so"
          test -e "$SYSROOT/lib/libtesseract.so"

          file "$SYSROOT/bin/tesseract"
          file "$SYSROOT/lib/libtesseract.so"
          file "$SYSROOT/lib/liblept.so"

          if ! file "$SYSROOT/bin/tesseract" | grep -Eqi 'ARM'; then
            echo "The generated Tesseract binary is not an ARM binary."
            exit 1
          fi

          # ------------------------------------------------------------------
          # Create package
          # ------------------------------------------------------------------
          mkdir -p \
            "$PACKAGE_DIR/usr/bin" \
            "$PACKAGE_DIR/usr/lib" \
            "$PACKAGE_DIR/usr/share/tessdata"

          cp -a \
            "$SYSROOT/bin/tesseract" \
            "$PACKAGE_DIR/usr/bin/"

          for pattern in \
            "libz.so*" \
            "libjpeg.so*" \
            "libpng16.so*" \
            "libtiff.so*" \
            "liblept.so*" \
            "libtesseract.so*"; do

            for library in "$SYSROOT/lib"/$pattern; do
              if [ -e "$library" ] || [ -L "$library" ]; then
                cp -a "$library" "$PACKAGE_DIR/usr/lib/"
              fi
            done
          done

          "$STRIP" --strip-unneeded \
            "$PACKAGE_DIR/usr/bin/tesseract" || true

          find "$PACKAGE_DIR/usr/lib" \
            -type f \
            -name '*.so*' \
            -exec "$STRIP" --strip-unneeded {} \; || true

          chmod -R 755 "$PACKAGE_DIR"

          echo "Final package contents:"
          find "$PACKAGE_DIR" -maxdepth 5 -print | sort

      - name: Upload ARMv7l artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-enigma2-armv7l
          path: package/
