name: Build Tesseract OCR for Enigma2 (ARMv7l - OCR Only)

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build Tesseract with OCR-only features
      run: |
        docker run --rm --platform linux/arm/v7 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ubuntu:22.04 /bin/bash -c "
            set -e

            apt-get update && apt-get install -y \
              autoconf automake libtool pkg-config g++ make wget file cmake nasm

            export PREFIX=/usr
            export SYSROOT_DIR=/workspace/package\$PREFIX

            mkdir -p \$SYSROOT_DIR/bin
            mkdir -p \$SYSROOT_DIR/lib
            mkdir -p \$SYSROOT_DIR/share/tessdata

            export PKG_CONFIG_PATH=\$PREFIX/lib/pkgconfig
            export PKG_CONFIG_LIBDIR=\$PREFIX/lib/pkgconfig
            export CPPFLAGS=\"-I\$PREFIX/include -I\$PREFIX/include/leptonica\"
            export LDFLAGS=\"-L\$PREFIX/lib -Wl,-rpath,\$PREFIX/lib -Wl,--disable-new-dtags\"

            echo '=== 1. Building zlib (static) ==='
            wget --no-check-certificate https://zlib.net/fossils/zlib-1.3.1.tar.gz
            tar -xzf zlib-1.3.1.tar.gz
            cd zlib-1.3.1
            CFLAGS='-fPIC -Os' ./configure --prefix=\$PREFIX --static
            make -j\$(nproc)
            make install
            cd ..

            echo '=== 2. Building libpng (static) ==='
            wget --no-check-certificate https://download.sourceforge.net/libpng/libpng-1.6.40.tar.gz
            tar -xzf libpng-1.6.40.tar.gz
            cd libpng-1.6.40
            CFLAGS='-fPIC -Os' ./configure --prefix=\$PREFIX --disable-shared --enable-static
            make -j\$(nproc)
            make install
            cd ..

            echo '=== 3. Building libjpeg-turbo (static with 12-bit) ==='
            wget --no-check-certificate https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.1/libjpeg-turbo-3.1.1.tar.gz
            tar -xzf libjpeg-turbo-3.1.1.tar.gz
            cd libjpeg-turbo-3.1.1
            mkdir build && cd build
            cmake -DCMAKE_INSTALL_PREFIX=\$PREFIX -DCMAKE_BUILD_TYPE=Release \
                  -DENABLE_SHARED=OFF -DENABLE_STATIC=ON \
                  -DWITH_12BIT=ON \
                  -DCMAKE_POSITION_INDEPENDENT_CODE=ON ..
            make -j\$(nproc)
            make install
            cd ../..

            echo '=== 4. Building libtiff (static) ==='
            wget --no-check-certificate https://download.osgeo.org/libtiff/tiff-4.7.0.tar.gz
            tar -xzf tiff-4.7.0.tar.gz
            cd tiff-4.7.0
            CFLAGS='-fPIC -Os' ./configure --prefix=\$PREFIX --disable-shared --enable-static --disable-cxx
            make -j\$(nproc)
            make install
            cd ..

            echo '=== 5. Building Leptonica (shared) ==='
            wget --no-check-certificate https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
            tar -xzf leptonica-1.87.0.tar.gz
            cd leptonica-1.87.0
            ./configure --prefix=\$PREFIX --enable-shared --disable-static CFLAGS='-Os' CXXFLAGS='-Os'
            make -j\$(nproc)
            make install
            cd ..

            echo '=== 6. Building Tesseract (OCR only) ==='
            wget --no-check-certificate https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
            tar -xzf 5.5.3.tar.gz
            cd tesseract-5.5.3

            # Add ByArian to version output
            sed -i 's|tprintf(\"tesseract %s\\n\", TessBaseAPI::Version());|tprintf(\"tesseract %s\\nByArian\\n\", TessBaseAPI::Version());|' src/tesseract.cpp

            # Adjust tessdata paths for Enigma2
            sed -i 's|\"/usr/share/tessdata/\"|\"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/\"|g' src/ccutil/mainblk.cpp || true

            ./autogen.sh
            ./configure --prefix=\$PREFIX --disable-static --disable-debug \
                        --disable-icu --without-pango --without-cairo --without-libarchive \
                        --disable-training --disable-graphics --disable-opencl \
                        CFLAGS='-Os' CXXFLAGS='-Os' \
                        LEPTONICA_CFLAGS=\"-I\$PREFIX/include -I\$PREFIX/include/leptonica\" \
                        LEPTONICA_LIBS=\"-L\$PREFIX/lib -lleptonica\"
            make -j\$(nproc)
            make DESTDIR=/tmp/tesseract-build install
            cd ..

            echo '=== 7. Copying and renaming libraries ==='
            cp /tmp/tesseract-build/usr/bin/tesseract \$SYSROOT_DIR/bin/

            TESS_REAL=\$(find \$PREFIX/lib -maxdepth 1 -name 'libtesseract.so.*.*.*' -type f | head -n1)
            cp \"\$TESS_REAL\" \$SYSROOT_DIR/lib/libtesseract.so.5.5.3

            LEPT_REAL=\$(find \$PREFIX/lib -maxdepth 1 -name 'libleptonica.so.*.*.*' -type f | head -n1)
            cp \"\$LEPT_REAL\" \$SYSROOT_DIR/lib/libleptonica.so.6.0.0

            cd \$SYSROOT_DIR/lib
            ln -s libtesseract.so.5.5.3 libtesseract.so.5
            ln -s libtesseract.so.5.5.3 libtesseract.so
            ln -s libleptonica.so.6.0.0 libleptonica.so.6
            ln -s libleptonica.so.6.0.0 libleptonica.so

            echo '=== 8. Stripping ==='
            strip --strip-unneeded \$SYSROOT_DIR/bin/tesseract || true
            strip --strip-unneeded \$SYSROOT_DIR/lib/libtesseract.so.5.5.3 || true
            strip --strip-unneeded \$SYSROOT_DIR/lib/libleptonica.so.6.0.0 || true
            chmod -R 777 \$SYSROOT_DIR
          "

    - name: Upload Complete Package
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-armv7l-ocr-only
        path: package/
