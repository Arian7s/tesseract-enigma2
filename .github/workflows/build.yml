name: Build Tesseract OCR for Enigma2 (ARMv7l - Final Bundle)

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build Tesseract for ARMv7l
      run: |
        docker run --rm --platform linux/arm/v7 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ubuntu:22.04 /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            
            apt-get update && apt-get install -y \
              autoconf automake libtool pkg-config g++ make wget file git \
              libjpeg-dev libpng-dev libtiff-dev zlib1g-dev

            wget --no-check-certificate https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
            tar -xzf leptonica-1.87.0.tar.gz
            cd leptonica-1.87.0
            ./configure --prefix=/usr --enable-shared --disable-static
            make -j\$(nproc) && make install
            cd ..

            wget --no-check-certificate https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
            tar -xzf 5.5.3.tar.gz
            cd tesseract-5.5.3

            sed -i 's/return TESSERACT_VERSION_STR;/return \"5.5.3 - Compile ByArian\";/g' src/api/baseapi.cpp || true
            sed -i 's|\"/usr/share/tessdata/\"|\"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/\"|g' src/ccutil/mainblk.cpp || true

            ./autogen.sh
            ./configure --prefix=/usr --disable-static --disable-debug --disable-icu --without-pango --without-cairo --without-libarchive
            make -j\$(nproc) && make install
            cd ..

            mkdir -p package/usr/bin package/usr/lib package/usr/share/tessdata
            cp /usr/bin/tesseract package/usr/bin/

            LIB_TESS=\$(find /usr/lib /usr/local/lib -type f -name 'libtesseract.so.*' | head -n 1)
            cp \"\$LIB_TESS\" package/usr/lib/libtesseract.so.5.5.3

            LIB_LEPT=\$(find /usr/lib /usr/local/lib -type f -name 'libleptonica.so.*' | head -n 1)
            cp \"\$LIB_LEPT\" package/usr/lib/libleptonica.so.6.0.0

            cd package/usr/lib/
            ln -sf libtesseract.so.5.5.3 libtesseract.so.5
            ln -sf libtesseract.so.5.5.3 libtesseract.so
            ln -sf libleptonica.so.6.0.0 libleptonica.so.6
            ln -sf libleptonica.so.6.0.0 libleptonica.so
            cd /workspace

            ldd package/usr/bin/tesseract package/usr/lib/libleptonica.so.6.0.0 | awk 'NF == 4 {print \$3}; NF == 2 {print \$1}' | grep '^/' | sort -u | while read -r lib; do
              libname=\$(basename \"\$lib\")
              if [[ ! \"\$libname\" =~ ^(libc\.|libm\.|libstdc\+\+\.|libgcc_s\.|ld-linux|libpthread|librt|libdl|libz\.) ]]; then
                cp -L \"\$lib\" package/usr/lib/
              fi
            done

            strip --strip-all package/usr/bin/tesseract || true
            strip --strip-unneeded package/usr/lib/*.so* || true
            chmod -R 777 package
          "

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-armv7l-final-bundle
        path: package/
