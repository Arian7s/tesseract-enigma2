name: Build Tesseract OCR for Enigma2 (ARMv7l)

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build Tesseract and Leptonica inside ARMv7 Container
      run: |
        docker run --rm --platform linux/arm/v7 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ubuntu:22.04 /bin/bash -c "
            apt-get update && apt-get install -y \
              autoconf automake libtool pkg-config g++ make wget file \
              libpng-dev libjpeg-dev libtiff-dev zlib1g-dev libicu-dev \
              libpango1.0-dev libcairo2-dev libarchive-dev

            echo '--- Building Leptonica 1.87.0 ---'
            wget --no-check-certificate https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
            tar -xzf leptonica-1.87.0.tar.gz
            cd leptonica-1.87.0
            ./configure --prefix=/usr --enable-shared --enable-static
            make -j\$(nproc)
            make install
            cd ..

            echo '--- Building Tesseract 5.5.3 ---'
            wget --no-check-certificate https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
            tar -xzf 5.5.3.tar.gz
            cd tesseract-5.5.3
            
            # تعديل مسارات tessdata لتناسب Enigma2
            sed -i 's|\"/usr/share/tessdata/\"|\"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/\"|g' src/ccutil/mainblk.cpp || true
            
            ./autogen.sh
            ./configure --prefix=/usr
            make -j\$(nproc)
            make DESTDIR=/tmp/tesseract-build install
            cd ..

            echo '--- Structuring Enigma2 Package ---'
            mkdir -p package/usr/bin
            mkdir -p package/usr/lib
            mkdir -p package/usr/share/tessdata
            
            cp /tmp/tesseract-build/usr/bin/tesseract package/usr/bin/
            cp -P /tmp/tesseract-build/usr/lib/libtesseract.so* package/usr/lib/ || true
            cp -P /usr/lib/libleptonica.so* package/usr/lib/ || true
            
            # التأكد من صلاحيات الملفات
            chmod -R 777 package
            
            echo '--- Verify Binary ---'
            file package/usr/bin/tesseract
          "

    - name: Upload Complete Package
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-custom-build
        path: package/
