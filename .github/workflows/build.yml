name: Build Tesseract OCR for Enigma2 (ARMv7l - Dynamic Search)

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build Tesseract for ARMv7l
      run: |
        docker run --rm --platform linux/arm/v7 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ubuntu:22.04 /bin/bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive

            apt-get update && apt-get install -y \
              autoconf automake libtool pkg-config g++ make wget file git cmake yasm nasm

            export CFLAGS='-fPIC -Os'
            export CXXFLAGS='-fPIC -Os'
            export LDFLAGS='-L/usr/lib'
            export PKG_CONFIG_PATH='/usr/lib/pkgconfig:/usr/local/lib/pkgconfig:/usr/lib/arm-linux-gnueabihf/pkgconfig'

            wget https://www.zlib.net/zlib-1.3.2.tar.gz
            tar -xzf zlib-1.3.2.tar.gz
            cd zlib-1.3.2 && ./configure --prefix=/usr --static && make -j\$(nproc) && make install && cd ..

            wget https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0.tar.gz
            tar -xzf libjpeg-turbo-3.2.0.tar.gz
            cd libjpeg-turbo-3.2.0
            mkdir build-jpeg && cd build-jpeg
            cmake -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_BUILD_TYPE=Release ..
            make -j\$(nproc) && make install
            cd ../..

            wget https://download.sourceforge.net/libpng/libpng-1.6.43.tar.gz || wget https://sourceforge.net/projects/libpng/files/libpng16/1.6.43/libpng-1.6.43.tar.gz
            tar -xzf libpng-1.6.43.tar.gz
            cd libpng-1.6.43
            ./configure --prefix=/usr --disable-shared --enable-static --with-pic
            make -j\$(nproc) && make install && cd ..

            wget https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz
            tar -xzf tiff-4.7.2.tar.gz
            cd tiff-4.7.2
            ./configure --prefix=/usr --disable-shared --enable-static --with-pic
            make -j\$(nproc) && make install && cd ..

            wget --no-check-certificate https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
            tar -xzf leptonica-1.87.0.tar.gz
            cd leptonica-1.87.0
            ./configure --prefix=/usr --enable-shared --disable-static --with-libjpeg --with-libpng --with-libtiff --with-zlib
            make -j\$(nproc) && make install && cd ..

            mkdir -p /usr/lib/arm-linux-gnueabihf/pkgconfig
            cp /usr/lib/pkgconfig/lept.pc /usr/lib/arm-linux-gnueabihf/pkgconfig/ || true
            ldconfig

            wget --no-check-certificate https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
            tar -xzf 5.5.3.tar.gz
            cd tesseract-5.5.3

            sed -i 's/return TESSERACT_VERSION_STR;/return \"5.5.3 - Compile ByArian\";/g' src/api/baseapi.cpp || true
            sed -i 's|\"/usr/share/tessdata/\"|\"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/\"|g' src/ccutil/mainblk.cpp || true

            ./autogen.sh
            ./configure --prefix=/usr --disable-static --disable-debug --disable-icu --without-pango --without-cairo --without-libarchive lept_CFLAGS=\"-I/usr/include/leptonica\" lept_LIBS=\"-L/usr/lib -llept\"
            make -j\$(nproc) && make install && cd ..

            mkdir -p package/usr/bin package/usr/lib package/usr/share/tessdata

            cp /usr/bin/tesseract package/usr/bin/

            TESS_FILE=\$(find /usr -name 'libtesseract.so*' -type f ! -type l | head -n 1)
            LEPT_FILE=\$(find /usr -name 'libleptonica.so*' -type f ! -type l | head -n 1)

            if [ -z \"\$TESS_FILE\" ]; then
              echo "FATAL: libtesseract.so was not generated!"
              exit 1
            fi

            cp \"\$TESS_FILE\" package/usr/lib/libtesseract.so.5.5.3
            cp \"\$LEPT_FILE\" package/usr/lib/libleptonica.so.6.0.0

            strip --strip-all package/usr/bin/tesseract || true
            strip --strip-unneeded package/usr/lib/*.so* || true
            chmod -R 777 package
          "

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-armv7l-dynamic
        path: package/
