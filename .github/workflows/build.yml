name: Build Tesseract OCR for Enigma2 (ARMv7l - Standalone)

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build Standalone Tesseract for ARMv7l
      run: |
        docker run --rm --platform linux/arm/v7 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ubuntu:22.04 /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y \
              autoconf automake libtool pkg-config g++ make wget file \
              git build-essential cmake yasm nasm

            echo '--- Building Zlib ---'
            wget https://www.zlib.net/zlib-1.3.2.tar.gz || wget https://zlib.net/zlib-1.3.2.tar.gz
            tar -xzf zlib-1.3.2.tar.gz
            cd zlib-1.3.2 && ./configure --prefix=/usr && make -j$(nproc) && make install && cd ..

            echo '--- Building LibPNG ---'
            wget https://sourceforge.net/projects/libpng/files/libpng16/1.6.43/libpng-1.6.43.tar.gz
            tar -xzf libpng-1.6.43.tar.gz
            cd libpng-1.6.43 && ./configure --prefix=/usr && make -j$(nproc) && make install && cd ..

            echo '--- Building Leptonica (1.87.0) ---'
            wget --no-check-certificate https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
            tar -xzf leptonica-1.87.0.tar.gz
            cd leptonica-1.87.0
            ./configure --prefix=/usr --enable-shared --disable-static CFLAGS='-Os' CXXFLAGS='-Os'
            make -j$(nproc)
            make DESTDIR=/tmp/leptonica-build install
            make install
            cd ..

            echo '--- Building Tesseract (5.5.3) ---'
            wget --no-check-certificate https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
            tar -xzf 5.5.3.tar.gz
            cd tesseract-5.5.3

            sed -i 's|\"/usr/share/tessdata/\"|\"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/\"|g' src/ccutil/mainblk.cpp || true

            ./autogen.sh
            ./configure --prefix=/usr --disable-static --disable-debug \
                        --disable-icu --without-pango --without-cairo --without-libarchive \
                        CFLAGS='-Os' CXXFLAGS='-Os'
            
            make -j$(nproc)
            make DESTDIR=/tmp/tesseract-build install
            cd ..

            echo '--- Structuring Package ---'
            mkdir -p package/usr/bin
            mkdir -p package/usr/lib
            mkdir -p package/usr/share/tessdata

            # نسخ الملف التنفيذي
            cp /tmp/tesseract-build/usr/bin/tesseract package/usr/bin/

            # البحث عن مكتبة tesseract أينما وجدت في مجلد البناء ونسخها بالاسم المطلوب
            find /tmp/tesseract-build -name 'libtesseract.so*' -exec cp -P {} package/usr/lib/ \;
            
            # التأكد من وجود ملف بالاسم المطلوب بالذات
            if [ -f package/usr/lib/libtesseract.so.5.5.3 ]; then
              echo 'Tesseract library found successfully.'
            else
              # إذا كانت باسم آخر، إعادة تسميتها أو عمل الروابط المطلوبة
              LATEST_TESS=$(ls package/usr/lib/libtesseract.so.*.*.* | head -n 1)
              if [ ! -z \"\$LATEST_TESS\" ]; then
                cp \"\$LATEST_TESS\" package/usr/lib/libtesseract.so.5.5.3
              fi
            fi

            # نسخ مكتبات Leptonica والتأكد من وجود libleptonica.so.6.0.0
            find /tmp/leptonica-build -name 'libleptonica.so*' -exec cp -P {} package/usr/lib/ \; || true
            if [ ! -f package/usr/lib/libleptonica.so.6.0.0 ]; then
              cp /usr/lib/arm-linux-gnueabihf/libleptonica.so* package/usr/lib/ || true
            fi

            # ضبط الروابط الرمزية (Symlinks) للتأكد من استقرار عمل المكتبات
            cd package/usr/lib/
            [ -f libtesseract.so.5.5.3 ] && ln -sf libtesseract.so.5.5.3 libtesseract.so.5 && ln -sf libtesseract.so.5.5.3 libtesseract.so
            [ -f libleptonica.so.6.0.0 ] && ln -sf libleptonica.so.6.0.0 libleptonica.so.6 && ln -sf libleptonica.so.6.0.0 libleptonica.so
            cd /workspace

            echo '--- Stripping Binaries ---'
            strip --strip-unneeded package/usr/bin/tesseract || true
            strip --strip-unneeded package/usr/lib/*.so* || true

            chmod -R 777 package

            echo '--- Final Verification ---'
            ls -la package/usr/bin/
            ls -la package/usr/lib/
          "

    - name: Upload Complete Package
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-armv7l-standalone-arian
        path: package/
