name: Build Tesseract OCR for Enigma2 (ARMv7l - Direct Copy)

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build Direct Copy Tesseract for ARMv7l
      run: |
        docker run --rm --platform linux/arm/v7 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ubuntu:22.04 /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y \
              autoconf automake libtool pkg-config g++ make wget file \
              git build-essential cmake yasm nasm

            echo '--- Building Zlib 1.3.2 ---'
            wget https://www.zlib.net/zlib-1.3.2.tar.gz
            tar -xzf zlib-1.3.2.tar.gz
            cd zlib-1.3.2 && ./configure --prefix=/usr && make -j$(nproc) && make install && cd ..

            echo '--- Building Libjpeg-turbo 3.1.1 ---'
            wget https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.1/libjpeg-turbo-3.1.1.tar.gz
            tar -xzf libjpeg-turbo-3.1.1.tar.gz
            mkdir build-jpeg && cd build-jpeg
            cmake -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release ..
            make -j$(nproc) && make install
            cd ..

            echo '--- Building LibPNG 1.6.58 ---'
            wget https://sourceforge.net/projects/libpng/files/libpng16/1.6.58/libpng-1.6.58.tar.gz || wget https://sourceforge.net/projects/libpng/files/libpng16/1.6.43/libpng-1.6.43.tar.gz
            if [ -f libpng-1.6.58.tar.gz ]; then tar -xzf libpng-1.6.58.tar.gz && cd libpng-1.6.58; else tar -xzf libpng-1.6.43.tar.gz && cd libpng-1.6.43; fi
            ./configure --prefix=/usr && make -j$(nproc) && make install && cd ..

            echo '--- Building LibTIFF 4.7.2 ---'
            wget https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz
            tar -xzf tiff-4.7.2.tar.gz
            cd tiff-4.7.2 && ./configure --prefix=/usr && make -j$(nproc) && make install && cd ..

            echo '--- Building Leptonica 1.87.0 ---'
            wget --no-check-certificate https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
            tar -xzf leptonica-1.87.0.tar.gz
            cd leptonica-1.87.0
            ./configure --prefix=/usr --enable-shared --disable-static CFLAGS='-Os' CXXFLAGS='-Os'
            make -j$(nproc)
            make install
            cd ..

            echo '--- Building Tesseract 5.5.3 ---'
            wget --no-check-certificate https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
            tar -xzf 5.5.3.tar.gz
            cd tesseract-5.5.3

            # حقن التوقيع Compile ByArian مباشرة في الكود لضمان ظهوره في الإصدار
            sed -i 's/m4_define(\[tesseract_version\], \[5.5.3\])/m4_define(\[tesseract_version\], \[5.5.3 (Compile ByArian)\])/g' configure.ac || true
            sed -i 's|\"/usr/share/tessdata/\"|\"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/\"|g' src/ccutil/mainblk.cpp || true

            ./autogen.sh
            ./configure --prefix=/usr --disable-static --disable-debug \
                        --disable-icu --without-pango --without-cairo --without-libarchive \
                        CFLAGS='-Os' CXXFLAGS='-Os'
            
            make -j$(nproc)
            make install
            cd ..

            echo '--- Structuring Package Directly ---'
            mkdir -p package/usr/bin
            mkdir -p package/usr/lib
            mkdir -p package/usr/share/tessdata

            # النسخ المباشر من المسارات الفعلية بعد التثبيت داخل النظام الوهمي
            cp /usr/bin/tesseract package/usr/bin/
            cp /usr/lib/libtesseract.so.5.5.3 package/usr/lib/ || cp /usr/lib/libtesseract.so.5.* package/usr/lib/libtesseract.so.5.5.3 || true
            cp /usr/lib/libleptonica.so.6.0.0 package/usr/lib/ || cp /usr/lib/libleptonica.so.6.* package/usr/lib/libleptonica.so.6.0.0 || true

            # التأكد من وجود الملفات وعمل الروابط الرمزية اللازمة
            cd package/usr/lib/
            if [ -f libtesseract.so.5.* ] && [ ! -f libtesseract.so.5.5.3 ]; then
              mv libtesseract.so.5.* libtesseract.so.5.5.3
            fi
            if [ -f libleptonica.so.6.* ] && [ ! -f libleptonica.so.6.0.0 ]; then
              mv libleptonica.so.6.* libleptonica.so.6.0.0
            fi

            ln -sf libtesseract.so.5.5.3 libtesseract.so.5
            ln -sf libtesseract.so.5.5.3 libtesseract.so
            ln -sf libleptonica.so.6.0.0 libleptonica.so.6
            ln -sf libleptonica.so.6.0.0 libleptonica.so
            cd /workspace

            echo '--- Stripping Binaries ---'
            strip --strip-unneeded package/usr/bin/tesseract || true
            strip --strip-unneeded package/usr/lib/*.so* || true

            chmod -R 777 package

            echo '--- Final Verification ---'
            ls -la package/usr/bin/
            ls -la package/usr/lib/
          "

    - name: Upload Complete Package
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-armv7l-direct-arian
        path: package/
