name: Build Tesseract OCR for Enigma2 (ARMv7l - Static Deps)

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build Tesseract with embedded dependencies
      run: |
        docker run --rm --platform linux/arm/v7 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ubuntu:22.04 /bin/bash -c "
            set -e

            apt-get update && apt-get install -y --no-install-recommends \
              autoconf automake libtool pkg-config g++ make wget file cmake nasm \
              binutils ca-certificates

            STATIC_PREFIX=/opt/static-deps
            INSTALL_PREFIX=/opt/tesseract-install
            mkdir -p \$STATIC_PREFIX \$INSTALL_PREFIX

            # ─── zlib (من GitHub بدل zlib.net) ──────────────────────
            echo '--- Building zlib ---'
            wget --no-check-certificate \
              https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
            tar -xzf zlib-1.3.1.tar.gz && cd zlib-1.3.1
            CFLAGS='-Os -fPIC' ./configure --prefix=\$STATIC_PREFIX --static
            make -j\$(nproc) && make install
            cd ..

            # ─── libjpeg-turbo ──────────────────────────────────────
            echo '--- Building libjpeg-turbo ---'
            wget --no-check-certificate \
              https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.1/libjpeg-turbo-3.1.1.tar.gz
            tar -xzf libjpeg-turbo-3.1.1.tar.gz && cd libjpeg-turbo-3.1.1
            cmake -DCMAKE_INSTALL_PREFIX=\$STATIC_PREFIX \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_C_FLAGS='-Os -fPIC' \
                  -DENABLE_SHARED=OFF \
                  -DENABLE_STATIC=ON \
                  -B build .
            cmake --build build -j\$(nproc)
            cmake --install build
            cd ..

            # ─── libpng ─────────────────────────────────────────────
            echo '--- Building libpng ---'
            wget --no-check-certificate \
              https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.47.tar.gz \
              -O libpng-1.6.47.tar.gz
            tar -xzf libpng-1.6.47.tar.gz && cd libpng-1.6.47
            cmake -DCMAKE_INSTALL_PREFIX=\$STATIC_PREFIX \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_C_FLAGS='-Os -fPIC' \
                  -DPNG_SHARED=OFF \
                  -DPNG_STATIC=ON \
                  -DPNG_TESTS=OFF \
                  -DZLIB_ROOT=\$STATIC_PREFIX \
                  -B build .
            cmake --build build -j\$(nproc)
            cmake --install build
            cd ..

            # ─── libtiff ────────────────────────────────────────────
            echo '--- Building libtiff ---'
            wget --no-check-certificate \
              https://github.com/libsdl-org/libtiff/archive/refs/tags/v4.7.0.tar.gz \
              -O tiff-4.7.0.tar.gz
            tar -xzf tiff-4.7.0.tar.gz && cd libtiff-4.7.0
            cmake -DCMAKE_INSTALL_PREFIX=\$STATIC_PREFIX \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_C_FLAGS='-Os -fPIC' \
                  -DBUILD_SHARED_LIBS=OFF \
                  -Dtiff-tests=OFF \
                  -Dtiff-tools=OFF \
                  -Dtiff-docs=OFF \
                  -DZLIB_ROOT=\$STATIC_PREFIX \
                  -DJPEG_ROOT=\$STATIC_PREFIX \
                  -B build .
            cmake --build build -j\$(nproc)
            cmake --install build
            cd ..

            # ─── Leptonica ──────────────────────────────────────────
            echo '--- Building Leptonica ---'
            wget --no-check-certificate \
              https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
            tar -xzf leptonica-1.87.0.tar.gz && cd leptonica-1.87.0

            PKG_CONFIG_PATH=\"\$STATIC_PREFIX/lib/pkgconfig\" \
            ./configure --prefix=\$INSTALL_PREFIX \
                        --enable-shared --disable-static \
                        CFLAGS='-Os -fPIC' \
                        CXXFLAGS='-Os -fPIC' \
                        LDFLAGS=\"-L\$STATIC_PREFIX/lib\" \
                        CPPFLAGS=\"-I\$STATIC_PREFIX/include\"
            make -j\$(nproc) && make install
            cd ..

            # ─── دمج static libs داخل libleptonica.so ───────────────
            echo '--- Embedding static deps into libleptonica ---'
            cd \$INSTALL_PREFIX/lib

            LEPSO_FULL=\$(ls libleptonica.so.*.*.* 2>/dev/null | head -1)
            echo \"Found libleptonica: \$LEPSO_FULL\"
            SONAME_LEP=\$(objdump -p \$LEPSO_FULL | grep SONAME | awk '{print \$2}')
            echo \"SONAME: \$SONAME_LEP\"

            g++ -Os -shared -fPIC \
              -Wl,-soname,\$SONAME_LEP \
              -Wl,--whole-archive \
              \$INSTALL_PREFIX/lib/\$LEPSO_FULL \
              \$STATIC_PREFIX/lib/libjpeg.a \
              \$STATIC_PREFIX/lib/libpng.a \
              \$STATIC_PREFIX/lib/libtiff.a \
              \$STATIC_PREFIX/lib/libz.a \
              -Wl,--no-whole-archive \
              -lm -lstdc++ \
              -o /tmp/\$LEPSO_FULL

            cp /tmp/\$LEPSO_FULL \$INSTALL_PREFIX/lib/\$LEPSO_FULL
            ldconfig -n \$INSTALL_PREFIX/lib
            cd /workspace

            # ─── Tesseract ──────────────────────────────────────────
            echo '--- Building Tesseract ---'
            wget --no-check-certificate \
              https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
            tar -xzf 5.5.3.tar.gz && cd tesseract-5.5.3

            sed -i 's|\"/usr/share/tessdata/\"|\"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/\"|g' \
              src/ccutil/mainblk.cpp || true

            ./autogen.sh

            PKG_CONFIG_PATH=\"\$INSTALL_PREFIX/lib/pkgconfig:\$STATIC_PREFIX/lib/pkgconfig\" \
            ./configure --prefix=\$INSTALL_PREFIX \
                        --disable-static --disable-debug \
                        --disable-icu --without-pango --without-cairo --without-libarchive \
                        CFLAGS='-Os -fPIC' \
                        CXXFLAGS='-Os -fPIC' \
                        LDFLAGS=\"-L\$INSTALL_PREFIX/lib -L\$STATIC_PREFIX/lib\" \
                        CPPFLAGS=\"-I\$INSTALL_PREFIX/include -I\$STATIC_PREFIX/include\"
            make -j\$(nproc) && make install
            cd ..

            # ─── دمج static libs داخل libtesseract.so ───────────────
            echo '--- Embedding static deps into libtesseract ---'
            cd \$INSTALL_PREFIX/lib

            TESSSO_FULL=\$(ls libtesseract.so.*.*.* 2>/dev/null | head -1)
            echo \"Found libtesseract: \$TESSSO_FULL\"
            SONAME_TESS=\$(objdump -p \$TESSSO_FULL | grep SONAME | awk '{print \$2}')
            echo \"SONAME: \$SONAME_TESS\"

            g++ -Os -shared -fPIC \
              -Wl,-soname,\$SONAME_TESS \
              -Wl,--whole-archive \
              \$INSTALL_PREFIX/lib/\$TESSSO_FULL \
              \$STATIC_PREFIX/lib/libjpeg.a \
              \$STATIC_PREFIX/lib/libpng.a \
              \$STATIC_PREFIX/lib/libtiff.a \
              \$STATIC_PREFIX/lib/libz.a \
              -Wl,--no-whole-archive \
              -L\$INSTALL_PREFIX/lib -lleptonica \
              -lm -lstdc++ \
              -o /tmp/\$TESSSO_FULL

            cp /tmp/\$TESSSO_FULL \$INSTALL_PREFIX/lib/\$TESSSO_FULL
            ldconfig -n \$INSTALL_PREFIX/lib
            cd /workspace

            # ─── التحقق ─────────────────────────────────────────────
            echo '--- Check dependencies (no jpeg/png/tiff/z expected) ---'
            LD_LIBRARY_PATH=\$INSTALL_PREFIX/lib ldd \$INSTALL_PREFIX/lib/\$LEPSO_FULL | \
              grep -E 'jpeg|png|tiff|z\b' || echo 'OK: No external image libs in libleptonica'
            LD_LIBRARY_PATH=\$INSTALL_PREFIX/lib ldd \$INSTALL_PREFIX/lib/\$TESSSO_FULL | \
              grep -E 'jpeg|png|tiff|z\b' || echo 'OK: No external image libs in libtesseract'

            echo '--- Tesseract version ---'
            LD_LIBRARY_PATH=\$INSTALL_PREFIX/lib \$INSTALL_PREFIX/bin/tesseract --version

            # ─── الحزمة النهائية 3 ملفات فقط ────────────────────────
            echo '--- Building Final Package (3 files only) ---'
            mkdir -p package/usr/bin package/usr/lib

            cp \$INSTALL_PREFIX/bin/tesseract package/usr/bin/
            cp \$INSTALL_PREFIX/lib/libtesseract.so.5.5.3 package/usr/lib/
            cp \$INSTALL_PREFIX/lib/\$LEPSO_FULL package/usr/lib/

            strip --strip-unneeded package/usr/bin/tesseract || true
            strip --strip-unneeded package/usr/lib/*.so* || true
            chmod -R 777 package

            echo '=== FINAL FILES ==='
            find package -type f | sort
            du -sh package/usr/lib/*
            du -sh package/usr/bin/*
          "

    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-armv7l-minimal
        path: package/
