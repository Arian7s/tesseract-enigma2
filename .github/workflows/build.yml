name: Build Tesseract OCR for Enigma2 (ARMv7l - OCR Only)

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build Tesseract OCR
      run: |
        docker run --rm --platform linux/arm/v7 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ubuntu:22.04 /bin/bash -c "
            set -e

            apt-get update && apt-get install -y \
              autoconf automake libtool pkg-config \
              g++ make wget cmake nasm patchelf

            export PREFIX=/usr
            export OUT=/workspace/package\$PREFIX
            mkdir -p \$OUT/bin \$OUT/lib

            export PKG_CONFIG_PATH=\$PREFIX/lib/pkgconfig
            export CFLAGS='-Os -fPIC'
            export CXXFLAGS='-Os -fPIC'

            # ===== 1. zlib =====
            wget -q --no-check-certificate https://zlib.net/fossils/zlib-1.3.1.tar.gz
            tar -xzf zlib-1.3.1.tar.gz && cd zlib-1.3.1
            ./configure --prefix=\$PREFIX --static
            make -j\$(nproc) && make install
            cd ..

            # ===== 2. libpng =====
            wget -q --no-check-certificate https://download.sourceforge.net/libpng/libpng-1.6.40.tar.gz
            tar -xzf libpng-1.6.40.tar.gz && cd libpng-1.6.40
            ./configure --prefix=\$PREFIX --disable-shared --enable-static
            make -j\$(nproc) && make install
            cd ..

            # ===== 3. libjpeg-turbo (8-bit فقط) =====
            wget -q --no-check-certificate https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.1/libjpeg-turbo-3.1.1.tar.gz
            tar -xzf libjpeg-turbo-3.1.1.tar.gz && cd libjpeg-turbo-3.1.1
            mkdir build && cd build
            cmake .. \
              -DCMAKE_INSTALL_PREFIX=\$PREFIX \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_INSTALL_INCLUDEDIR=include \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DENABLE_SHARED=OFF \
              -DENABLE_STATIC=ON \
              -DWITH_12BIT=OFF \
              -DWITH_TURBOJPEG=OFF
            make -j\$(nproc) && make install
            cd ../..

            # ===== 4. libtiff =====
            wget -q --no-check-certificate https://download.osgeo.org/libtiff/tiff-4.7.0.tar.gz
            tar -xzf tiff-4.7.0.tar.gz && cd tiff-4.7.0
            ./configure --prefix=\$PREFIX \
              --disable-shared --enable-static \
              --disable-cxx \
              --disable-jpeg12 \
              --without-x \
              --without-zstd \
              --without-lzma \
              --without-libdeflate \
              --without-webp
            make -j\$(nproc) && make install
            cd ..

            # ===== 5. Leptonica =====
            wget -q --no-check-certificate https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
            tar -xzf leptonica-1.87.0.tar.gz && cd leptonica-1.87.0
            ./configure --prefix=\$PREFIX \
              --enable-shared \
              --disable-static \
              --without-giflib \
              --without-libwebp \
              --without-libopenjpeg \
              --without-libwebpmux
            make -j\$(nproc) && make install
            cd ..

            # ===== 6. Tesseract =====
            wget -q --no-check-certificate https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
            tar -xzf 5.5.3.tar.gz && cd tesseract-5.5.3

            sed -i 's|tprintf(\"tesseract %s\\n\", TessBaseAPI::Version());|tprintf(\"tesseract %s\\nCompile ByArian\\n\", TessBaseAPI::Version());|' src/tesseract.cpp
            sed -i 's|\"/usr/share/tessdata/\"|\"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/\"|g' src/ccutil/mainblk.cpp || true

            ./autogen.sh
            ./configure --prefix=\$PREFIX \
              --enable-shared \
              --disable-static \
              --disable-debug \
              --disable-icu \
              --without-pango \
              --without-cairo \
              --without-libarchive \
              --disable-training \
              --disable-graphics \
              --disable-opencl \
              LEPTONICA_CFLAGS=\"-I\$PREFIX/include -I\$PREFIX/include/leptonica\" \
              LEPTONICA_LIBS=\"-L\$PREFIX/lib -lleptonica\"
            make -j\$(nproc)
            make DESTDIR=/tmp/tess-install install
            cd ..

            # ===== 7. نسخ الملفات النهائية =====
            cp /tmp/tess-install\$PREFIX/bin/tesseract \$OUT/bin/

            TESS_SO=\$(find /tmp/tess-install\$PREFIX/lib -maxdepth 1 -name 'libtesseract.so.*.*.*' | head -n1)
            cp \"\$TESS_SO\" \$OUT/lib/libtesseract.so.5.5.3

            LEPT_SO=\$(find \$PREFIX/lib -maxdepth 1 -name 'libleptonica.so.*.*.*' | head -n1)
            cp \"\$LEPT_SO\" \$OUT/lib/libleptonica.so.6.0.0

            # ===== 8. patchelf =====
            patchelf --replace-needed libtesseract.so.5 libtesseract.so.5.5.3 \$OUT/bin/tesseract || true
            patchelf --replace-needed libleptonica.so.6 libleptonica.so.6.0.0 \$OUT/bin/tesseract || true
            patchelf --replace-needed libleptonica.so.6 libleptonica.so.6.0.0 \$OUT/lib/libtesseract.so.5.5.3 || true

            # ===== 9. strip =====
            strip --strip-unneeded \$OUT/bin/tesseract || true
            strip --strip-unneeded \$OUT/lib/libtesseract.so.5.5.3 || true
            strip --strip-unneeded \$OUT/lib/libleptonica.so.6.0.0 || true

            chmod -R 777 \$OUT

            echo '========================================='
            echo 'FINAL FILES:'
            find /workspace/package -type f | sort
            echo '-----------------------------------------'
            echo 'DEPS CHECK:'
            echo '--- tesseract ---'
            readelf -d \$OUT/bin/tesseract | grep NEEDED
            echo '--- libtesseract ---'
            readelf -d \$OUT/lib/libtesseract.so.5.5.3 | grep NEEDED
            echo '--- libleptonica ---'
            readelf -d \$OUT/lib/libleptonica.so.6.0.0 | grep NEEDED
            echo '========================================='
          "

    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-armv7l-ocr-only
        path: package/
