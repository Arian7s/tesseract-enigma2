name: Build Tesseract OCR for Enigma2 (ARMv7l - OCR Only)

on:
  workflow_dispatch:

jobs:
  build-armv7l:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build Tesseract with OCR-only features
      run: |
        docker run --rm --platform linux/arm/v7 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ubuntu:22.04 /bin/bash -c "
            set -e

            apt-get update && apt-get install -y \
              autoconf automake libtool pkg-config g++ make wget file cmake nasm patchelf

            export PREFIX=/usr
            export SYSROOT_DIR=/workspace/package\$PREFIX

            mkdir -p \$SYSROOT_DIR/bin
            mkdir -p \$SYSROOT_DIR/lib
            mkdir -p \$SYSROOT_DIR/share/tessdata

            export PKG_CONFIG_PATH=\$PREFIX/lib/pkgconfig
            export PKG_CONFIG_LIBDIR=\$PREFIX/lib/pkgconfig
            export CPPFLAGS=\"-I\$PREFIX/include -I\$PREFIX/include/leptonica\"
            export LDFLAGS=\"-L\$PREFIX/lib -Wl,-rpath,\$PREFIX/lib -Wl,--disable-new-dtags\"

            echo '=== 1. Building zlib (static) ==='
            wget --no-check-certificate https://zlib.net/fossils/zlib-1.3.1.tar.gz
            tar -xzf zlib-1.3.1.tar.gz
            cd zlib-1.3.1
            CFLAGS='-fPIC -Os' ./configure --prefix=\$PREFIX --static
            make -j\$(nproc)
            make install
            cd ..

            echo '=== 2. Building libpng (static) ==='
            wget --no-check-certificate https://download.sourceforge.net/libpng/libpng-1.6.40.tar.gz
            tar -xzf libpng-1.6.40.tar.gz
            cd libpng-1.6.40
            CFLAGS='-fPIC -Os' ./configure --prefix=\$PREFIX --disable-shared --enable-static
            make -j\$(nproc)
            make install
            cd ..

            echo '=== 3. Building libjpeg-turbo (static with 12-bit) ==='
            wget --no-check-certificate https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.1/libjpeg-turbo-3.1.1.tar.gz
            tar -xzf libjpeg-turbo-3.1.1.tar.gz
            cd libjpeg-turbo-3.1.1
            mkdir build && cd build
            cmake -DCMAKE_INSTALL_PREFIX=\$PREFIX \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_INSTALL_LIBDIR=lib \
                  -DCMAKE_INSTALL_INCLUDEDIR=include \
                  -DENABLE_SHARED=OFF \
                  -DENABLE_STATIC=ON \
                  -DWITH_12BIT=ON \
                  -DCMAKE_POSITION_INDEPENDENT_CODE=ON ..
            make -j\$(nproc)
            make install
            cp \$PREFIX/lib/libjpeg.a \$PREFIX/lib/libjpeg12.a
            cd ../..

            echo '=== 4. Building libtiff (static) ==='
            wget --no-check-certificate https://download.osgeo.org/libtiff/tiff-4.7.0.tar.gz
            tar -xzf tiff-4.7.0.tar.gz
            cd tiff-4.7.0
            CFLAGS='-fPIC -Os' ./configure --prefix=\$PREFIX --disable-shared --enable-static --disable-cxx
            make -j\$(nproc)
            make install
            cd ..

            echo '=== 5. Building Leptonica (shared + static) ==='
            wget --no-check-certificate https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
            tar -xzf leptonica-1.87.0.tar.gz
            cd leptonica-1.87.0
            ./configure --prefix=\$PREFIX \
                        --enable-shared \
                        --enable-static \
                        CFLAGS='-Os -fPIC' \
                        CXXFLAGS='-Os -fPIC'
            make -j\$(nproc)
            make install

            echo '--- Merging static deps into libleptonica.so ---'
            LEPT_SO=\$(find \$PREFIX/lib -maxdepth 1 -name 'libleptonica.so.*.*.*' -type f | head -n1)
            echo \"Rebuilding: \$LEPT_SO\"
            g++ -shared -fPIC \
                -Wl,--whole-archive \
                  \$PREFIX/lib/libleptonica.a \
                  \$PREFIX/lib/libz.a \
                  \$PREFIX/lib/libpng.a \
                  \$PREFIX/lib/libjpeg.a \
                  \$PREFIX/lib/libtiff.a \
                -Wl,--no-whole-archive \
                -o \"\$LEPT_SO\" \
                -lm
            echo 'libleptonica.so rebuilt with all static deps merged'
            cd ..

            echo '=== 6. Building Tesseract (OCR only) ==='
            wget --no-check-certificate https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
            tar -xzf 5.5.3.tar.gz
            cd tesseract-5.5.3

            sed -i 's|tprintf(\"tesseract %s\\n\", TessBaseAPI::Version());|tprintf(\"tesseract %s\\nByArian\\n\", TessBaseAPI::Version());|' src/tesseract.cpp
            sed -i 's|\"/usr/share/tessdata/\"|\"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/\"|g' src/ccutil/mainblk.cpp || true

            ./autogen.sh
            ./configure --prefix=\$PREFIX \
                        --disable-static \
                        --enable-shared \
                        --disable-debug \
                        --disable-icu \
                        --without-pango \
                        --without-cairo \
                        --without-libarchive \
                        --disable-training \
                        --disable-graphics \
                        --disable-opencl \
                        CFLAGS='-Os' \
                        CXXFLAGS='-Os' \
                        LEPTONICA_CFLAGS=\"-I\$PREFIX/include -I\$PREFIX/include/leptonica\" \
                        LEPTONICA_LIBS=\"-L\$PREFIX/lib -lleptonica\"
            make -j\$(nproc)
            make DESTDIR=/tmp/tesseract-build install

            echo '--- Merging libleptonica.a into libtesseract.so ---'
            TESS_SO=\$(find /tmp/tesseract-build\$PREFIX/lib -maxdepth 1 -name 'libtesseract.so.*.*.*' -type f | head -n1)
            TESS_A=\$(find \$PREFIX/lib -maxdepth 1 -name 'libtesseract.a' -type f | head -n1)
            echo \"Rebuilding: \$TESS_SO\"

            if [ -n \"\$TESS_A\" ]; then
              g++ -shared -fPIC \
                  -Wl,--whole-archive \
                    \"\$TESS_A\" \
                  -Wl,--no-whole-archive \
                  -L\$PREFIX/lib -lleptonica \
                  -o \"\$TESS_SO\" \
                  -lm -lstdc++
              echo 'libtesseract.so rebuilt with libleptonica merged'
            else
              echo 'WARNING: libtesseract.a not found, skipping merge step'
            fi
            cd ..

            echo '=== 7. Copying final binaries ==='
            cp /tmp/tesseract-build\$PREFIX/bin/tesseract \$SYSROOT_DIR/bin/

            TESS_REAL=\$(find /tmp/tesseract-build\$PREFIX/lib -maxdepth 1 -name 'libtesseract.so.*.*.*' -type f | head -n1)
            cp \"\$TESS_REAL\" \$SYSROOT_DIR/lib/libtesseract.so.5.5.3

            LEPT_REAL=\$(find \$PREFIX/lib -maxdepth 1 -name 'libleptonica.so.*.*.*' -type f | head -n1)
            cp \"\$LEPT_REAL\" \$SYSROOT_DIR/lib/libleptonica.so.6.0.0

            echo '=== 8. Patching RPATH to use full library names ==='
            patchelf --replace-needed libtesseract.so.5 libtesseract.so.5.5.3 \$SYSROOT_DIR/bin/tesseract || true
            patchelf --replace-needed libleptonica.so.6 libleptonica.so.6.0.0 \$SYSROOT_DIR/bin/tesseract || true
            patchelf --replace-needed libleptonica.so.6 libleptonica.so.6.0.0 \$SYSROOT_DIR/lib/libtesseract.so.5.5.3 || true

            echo '=== 9. Verifying no unwanted deps remain ==='
            echo '--- tesseract binary deps ---'
            readelf -d \$SYSROOT_DIR/bin/tesseract | grep NEEDED || true
            echo '--- libtesseract.so deps ---'
            readelf -d \$SYSROOT_DIR/lib/libtesseract.so.5.5.3 | grep NEEDED || true
            echo '--- libleptonica.so deps ---'
            readelf -d \$SYSROOT_DIR/lib/libleptonica.so.6.0.0 | grep NEEDED || true

            echo '=== 10. Stripping ==='
            strip --strip-unneeded \$SYSROOT_DIR/bin/tesseract || true
            strip --strip-unneeded \$SYSROOT_DIR/lib/libtesseract.so.5.5.3 || true
            strip --strip-unneeded \$SYSROOT_DIR/lib/libleptonica.so.6.0.0 || true
            chmod -R 777 \$SYSROOT_DIR

            echo '=== Final Contents ==='
            find /workspace/package -type f -o -type l | sort
            echo '=== File sizes ==='
            ls -lh \$SYSROOT_DIR/bin/ \$SYSROOT_DIR/lib/
          "

    - name: Upload Complete Package
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-armv7l-ocr-only
        path: package/
