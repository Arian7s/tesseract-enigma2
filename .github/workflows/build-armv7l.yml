name: Build subtitle_pes_tap ARMv7l

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ARMv7 hard-float compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            binutils-arm-linux-gnueabihf

      - name: Check compiler
        run: |
          arm-linux-gnueabihf-gcc --version
          arm-linux-gnueabihf-gcc -dumpmachine

      - name: Build subtitle_pes_tap.so
        run: |
          arm-linux-gnueabihf-gcc \
            -shared \
            -fPIC \
            -O2 \
            -march=armv7-a \
            -mfpu=vfpv3-d16 \
            -mfloat-abi=hard \
            -pthread \
            -ldl \
            -o subtitle_pes_tap.so \
            subtitle_pes_tap.c

      - name: Verify library
        run: |
          file subtitle_pes_tap.so
          arm-linux-gnueabihf-readelf -h subtitle_pes_tap.so
          arm-linux-gnueabihf-readelf -d subtitle_pes_tap.so

      - name: Strip library
        run: |
          arm-linux-gnueabihf-strip --strip-unneeded subtitle_pes_tap.so

      - name: Final verification
        run: |
          file subtitle_pes_tap.so
          ls -lh subtitle_pes_tap.so

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: subtitle_pes_tap-armv7l
          path: subtitle_pes_tap.so
          if-no-files-found: error
