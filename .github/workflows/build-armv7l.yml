name: Build subtitle_pes_tap ARMv7l

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Create C source
        run: |
          cat > subtitle_pes_tap.c <<'EOF'
          #define _GNU_SOURCE

          #include <dlfcn.h>
          #include <errno.h>
          #include <pthread.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/socket.h>
          #include <sys/un.h>
          #include <unistd.h>

          #define SOCKET_PATH "/tmp/dvbsubtitle_pes.sock"
          #define QUEUE_SIZE 8
          #define MAX_PES_SIZE (256 * 1024)

          typedef int (*inject_fn_t)(
              void *handle,
              int selector,
              const void *data,
              unsigned int length
          );

          typedef struct {
              unsigned char *data;
              unsigned int length;
              unsigned int selector;
          } pes_packet_t;

          static inject_fn_t real_inject = NULL;

          static pthread_t sender_thread;
          static pthread_mutex_t queue_mutex =
              PTHREAD_MUTEX_INITIALIZER;
          static pthread_cond_t queue_cond =
              PTHREAD_COND_INITIALIZER;

          static pes_packet_t queue[QUEUE_SIZE];
          static unsigned int queue_head = 0;
          static unsigned int queue_tail = 0;
          static unsigned int queue_count = 0;
          static int sender_started = 0;

          static void resolve_real_function(void)
          {
              if (real_inject != NULL)
                  return;

              dlerror();

              real_inject =
                  (inject_fn_t)dlsym(
                      RTLD_NEXT,
                      "HI_UNF_SUBT_InjectData"
                  );
          }

          static int send_all(
              int fd,
              const void *buffer,
              size_t length
          )
          {
              const unsigned char *p =
                  (const unsigned char *)buffer;

              while (length > 0)
              {
                  ssize_t n =
                      send(fd, p, length, MSG_NOSIGNAL);

                  if (n < 0)
                  {
                      if (errno == EINTR)
                          continue;

                      return -1;
                  }

                  if (n == 0)
                      return -1;

                  p += n;
                  length -= (size_t)n;
              }

              return 0;
          }

          static int connect_socket(void)
          {
              int fd;
              struct sockaddr_un addr;

              fd = socket(AF_UNIX, SOCK_STREAM, 0);

              if (fd < 0)
                  return -1;

              memset(&addr, 0, sizeof(addr));

              addr.sun_family = AF_UNIX;

              strncpy(
                  addr.sun_path,
                  SOCKET_PATH,
                  sizeof(addr.sun_path) - 1
              );

              if (connect(
                      fd,
                      (struct sockaddr *)&addr,
                      sizeof(addr)
                  ) < 0)
              {
                  close(fd);
                  return -1;
              }

              return fd;
          }

          static void *sender_loop(void *unused)
          {
              (void)unused;

              for (;;)
              {
                  pes_packet_t packet;

                  memset(&packet, 0, sizeof(packet));

                  pthread_mutex_lock(&queue_mutex);

                  while (queue_count == 0)
                  {
                      pthread_cond_wait(
                          &queue_cond,
                          &queue_mutex
                      );
                  }

                  packet = queue[queue_head];

                  queue[queue_head].data = NULL;
                  queue[queue_head].length = 0;
                  queue[queue_head].selector = 0;

                  queue_head =
                      (queue_head + 1) % QUEUE_SIZE;

                  queue_count--;

                  pthread_mutex_unlock(&queue_mutex);

                  int fd = connect_socket();

                  if (fd >= 0)
                  {
                      uint32_t header[2];

                      header[0] = packet.length;
                      header[1] = packet.selector;

                      if (send_all(
                              fd,
                              header,
                              sizeof(header)
                          ) == 0)
                      {
                          send_all(
                              fd,
                              packet.data,
                              packet.length
                          );
                      }

                      close(fd);
                  }

                  free(packet.data);
              }

              return NULL;
          }

          static void start_sender(void)
          {
              pthread_mutex_lock(&queue_mutex);

              if (!sender_started)
              {
                  sender_started = 1;

                  if (pthread_create(
                          &sender_thread,
                          NULL,
                          sender_loop,
                          NULL
                      ) != 0)
                  {
                      sender_started = 0;
                  }
                  else
                  {
                      pthread_detach(sender_thread);
                  }
              }

              pthread_mutex_unlock(&queue_mutex);
          }

          static void queue_pes(
              const void *data,
              unsigned int length,
              unsigned int selector
          )
          {
              if (data == NULL || length == 0)
                  return;

              if (length > MAX_PES_SIZE)
                  return;

              unsigned char *copy =
                  (unsigned char *)malloc(length);

              if (copy == NULL)
                  return;

              memcpy(copy, data, length);

              pthread_mutex_lock(&queue_mutex);

              if (queue_count >= QUEUE_SIZE)
              {
                  free(queue[queue_head].data);

                  queue[queue_head].data = NULL;
                  queue[queue_head].length = 0;
                  queue[queue_head].selector = 0;

                  queue_head =
                      (queue_head + 1) % QUEUE_SIZE;

                  queue_count--;
              }

              queue[queue_tail].data = copy;
              queue[queue_tail].length = length;
              queue[queue_tail].selector = selector;

              queue_tail =
                  (queue_tail + 1) % QUEUE_SIZE;

              queue_count++;

              pthread_cond_signal(&queue_cond);

              pthread_mutex_unlock(&queue_mutex);
          }

          int HI_UNF_SUBT_InjectData(
              void *handle,
              int selector,
              const void *data,
              unsigned int length
          )
          {
              resolve_real_function();

              start_sender();

              queue_pes(
                  data,
                  length,
                  (unsigned int)selector
              );

              if (real_inject != NULL)
              {
                  return real_inject(
                      handle,
                      selector,
                      data,
                      length
                  );
              }

              return -1;
          }

          __attribute__((constructor))
          static void tap_constructor(void)
          {
              start_sender();
          }
          EOF

      - name: Install ARMv7 hard-float toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            binutils-arm-linux-gnueabihf

      - name: Build ARMv7 hard-float
        run: |
          arm-linux-gnueabihf-gcc \
            -shared \
            -fPIC \
            -O2 \
            -march=armv7-a \
            -mfpu=neon-vfpv4 \
            -mfloat-abi=hard \
            -pthread \
            -ldl \
            -o subtitle_pes_tap.so \
            subtitle_pes_tap.c

      - name: Verify
        run: |
          file subtitle_pes_tap.so
          arm-linux-gnueabihf-readelf -h subtitle_pes_tap.so
          arm-linux-gnueabihf-readelf -A subtitle_pes_tap.so

      - name: Strip
        run: |
          arm-linux-gnueabihf-strip \
            --strip-unneeded \
            subtitle_pes_tap.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: subtitle_pes_tap-armv7l
          path: subtitle_pes_tap.so
          if-no-files-found: error
