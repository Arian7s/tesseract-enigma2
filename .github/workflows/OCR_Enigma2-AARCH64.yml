name: Build Tesseract OCR for Enigma2 (AArch64 - Self-Contained Versioned 3 Files)

on:
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install host toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          autoconf automake libtool pkg-config make wget git cmake \
          ca-certificates patchelf xz-utils

    - name: Build static dependencies (PIC)
      run: |
        set -euxo pipefail

        export CROSS=aarch64-linux-gnu
        export CC=${CROSS}-gcc
        export CXX=${CROSS}-g++
        export AR=${CROSS}-ar
        export RANLIB=${CROSS}-ranlib
        export STRIP=${CROSS}-strip

        export WORK=$PWD
        export PREFIX=$WORK/sysroot
        mkdir -p "$PREFIX"

        export CFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CXXFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CPPFLAGS="-I$PREFIX/include"
        export LDFLAGS="-L$PREFIX/lib"
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

        fetch() { wget -q --no-check-certificate -O "$2" "$1"; }

        # ---------- zlib 1.3.2 (static only) ----------
        fetch https://zlib.net/fossils/zlib-1.3.2.tar.gz zlib.tar.gz
        tar xf zlib.tar.gz
        ( cd zlib-1.3.2
          CFLAGS="-O2 -fPIC" CHOST=$CROSS ./configure --prefix="$PREFIX" --static
          make -j$(nproc) && make install
          rm -f "$PREFIX"/lib/libz.so* )

        # ---------- libjpeg-turbo 3.2.0 (static only) ----------
        fetch https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0.tar.gz ljt.tar.gz
        tar xf ljt.tar.gz
        ( cd libjpeg-turbo-3.2.0 && mkdir build && cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_C_FLAGS="-O2 -fPIC" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DENABLE_SHARED=OFF -DENABLE_STATIC=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DWITH_JPEG8=ON -DWITH_SIMD=OFF \
            ..
          make -j$(nproc) && make install
          rm -f "$PREFIX"/lib/libjpeg.so* "$PREFIX"/lib/libturbojpeg.so* )

        # ---------- libpng 1.6.58 (static only) ----------
        fetch https://download.sourceforge.net/libpng/libpng-1.6.58.tar.xz libpng.tar.xz
        tar xf libpng.tar.xz
        ( cd libpng-1.6.58
          CFLAGS="-O2 -fPIC" ./configure --host=$CROSS --prefix="$PREFIX" \
            --disable-shared --enable-static
          make -j$(nproc) && make install
          rm -f "$PREFIX"/lib/libpng*.so* )

        # ---------- libtiff 4.7.2 (static only) ----------
        fetch https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz tiff.tar.gz
        tar xf tiff.tar.gz
        ( cd tiff-4.7.2
          CFLAGS="-O2 -fPIC" ./configure --host=$CROSS --prefix="$PREFIX" \
            --disable-shared --enable-static \
            --disable-lzma --disable-zstd --disable-webp --disable-jbig --disable-jpeg
          make -j$(nproc) && make install
          rm -f "$PREFIX"/lib/libtiff*.so* )

        echo "===== sysroot/lib content (should be only .a files + .la) ====="
        ls -la "$PREFIX/lib"

    - name: Build libleptonica.so (linked against static deps)
      run: |
        set -euxo pipefail

        export CROSS=aarch64-linux-gnu
        export CC=${CROSS}-gcc
        export CXX=${CROSS}-g++
        export STRIP=${CROSS}-strip

        export WORK=$PWD
        export PREFIX=$WORK/sysroot

        export CFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CXXFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CPPFLAGS="-I$PREFIX/include"
        export LDFLAGS="-L$PREFIX/lib -Wl,-Bstatic -ljpeg -lpng -ltiff -lz -Wl,-Bdynamic"
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
        export LIBS="-Wl,-Bstatic -ljpeg -lpng -ltiff -lz -Wl,-Bdynamic -lm"

        fetch() { wget -q --no-check-certificate -O "$2" "$1"; }
        fetch https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz lep.tar.gz
        tar xf lep.tar.gz
        cd leptonica-1.87.0

        ./configure --host=$CROSS --prefix="$PREFIX" \
          --enable-shared --disable-static \
          --without-libwebp --without-libopenjpeg \
          --without-giflib --without-libarchive

        make -j$(nproc)

        LEPT_BUILT=$(find src/.libs -name 'libleptonica.so.*' -type f | head -n 1)
        echo "LEPT_BUILT = $LEPT_BUILT"
        echo "===== NEEDED of libleptonica.so (before install) ====="
        aarch64-linux-gnu-objdump -p "$LEPT_BUILT" | grep NEEDED || true

        make install

    - name: Build Tesseract (shared lib + binary)
      run: |
        set -euxo pipefail

        export CROSS=aarch64-linux-gnu
        export CC=${CROSS}-gcc
        export CXX=${CROSS}-g++
        export STRIP=${CROSS}-strip

        export WORK=$PWD
        export PREFIX=$WORK/sysroot

        export CFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CXXFLAGS="-O2 -fPIC -I$PREFIX/include"
        export CPPFLAGS="-I$PREFIX/include"
        export LDFLAGS="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib"
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
        export LIBLEPT_HEADERSDIR="$PREFIX/include"

        fetch() { wget -q --no-check-certificate -O "$2" "$1"; }
        fetch https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz tess.tar.gz
        tar xf tess.tar.gz
        cd tesseract-5.5.3

        sed -i 's|return TESSERACT_VERSION_STR;|return "5.5.3 - Compile ByArian";|' src/api/baseapi.cpp || true
        sed -i 's|"/usr/share/tessdata/"|"/usr/share/tessdata/;/media/hdd/tessdata/;/media/usb/tessdata/"|' src/ccutil/mainblk.cpp || true

        ./autogen.sh
        ./configure --host=$CROSS --prefix=/usr \
          --enable-shared --disable-static --disable-debug \
          --disable-icu --without-pango --without-cairo --without-libarchive

        make -j$(nproc)
        make install DESTDIR=$WORK/build_out

    - name: Reduce to 3 files + patch SONAME (versioned)
      run: |
        set -euxo pipefail

        # =========================================================
        # FORCE the version names to match project version
        # (NOT the libtool internal version like 5.0.5)
        # =========================================================
        TESS_VER="5.5.3"
        LEPT_VER="6.0.0"

        echo "TESS_VER = $TESS_VER"
        echo "LEPT_VER = $LEPT_VER"

        mkdir -p package/usr/bin package/usr/lib

        TESS_BIN=$(find build_out/usr/bin -name 'tesseract' -type f | head -n 1)
        LIB_TESS=$(find build_out/usr/lib -name 'libtesseract.so.*' -type f | head -n 1)
        LIB_LEPT=$(find sysroot/lib -name 'libleptonica.so.*' -type f | head -n 1)

        echo "TESS_BIN = $TESS_BIN"
        echo "LIB_TESS = $LIB_TESS"
        echo "LIB_LEPT = $LIB_LEPT"

        [ -f "$TESS_BIN" ] || { echo "ERROR: tesseract not found"; exit 1; }
        [ -f "$LIB_TESS" ] || { echo "ERROR: libtesseract not found"; exit 1; }
        [ -f "$LIB_LEPT" ] || { echo "ERROR: libleptonica not found"; exit 1; }

        # Show original NEEDED before patching
        echo "===== Original NEEDED (tesseract) ====="
        aarch64-linux-gnu-objdump -p "$TESS_BIN" | grep NEEDED || true

        echo "===== Original SONAME (libtesseract) ====="
        aarch64-linux-gnu-objdump -p "$LIB_TESS" | grep SONAME || true

        echo "===== Original SONAME (libleptonica) ====="
        aarch64-linux-gnu-objdump -p "$LIB_LEPT" | grep SONAME || true

        # Copy with the final forced names
        cp "$TESS_BIN"  package/usr/bin/tesseract
        cp "$LIB_TESS"  "package/usr/lib/libtesseract.so.${TESS_VER}"
        cp "$LIB_LEPT"  "package/usr/lib/libleptonica.so.${LEPT_VER}"

        # Strip (safe strip)
        aarch64-linux-gnu-strip --strip-all       package/usr/bin/tesseract
        aarch64-linux-gnu-strip --strip-unneeded  "package/usr/lib/libtesseract.so.${TESS_VER}"
        aarch64-linux-gnu-strip --strip-unneeded  "package/usr/lib/libleptonica.so.${LEPT_VER}"

        # Set SONAME to the forced version names
        patchelf --set-soname "libtesseract.so.${TESS_VER}" "package/usr/lib/libtesseract.so.${TESS_VER}"
        patchelf --set-soname "libleptonica.so.${LEPT_VER}" "package/usr/lib/libleptonica.so.${LEPT_VER}"

        # Fix NEEDED in tesseract: replace every possible old name
        # (libtool SONAME can be libtesseract.so.5 or libtesseract.so.5.0.5)
        for OLD in libtesseract.so libtesseract.so.5 libtesseract.so.5.0.5 libtesseract.so.5.5.3; do
          patchelf --replace-needed "$OLD" "libtesseract.so.${TESS_VER}" package/usr/bin/tesseract 2>/dev/null || true
        done
        for OLD in libleptonica.so libleptonica.so.6 libleptonica.so.6.0.0; do
          patchelf --replace-needed "$OLD" "libleptonica.so.${LEPT_VER}" package/usr/bin/tesseract 2>/dev/null || true
        done

        # Fix NEEDED in libtesseract.so
        for OLD in libleptonica.so libleptonica.so.6 libleptonica.so.6.0.0; do
          patchelf --replace-needed "$OLD" "libleptonica.so.${LEPT_VER}" \
            "package/usr/lib/libtesseract.so.${TESS_VER}" 2>/dev/null || true
        done

        # Set RPATH
        patchelf --set-rpath /usr/lib package/usr/bin/tesseract
        patchelf --set-rpath /usr/lib "package/usr/lib/libtesseract.so.${TESS_VER}"
        patchelf --set-rpath /usr/lib "package/usr/lib/libleptonica.so.${LEPT_VER}"

        chmod -R 777 package

        echo
        echo "===== Final content (must be 3 files) ====="
        find package -type f -o -type l | sort

        echo
        echo "===== Final SONAME (libtesseract) ====="
        aarch64-linux-gnu-objdump -p "package/usr/lib/libtesseract.so.${TESS_VER}" | grep SONAME

        echo
        echo "===== Final SONAME (libleptonica) ====="
        aarch64-linux-gnu-objdump -p "package/usr/lib/libleptonica.so.${LEPT_VER}" | grep SONAME

        echo
        echo "===== Final NEEDED of tesseract ====="
        aarch64-linux-gnu-objdump -p package/usr/bin/tesseract | grep NEEDED

        echo
        echo "===== Final NEEDED of libtesseract ====="
        aarch64-linux-gnu-objdump -p "package/usr/lib/libtesseract.so.${TESS_VER}" | grep NEEDED

        echo
        echo "===== Final NEEDED of libleptonica ====="
        aarch64-linux-gnu-objdump -p "package/usr/lib/libleptonica.so.${LEPT_VER}" | grep NEEDED

        echo
        echo "===== Symbol check ====="
        aarch64-linux-gnu-nm -D "package/usr/lib/libtesseract.so.${TESS_VER}" | grep -i neon_available || echo "neon_available not found (may still be OK if stripped)"

        echo
        echo "===== Sizes ====="
        ls -lh package/usr/bin/tesseract package/usr/lib/*.so*

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tesseract-enigma2-aarch64-selfcontained-versioned
        path: package/
